<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RRBe – Race &amp; Rhythm Beat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const W = 960, H = 640;
const BPM = 128;
const BEAT_S = 60 / BPM;
const STEP_S = BEAT_S / 4;
const NUM_LANES = 4;
const NOTE_SCROLL_TIME = 2.0;
const SONG_BARS = 48;
const SONG_DURATION = SONG_BARS * 4 * BEAT_S;

// Perspective
const VX = W / 2;        // vanishing point X (480)
const VY = 85;            // vanishing point Y
const ROAD_BOTTOM = 570;  // road bottom edge
const ROAD_HW = 340;      // half-width at bottom
const PERSP_POW = 1.5;    // perspective curve exponent

// Timing windows (seconds)
const T_PERFECT = 0.042;
const T_GREAT   = 0.084;
const T_GOOD    = 0.130;
const T_BAD     = 0.180;
const T_MISS    = 0.220;

// Lane setup
const LANE_COLORS = ['#ff44aa', '#00ccff', '#44ff44', '#ffaa00'];
const LANE_ARROWS = ['←', '↓', '↑', '→'];
const LANE_KEYS   = ['ArrowLeft', 'ArrowDown', 'ArrowUp', 'ArrowRight'];
const LANE_GLOW   = ['#ff88cc', '#44eeff', '#88ff88', '#ffcc44'];

// Judgment
const JUDGE_COLORS = {
  PERFECT: '#00ffff', GREAT: '#44ff44',
  GOOD: '#ffff00', BAD: '#ff8800', MISS: '#ff2244'
};
const JUDGE_SCORE = { PERFECT: 100, GREAT: 80, GOOD: 50, BAD: 20, MISS: 0 };

// Health
const HP_MAX = 100;
const HP_CHANGE = { PERFECT: 1.0, GREAT: 0.5, GOOD: 0, BAD: -3, MISS: -5 };

// Audio
const BASS_NOTES = [55, 55, 73.4, 55, 65.4, 55, 73.4, 82.4];
const PENTA = [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99];
const MELODY = [
  0, -1, 2,  4,  5, -1, 4,  2,
  0, -1, 2,  4,  7,  5, 4,  2,
  0, -1, 2,  5,  7, -1, 9,  7,
  5,  4, 2,  0,  2, -1, -1, 4
];

const KICK_STEPS   = new Set([0, 4, 8, 12]);
const SNARE_STEPS  = new Set([4, 12]);
const OHIHAT_STEPS = new Set([6, 14]);
const BASS_STEPS   = new Set([0, 2, 4, 6, 8, 10, 12, 14]);
const SYNTH_STEPS  = new Set([0, 4, 8, 12]);

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx = null, masterGain = null;
let nextStepTime = 0, stepCount = 0, beatCount = 0;
let melodyPos = 0, bassNoteIdx = 0;
let audioStarted = false;
let gameStartTime = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.40;
  masterGain.connect(audioCtx.destination);
  nextStepTime = audioCtx.currentTime + 0.1;
  stepCount = 0; beatCount = 0; melodyPos = 0; bassNoteIdx = 0;
  audioStarted = true;
}

function playKick(time) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sine';
  o.frequency.setValueAtTime(180, time);
  o.frequency.exponentialRampToValueAtTime(40, time + 0.08);
  g.gain.setValueAtTime(1.0, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  o.start(time); o.stop(time + 0.3);
}

function playSnare(time) {
  const len = Math.floor(audioCtx.sampleRate * 0.12);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200;
  const g = audioCtx.createGain();
  n.connect(f); f.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0.7, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  n.start(time); n.stop(time + 0.15);
}

function playHihat(time, open) {
  const len = Math.floor(audioCtx.sampleRate * 0.06);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  const g = audioCtx.createGain();
  n.connect(f); f.connect(g); g.connect(masterGain);
  const dur = open ? 0.12 : 0.04;
  g.gain.setValueAtTime(0.25, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  n.start(time); n.stop(time + dur);
}

function playBass(time, freq, dur) {
  dur = dur || 0.22;
  const o = audioCtx.createOscillator();
  const f = audioCtx.createBiquadFilter();
  const g = audioCtx.createGain();
  o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 400;
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0.5, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o.start(time); o.stop(time + dur);
}

function playSynth(time, freq, dur) {
  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o1.type = 'square'; o2.type = 'square';
  o1.frequency.setValueAtTime(freq, time);
  o2.frequency.setValueAtTime(freq * 1.006, time);
  o1.connect(g); o2.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0.12, time);
  g.gain.setValueAtTime(0.12, time + dur * 0.75);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o1.start(time); o2.start(time);
  o1.stop(time + dur); o2.stop(time + dur);
}

// SFX
function sfxPerfect(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sine'; o.frequency.setValueAtTime(880, t);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.start(t); o.stop(t + 0.12);
  const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
  o2.connect(g2); g2.connect(masterGain);
  o2.type = 'sine'; o2.frequency.setValueAtTime(1320, t + 0.05);
  g2.gain.setValueAtTime(0.2, t + 0.05);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o2.start(t + 0.05); o2.stop(t + 0.15);
}

function sfxGreat(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sine'; o.frequency.setValueAtTime(660, t);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
  o.start(t); o.stop(t + 0.10);
}

function sfxMiss(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.15);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.start(t); o.stop(t + 0.15);
}

// Audio scheduler
function scheduleAudio() {
  if (!audioCtx || gameState !== 'PLAYING') return;
  while (nextStepTime < audioCtx.currentTime + 0.1) {
    const step = stepCount % 16;
    const t = nextStepTime;
    if (KICK_STEPS.has(step))  playKick(t);
    if (SNARE_STEPS.has(step)) playSnare(t);
    if (OHIHAT_STEPS.has(step)) playHihat(t, true);
    else playHihat(t, false);
    if (BASS_STEPS.has(step)) {
      playBass(t, BASS_NOTES[(stepCount / 2 | 0) % BASS_NOTES.length]);
    }
    if (SYNTH_STEPS.has(step)) {
      const ni = MELODY[melodyPos % MELODY.length];
      if (ni >= 0) playSynth(t, PENTA[ni % PENTA.length], BEAT_S * 0.85);
      melodyPos++;
    }
    if (step === 0) { beatCount++; beatFlash = 1.0; }
    stepCount++;
    nextStepTime += STEP_S;
  }
}

// ============================================================
// NOTE CHART GENERATOR
// ============================================================
function generateChart() {
  const notes = [];
  const bt = BEAT_S;

  // Pattern sets: arrays of [beatOffset, lane] per bar (4 beats = 1 bar)
  const easy = [
    [[0,0],[2,3]],
    [[0,2],[2,1]],
    [[1,0],[3,3]],
    [[0,1],[2,2]],
    [[0,0],[1,3],[2,1],[3,2]],
    [[0,3],[1,0],[2,2],[3,1]],
    [[0,0],[2,2]],
    [[0,1],[2,3]],
  ];

  const normal = [
    [[0,0],[1,1],[2,2],[3,3]],
    [[0,3],[1,2],[2,1],[3,0]],
    [[0,0],[0.5,1],[2,2],[2.5,3]],
    [[0,1],[0.5,0],[2,3],[2.5,2]],
    [[0,2],[1,0],[2,3],[3,1]],
    [[0,0],[1,3],[2,1],[3,2]],
    [[0.5,0],[1.5,1],[2.5,2],[3.5,3]],
    [[0,0],[0.5,3],[1,1],[1.5,2],[2,0],[3,3]],
    [[0,2],[0.5,1],[1,3],[2,0],[2.5,1],[3,2]],
    [[0,0],[1,1],[2,3],[3,2]],
  ];

  const hard = [
    [[0,0],[0.5,1],[1,2],[1.5,3],[2,3],[2.5,2],[3,1],[3.5,0]],
    [[0,0],[0.5,0],[1,3],[1.5,3],[2,1],[2.5,1],[3,2],[3.5,2]],
    [[0,1],[0.5,2],[1,0],[1.5,3],[2,2],[2.5,1],[3,3],[3.5,0]],
    [[0,0],[0.5,3],[1,1],[1.5,2],[2,0],[2.5,3],[3,1],[3.5,2]],
    [[0,2],[0.5,0],[1,3],[1.5,1],[2,0],[2.5,2],[3,1],[3.5,3]],
    [[0,0],[0.5,1],[1,3],[1.5,2],[2,1],[2.5,0],[3,2],[3.5,3]],
    [[0,3],[0.5,2],[1,1],[1.5,0],[2,0],[2.5,1],[3,2],[3.5,3]],
    [[0,0],[0.25,1],[0.5,2],[0.75,3],[2,3],[2.25,2],[2.5,1],[2.75,0]],
  ];

  const expert = [
    [[0,0],[0.25,1],[0.5,2],[0.75,3],[1,0],[1.5,2],[2,3],[2.5,1],[3,0],[3.25,1],[3.5,2],[3.75,3]],
    [[0,3],[0.25,2],[0.5,1],[0.75,0],[1,1],[1.5,3],[2,0],[2.5,2],[3,3],[3.25,2],[3.5,1],[3.75,0]],
    [[0,0],[0.5,1],[1,2],[1.5,3],[2,0],[2.25,1],[2.5,2],[2.75,3],[3,0],[3.5,3]],
    [[0,2],[0.5,0],[1,3],[1.5,1],[2,0],[2.5,2],[3,1],[3.25,0],[3.5,3],[3.75,2]],
  ];

  for (let bar = 0; bar < SONG_BARS; bar++) {
    let pats, pi;
    if (bar < 2) continue;
    else if (bar < 10) { pats = easy;   pi = (bar - 2) % easy.length; }
    else if (bar < 22) { pats = normal; pi = (bar - 10) % normal.length; }
    else if (bar < 38) { pats = hard;   pi = (bar - 22) % hard.length; }
    else               { pats = expert; pi = (bar - 38) % expert.length; }

    for (const [bOff, lane] of pats[pi]) {
      notes.push({
        time: (bar * 4 + bOff) * bt,
        lane,
        judged: false,
        judgment: null,
        hitTime: 0
      });
    }
  }

  notes.sort((a, b) => a.time - b.time);
  return notes;
}

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'START';
let notes = [];
let score = 0, combo = 0, maxCombo = 0;
let health = HP_MAX;
let judgeCounts = { PERFECT: 0, GREAT: 0, GOOD: 0, BAD: 0, MISS: 0 };
let accuracy = 100;
let lastJudge = null, judgeTimer = 0;
let beatFlash = 0;
let dt = 0, lastTime = 0;
let particles = [];
let roadScroll = 0;
let charPhase = 0;
let totalNotes = 0;
let laneFlash = [0, 0, 0, 0]; // per-lane flash when pressed

// ============================================================
// PERSPECTIVE MATH
// ============================================================
function zToScreen(wz) {
  const t = Math.pow(Math.max(0, wz), PERSP_POW);
  return {
    y: VY + (ROAD_BOTTOM - VY) * t,
    hw: ROAD_HW * t,
    t
  };
}

function laneX(lane, wz) {
  const s = zToScreen(wz);
  const lw = s.hw * 2 / NUM_LANES;
  return VX - s.hw + (lane + 0.5) * lw;
}

// ============================================================
// PARTICLES
// ============================================================
function spawnPart(x, y, color, count) {
  for (let i = 0; i < count && particles.length < 200; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 100,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

function updatePart(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawPart() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
// INPUT
// ============================================================
const keys = {};
const justPressed = {};

window.addEventListener('keydown', (e) => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }

  if (gameState === 'START' && e.code === 'Space') {
    startGame();
  } else if ((gameState === 'GAMEOVER' || gameState === 'RESULT') && (e.code === 'KeyR' || e.code === 'Space')) {
    resetToStart();
  } else if (gameState === 'PLAYING') {
    const li = LANE_KEYS.indexOf(e.code);
    if (li >= 0 && justPressed[e.code]) {
      judgeKeyPress(li);
      laneFlash[li] = 1.0;
    }
  }
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ============================================================
// TIMING / JUDGMENT
// ============================================================
function musicTime() {
  if (!audioCtx) return 0;
  return audioCtx.currentTime - gameStartTime;
}

function judgeKeyPress(lane) {
  const now = musicTime();
  let best = null, bestDiff = Infinity;

  for (const n of notes) {
    if (n.judged || n.lane !== lane) continue;
    const diff = Math.abs(n.time - now);
    if (diff < bestDiff && diff < T_MISS) {
      bestDiff = diff;
      best = n;
    }
  }

  if (!best) return;

  best.judged = true;
  best.hitTime = now;

  let j;
  if (bestDiff <= T_PERFECT)    j = 'PERFECT';
  else if (bestDiff <= T_GREAT) j = 'GREAT';
  else if (bestDiff <= T_GOOD)  j = 'GOOD';
  else                          j = 'BAD';

  best.judgment = j;
  judgeCounts[j]++;

  if (j === 'BAD') {
    combo = 0;
  } else {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
  }

  const mult = Math.floor(combo / 10) + 1;
  score += JUDGE_SCORE[j] * mult;
  health = Math.min(HP_MAX, Math.max(0, health + HP_CHANGE[j]));

  lastJudge = j;
  judgeTimer = 0.5;

  // FX
  const sx = laneX(lane, 1.0);
  const sy = zToScreen(1.0).y;
  spawnPart(sx, sy, LANE_COLORS[lane], j === 'PERFECT' ? 20 : j === 'GREAT' ? 14 : 8);

  if (audioCtx) {
    const t = audioCtx.currentTime;
    if (j === 'PERFECT') sfxPerfect(t);
    else if (j === 'GREAT') sfxGreat(t);
  }

  updateAccuracy();
}

function processAutoMisses() {
  const now = musicTime();
  for (const n of notes) {
    if (n.judged) continue;
    if (now > n.time + T_MISS) {
      n.judged = true;
      n.judgment = 'MISS';
      judgeCounts.MISS++;
      combo = 0;
      health = Math.max(0, health + HP_CHANGE.MISS);
      lastJudge = 'MISS';
      judgeTimer = 0.35;
      updateAccuracy();
    }
  }
}

function updateAccuracy() {
  const tot = judgeCounts.PERFECT + judgeCounts.GREAT + judgeCounts.GOOD + judgeCounts.BAD + judgeCounts.MISS;
  if (tot === 0) { accuracy = 100; return; }
  const s = judgeCounts.PERFECT * 100 + judgeCounts.GREAT * 80 + judgeCounts.GOOD * 50 + judgeCounts.BAD * 20;
  accuracy = s / (tot * 100) * 100;
}

// ============================================================
// UPDATE
// ============================================================
function update(deltaT) {
  if (gameState !== 'PLAYING') return;

  scheduleAudio();
  processAutoMisses();

  beatFlash = Math.max(0, beatFlash - deltaT * 4);
  judgeTimer = Math.max(0, judgeTimer - deltaT);
  for (let i = 0; i < 4; i++) laneFlash[i] = Math.max(0, laneFlash[i] - deltaT * 6);

  updatePart(deltaT);

  roadScroll = (roadScroll + deltaT * 1.2) % 1.0;
  charPhase += deltaT * 9;

  if (health <= 0) {
    gameState = 'GAMEOVER';
    return;
  }

  const now = musicTime();
  const allDone = notes.length > 0 && notes.every(n => n.judged);
  if (allDone && now > notes[notes.length - 1].time + 2.5) {
    gameState = 'RESULT';
  }
}

// ============================================================
// RENDERING: Background
// ============================================================
function pseudoRand(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function drawBg() {
  // Sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, VY + 60);
  g.addColorStop(0, '#05000d');
  g.addColorStop(0.6, '#0a0020');
  g.addColorStop(1, '#001020');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.save();
  for (let i = 0; i < 100; i++) {
    const sx = pseudoRand(i * 3 + 42) * W;
    const sy = pseudoRand(i * 3 + 43) * (VY + 20);
    const sr = pseudoRand(i * 3 + 44) * 1.2 + 0.3;
    ctx.globalAlpha = 0.3 + pseudoRand(i + 99) * 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Ground fill
  const gg = ctx.createLinearGradient(0, VY, 0, H);
  gg.addColorStop(0, '#030308');
  gg.addColorStop(1, '#020206');
  ctx.fillStyle = gg;
  ctx.fillRect(0, VY, W, H - VY);

  // Horizon glow
  const hg = ctx.createRadialGradient(VX, VY, 0, VX, VY, 250);
  hg.addColorStop(0, 'rgba(60,120,200,0.25)');
  hg.addColorStop(0.5, 'rgba(30,60,120,0.10)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, VY - 60, W, 200);
}

// ============================================================
// RENDERING: Track
// ============================================================
function drawTrack() {
  // Road surface
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(VX, VY);
  const bl = VX - ROAD_HW, br = VX + ROAD_HW;
  ctx.lineTo(bl, ROAD_BOTTOM);
  ctx.lineTo(bl, H);
  ctx.lineTo(br, H);
  ctx.lineTo(br, ROAD_BOTTOM);
  ctx.closePath();
  const rg = ctx.createLinearGradient(VX, VY, VX, H);
  rg.addColorStop(0, '#08080f');
  rg.addColorStop(1, '#0c0c18');
  ctx.fillStyle = rg;
  ctx.fill();
  ctx.restore();

  // Scrolling horizontal road lines
  const NUM_LINES = 22;
  ctx.save();
  for (let i = 0; i < NUM_LINES; i++) {
    const z = (i + roadScroll) / NUM_LINES;
    const s = zToScreen(z);
    if (s.t < 0.005) continue;
    const alpha = Math.min(1, s.t * 1.5) * 0.25;
    ctx.strokeStyle = `rgba(50,80,140,${alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(VX - s.hw, s.y);
    ctx.lineTo(VX + s.hw, s.y);
    ctx.stroke();
  }
  ctx.restore();

  // Lane dividers
  ctx.save();
  for (let i = 1; i < NUM_LANES; i++) {
    const wx = -0.5 + i / NUM_LANES;
    const nearX = VX + wx * ROAD_HW * 2;
    ctx.strokeStyle = 'rgba(60,100,180,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    ctx.moveTo(VX, VY);
    ctx.lineTo(nearX, ROAD_BOTTOM);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();

  // Road edges (neon)
  ctx.save();
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#0088ff';
  ctx.strokeStyle = '#0088ff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(VX, VY); ctx.lineTo(VX - ROAD_HW, ROAD_BOTTOM); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(VX, VY); ctx.lineTo(VX + ROAD_HW, ROAD_BOTTOM); ctx.stroke();
  ctx.restore();

  // Side barriers
  drawSideBarriers();
}

function drawSideBarriers() {
  const NUM_POSTS = 12;
  ctx.save();
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < NUM_POSTS; i++) {
      let z = (i + roadScroll) / NUM_POSTS;
      const s = zToScreen(z);
      if (s.t < 0.01) continue;
      const x = VX + side * (s.hw + 8 * s.t);
      const h = 25 * s.t;
      const alpha = Math.min(1, s.t * 2) * 0.6;

      // Post
      ctx.fillStyle = `rgba(40,60,120,${alpha})`;
      ctx.fillRect(x - 2 * s.t, s.y - h, 4 * s.t, h);

      // Light on top
      ctx.fillStyle = `rgba(0,180,255,${alpha * 0.8})`;
      ctx.shadowColor = '#00aaff';
      ctx.shadowBlur = 8 * s.t;
      ctx.beginPath();
      ctx.arc(x, s.y - h, 3 * s.t, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

// ============================================================
// RENDERING: Judgment Line
// ============================================================
function drawJudgeLine() {
  const s = zToScreen(1.0);
  const y = s.y;
  const lx = VX - s.hw;
  const rx = VX + s.hw;

  ctx.save();
  // Glow line
  const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 1000 * 4);
  ctx.shadowColor = '#00ccff';
  ctx.shadowBlur = 18 * pulse;
  ctx.strokeStyle = `rgba(0,200,255,${0.6 * pulse})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(lx, y);
  ctx.lineTo(rx, y);
  ctx.stroke();

  // Lane receptor markers
  for (let i = 0; i < NUM_LANES; i++) {
    const x = laneX(i, 1.0);
    const flash = laneFlash[i];
    const baseAlpha = 0.3 + flash * 0.7;
    const size = 22 + flash * 8;

    ctx.shadowColor = LANE_COLORS[i];
    ctx.shadowBlur = 10 + flash * 20;

    // Outer ring
    ctx.strokeStyle = LANE_COLORS[i];
    ctx.globalAlpha = baseAlpha;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.stroke();

    // Inner fill on flash
    if (flash > 0.1) {
      ctx.fillStyle = LANE_COLORS[i];
      ctx.globalAlpha = flash * 0.3;
      ctx.beginPath();
      ctx.arc(x, y, size - 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Arrow label
    ctx.globalAlpha = baseAlpha * 0.8;
    ctx.fillStyle = LANE_COLORS[i];
    ctx.shadowBlur = 0;
    ctx.font = `bold ${16}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(LANE_ARROWS[i], x, y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ============================================================
// RENDERING: Notes
// ============================================================
function drawNotes() {
  const now = musicTime();

  // Sort far to near
  const visible = [];
  for (const n of notes) {
    const z = 1.0 - (n.time - now) / NOTE_SCROLL_TIME;
    if (z < -0.05 || z > 1.25) continue;
    if (n.judged && n.judgment !== 'MISS') continue; // hit notes disappear
    visible.push({ note: n, z });
  }
  visible.sort((a, b) => a.z - b.z);

  for (const { note: n, z } of visible) {
    if (z < 0.01) continue;
    const s = zToScreen(z);
    const x = laneX(n.lane, z);
    const y = s.y;
    const scale = s.t;
    const noteSize = 20 * scale + 4;

    ctx.save();

    if (n.judged && n.judgment === 'MISS') {
      // Missed notes fade to grey
      const fadeZ = z - 1.0;
      const alpha = Math.max(0, 1 - fadeZ * 5);
      ctx.globalAlpha = alpha * 0.4;
      ctx.fillStyle = '#555';
      ctx.beginPath();
      ctx.arc(x, y, noteSize * 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      continue;
    }

    const col = LANE_COLORS[n.lane];
    const glow = LANE_GLOW[n.lane];

    // Glow ring
    ctx.shadowColor = glow;
    ctx.shadowBlur = 15 * scale;

    // Near-judge-line brightness boost
    const nearBoost = z > 0.8 ? (z - 0.8) * 5 : 0;

    // Outer glow disc
    ctx.globalAlpha = (0.15 + nearBoost * 0.15) * Math.min(1, z * 3);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, noteSize * 1.6, 0, Math.PI * 2);
    ctx.fill();

    // Main note body
    ctx.globalAlpha = Math.min(1, z * 3);
    ctx.fillStyle = col;
    ctx.shadowBlur = 12 * scale;
    ctx.beginPath();
    ctx.arc(x, y, noteSize, 0, Math.PI * 2);
    ctx.fill();

    // Inner bright core
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = (0.3 + nearBoost * 0.3) * Math.min(1, z * 3);
    ctx.beginPath();
    ctx.arc(x, y, noteSize * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // Arrow text
    ctx.globalAlpha = Math.min(1, z * 4);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.font = `bold ${Math.max(8, Math.round(14 * scale + 4))}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(LANE_ARROWS[n.lane], x, y);

    ctx.restore();
  }
}

// ============================================================
// RENDERING: Character
// ============================================================
function drawCharacter() {
  const cx = VX;
  const baseY = ROAD_BOTTOM + 25;
  const phase = charPhase;

  // Running bounce
  const bounce = Math.abs(Math.sin(phase)) * 3;
  const legSwing = Math.sin(phase) * 12;

  ctx.save();
  ctx.translate(cx, baseY - bounce);

  const sc = 0.9;
  ctx.scale(sc, sc);

  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 28 + bounce, 18, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.strokeStyle = '#f0c8a0';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  // Left leg
  ctx.beginPath();
  ctx.moveTo(-6, 12);
  ctx.lineTo(-6 - legSwing * 0.4, 26);
  ctx.stroke();
  // Right leg
  ctx.beginPath();
  ctx.moveTo(6, 12);
  ctx.lineTo(6 + legSwing * 0.4, 26);
  ctx.stroke();

  // Shoes
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(-6 - legSwing * 0.4, 27, 4, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(6 + legSwing * 0.4, 27, 4, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body (shirt - white with red trim, like R2BEAT uniform)
  ctx.fillStyle = '#eee';
  ctx.beginPath();
  ctx.moveTo(-12, -6);
  ctx.lineTo(12, -6);
  ctx.lineTo(10, 14);
  ctx.lineTo(-10, 14);
  ctx.closePath();
  ctx.fill();
  // Red collar accent
  ctx.strokeStyle = '#cc2244';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-8, -6);
  ctx.lineTo(0, -2);
  ctx.lineTo(8, -6);
  ctx.stroke();

  // Arms
  const armSwing = Math.sin(phase + Math.PI) * 10;
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  // Left arm
  ctx.beginPath();
  ctx.moveTo(-12, -2);
  ctx.lineTo(-14 - armSwing * 0.3, 10);
  ctx.stroke();
  // Right arm
  ctx.beginPath();
  ctx.moveTo(12, -2);
  ctx.lineTo(14 + armSwing * 0.3, 10);
  ctx.stroke();

  // Hands
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath();
  ctx.arc(-14 - armSwing * 0.3, 11, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(14 + armSwing * 0.3, 11, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#f5d0b0';
  ctx.beginPath();
  ctx.arc(0, -16, 10, 0, Math.PI * 2);
  ctx.fill();

  // Hair (dark brown, back view - covers top and sides)
  ctx.fillStyle = '#3a2211';
  ctx.beginPath();
  ctx.arc(0, -18, 11, Math.PI * 0.9, Math.PI * 2.1);
  ctx.lineTo(11, -14);
  ctx.quadraticCurveTo(12, -8, 10, -6);
  ctx.lineTo(-10, -6);
  ctx.quadraticCurveTo(-12, -8, -11, -14);
  ctx.closePath();
  ctx.fill();

  // Hair spikes on top
  ctx.beginPath();
  ctx.moveTo(-6, -27);
  ctx.lineTo(-2, -22);
  ctx.lineTo(0, -30);
  ctx.lineTo(3, -22);
  ctx.lineTo(7, -28);
  ctx.lineTo(5, -20);
  ctx.lineTo(-5, -20);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ============================================================
// RENDERING: HUD
// ============================================================
function drawHUD() {
  ctx.save();

  // Beat flash overlay
  if (beatFlash > 0) {
    ctx.fillStyle = `rgba(30,80,200,${beatFlash * 0.08})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Combo (top center, BIG) ----
  if (combo > 0) {
    const comboSize = Math.min(80, 50 + combo * 0.3);
    const pulse = 1 + Math.sin(performance.now() / 100) * 0.03 * Math.min(combo, 30);

    ctx.save();
    ctx.translate(VX, 60);
    ctx.scale(pulse, pulse);

    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 25;
    ctx.fillStyle = '#ffee44';
    ctx.font = `bold ${comboSize}px 'Impact', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(combo, 0, 0);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffcc00';
    ctx.font = `bold 20px sans-serif`;
    ctx.fillText('COMBO', 0, comboSize / 2 + 14);

    ctx.restore();
  }

  // ---- Score (top right) ----
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#00ccff';
  ctx.fillStyle = '#00ddff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(`${score}`, W - 25, 18);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = 'rgba(100,200,255,0.7)';
  ctx.fillText('SCORE', W - 25, 44);

  // ---- Accuracy gauge (top-right circle) ----
  drawAccuracyGauge(W - 70, 110, 35);

  // ---- Judgment stats (left side) ----
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 16px sans-serif';

  ctx.fillStyle = '#00ddff';
  ctx.fillText(`判定 ${accuracy.toFixed(1)}%`, 18, 20);

  const stats = [
    ['PERFECT', judgeCounts.PERFECT, JUDGE_COLORS.PERFECT],
    ['GREAT',   judgeCounts.GREAT,   JUDGE_COLORS.GREAT],
    ['GOOD',    judgeCounts.GOOD,    JUDGE_COLORS.GOOD],
    ['BAD',     judgeCounts.BAD,     JUDGE_COLORS.BAD],
    ['MISS',    judgeCounts.MISS,    JUDGE_COLORS.MISS],
  ];
  ctx.font = '12px sans-serif';
  stats.forEach(([label, cnt, col], idx) => {
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.85;
    ctx.fillText(`${label}`, 18, 44 + idx * 18);
    ctx.fillText(`${cnt}`, 85, 44 + idx * 18);
  });
  ctx.globalAlpha = 1;

  // ---- Health bar (bottom, horizontal) ----
  const hbX = VX - 150, hbY = H - 20, hbW = 300, hbH = 8;
  ctx.fillStyle = 'rgba(30,30,60,0.7)';
  ctx.fillRect(hbX, hbY, hbW, hbH);
  const hpFrac = health / HP_MAX;
  const hpColor = hpFrac > 0.5 ? '#44ff88' : hpFrac > 0.25 ? '#ffcc00' : '#ff4444';
  ctx.fillStyle = hpColor;
  ctx.fillRect(hbX, hbY, hbW * hpFrac, hbH);
  ctx.strokeStyle = 'rgba(100,150,200,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hbX, hbY, hbW, hbH);

  // Health label
  ctx.fillStyle = 'rgba(200,220,255,0.6)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('LIFE', VX, H - 24);

  // ---- BPM (bottom-left) ----
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(100,200,255,0.5)';
  ctx.font = '11px sans-serif';
  ctx.fillText(`BPM ${BPM}`, 18, H - 16);

  // ---- Progress bar (bottom, thin) ----
  const now = musicTime();
  const prog = Math.min(1, now / SONG_DURATION);
  ctx.fillStyle = 'rgba(0,150,255,0.3)';
  ctx.fillRect(0, H - 3, W * prog, 3);

  ctx.restore();
}

function drawAccuracyGauge(cx, cy, r) {
  ctx.save();
  const startAngle = -Math.PI * 0.75;
  const endAngle = Math.PI * 0.75;
  const totalArc = endAngle - startAngle;

  // Background arc
  ctx.strokeStyle = 'rgba(40,50,80,0.6)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, endAngle);
  ctx.stroke();

  // Filled arc
  const frac = accuracy / 100;
  const col = frac > 0.9 ? '#44ff88' : frac > 0.7 ? '#ffcc00' : '#ff4444';
  ctx.strokeStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 8;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, startAngle + totalArc * frac);
  ctx.stroke();

  // Percentage text
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${accuracy.toFixed(1)}%`, cx, cy);

  ctx.font = '9px sans-serif';
  ctx.fillStyle = 'rgba(180,200,255,0.6)';
  ctx.fillText('ACCURACY', cx, cy + 15);

  ctx.restore();
}

// ============================================================
// RENDERING: Judgment Popup
// ============================================================
function drawJudgePopup() {
  if (judgeTimer <= 0 || !lastJudge) return;

  ctx.save();
  const t = judgeTimer / 0.5;
  const scale = 1 + (1 - t) * 0.3;
  const alpha = Math.min(1, t * 2);

  ctx.translate(VX, ROAD_BOTTOM - 60);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  ctx.shadowColor = JUDGE_COLORS[lastJudge];
  ctx.shadowBlur = 20;
  ctx.fillStyle = JUDGE_COLORS[lastJudge];
  ctx.font = `bold 32px 'Impact', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(lastJudge, 0, 0);

  ctx.restore();
}

// ============================================================
// RENDERING: Screens
// ============================================================
function drawStartScreen() {
  const t = performance.now() / 1000;
  const pulse = 0.7 + 0.3 * Math.sin(t * 3);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Title
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 30 * pulse;
  ctx.font = `bold 100px 'Impact', sans-serif`;
  ctx.fillStyle = `rgba(0,255,200,${pulse})`;
  ctx.fillText('RRBe', VX, H / 2 - 120);

  // Subtitle
  ctx.shadowColor = '#8844ff';
  ctx.shadowBlur = 15;
  ctx.font = `bold 22px sans-serif`;
  ctx.fillStyle = '#cc88ff';
  ctx.fillText('RACE & RHYTHM BEAT', VX, H / 2 - 55);

  // Controls
  ctx.shadowBlur = 0;
  ctx.font = '15px sans-serif';
  ctx.fillStyle = 'rgba(150,220,255,0.8)';
  const lines = [
    '← ↓ ↑ →  : Hit notes with matching arrow keys',
    'Match the timing when notes reach the judgment line!',
    'PERFECT → GREAT → GOOD → BAD → MISS',
    ''
  ];
  lines.forEach((l, i) => ctx.fillText(l, VX, H / 2 + i * 26));

  // Lane color legend
  const legendY = H / 2 + lines.length * 26 + 10;
  for (let i = 0; i < 4; i++) {
    const x = VX - 120 + i * 80;
    ctx.fillStyle = LANE_COLORS[i];
    ctx.shadowColor = LANE_COLORS[i];
    ctx.shadowBlur = 8;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(LANE_ARROWS[i], x, legendY);
  }
  ctx.shadowBlur = 0;

  // Press space
  const sp = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 12 * sp;
  ctx.fillStyle = `rgba(255,238,0,${sp})`;
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('PRESS SPACE TO START', VX, H / 2 + 175);

  ctx.restore();
}

function drawGameOverScreen() {
  const t = performance.now() / 1000;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  const gp = 0.8 + 0.2 * Math.sin(t * 2.5);
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 30 * gp;
  ctx.fillStyle = `rgba(255,50,80,${gp})`;
  ctx.font = `bold 80px 'Impact', sans-serif`;
  ctx.fillText('GAME OVER', VX, H / 2 - 60);

  ctx.shadowBlur = 10;
  ctx.shadowColor = '#00ccff';
  ctx.fillStyle = '#00ddff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText(`SCORE: ${score}`, VX, H / 2 + 10);

  ctx.fillStyle = '#ffee44';
  ctx.shadowColor = '#ffcc00';
  ctx.font = '22px sans-serif';
  ctx.fillText(`MAX COMBO: ${maxCombo}`, VX, H / 2 + 48);

  ctx.fillStyle = '#aaa';
  ctx.shadowBlur = 0;
  ctx.font = '16px sans-serif';
  ctx.fillText(`Accuracy: ${accuracy.toFixed(1)}%`, VX, H / 2 + 80);

  const rp = 0.5 + 0.5 * Math.sin(t * 3.5);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 10 * rp;
  ctx.fillStyle = `rgba(255,238,0,${rp})`;
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('PRESS R or SPACE TO RESTART', VX, H / 2 + 130);

  ctx.restore();
}

function drawResultScreen() {
  const t = performance.now() / 1000;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = 'rgba(0,0,10,0.75)';
  ctx.fillRect(0, 0, W, H);

  // Grade
  let grade;
  if (accuracy >= 95) grade = 'S';
  else if (accuracy >= 90) grade = 'A';
  else if (accuracy >= 80) grade = 'B';
  else if (accuracy >= 70) grade = 'C';
  else if (accuracy >= 60) grade = 'D';
  else grade = 'F';

  const gradeColors = {
    S: '#00ffff', A: '#44ff44', B: '#88cc00',
    C: '#ffcc00', D: '#ff8800', F: '#ff2244'
  };

  // CLEAR text
  const pulse = 0.8 + 0.2 * Math.sin(t * 3);
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 20 * pulse;
  ctx.fillStyle = `rgba(0,255,200,${pulse})`;
  ctx.font = `bold 50px 'Impact', sans-serif`;
  ctx.fillText('STAGE CLEAR!', VX, 80);

  // Grade letter
  ctx.shadowColor = gradeColors[grade];
  ctx.shadowBlur = 40;
  ctx.fillStyle = gradeColors[grade];
  ctx.font = `bold 120px 'Impact', sans-serif`;
  ctx.fillText(grade, VX, 200);

  // Stats
  ctx.shadowBlur = 0;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#00ddff';
  ctx.fillText(`SCORE: ${score}`, VX, 300);

  ctx.fillStyle = '#ffee44';
  ctx.font = '20px sans-serif';
  ctx.fillText(`MAX COMBO: ${maxCombo}`, VX, 335);

  ctx.fillStyle = '#fff';
  ctx.fillText(`ACCURACY: ${accuracy.toFixed(2)}%`, VX, 365);

  // Judgment breakdown
  const stats = [
    ['PERFECT', judgeCounts.PERFECT, JUDGE_COLORS.PERFECT],
    ['GREAT',   judgeCounts.GREAT,   JUDGE_COLORS.GREAT],
    ['GOOD',    judgeCounts.GOOD,    JUDGE_COLORS.GOOD],
    ['BAD',     judgeCounts.BAD,     JUDGE_COLORS.BAD],
    ['MISS',    judgeCounts.MISS,    JUDGE_COLORS.MISS],
  ];
  ctx.font = '16px sans-serif';
  const statsY = 410;
  const total = notes.length;
  stats.forEach(([label, cnt, col], idx) => {
    const x = VX - 200 + idx * 100;
    ctx.fillStyle = col;
    ctx.fillText(label, x, statsY);
    ctx.fillStyle = '#fff';
    ctx.fillText(`${cnt}`, x, statsY + 22);
    // Bar
    const barW = 60;
    const barH = 4;
    const frac = total > 0 ? cnt / total : 0;
    ctx.fillStyle = 'rgba(40,40,80,0.6)';
    ctx.fillRect(x - barW / 2, statsY + 32, barW, barH);
    ctx.fillStyle = col;
    ctx.fillRect(x - barW / 2, statsY + 32, barW * frac, barH);
  });

  // Restart
  const rp = 0.5 + 0.5 * Math.sin(t * 3.5);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 10 * rp;
  ctx.fillStyle = `rgba(255,238,0,${rp})`;
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('PRESS R or SPACE TO RESTART', VX, H - 60);

  ctx.restore();
}

// ============================================================
// MAIN DRAW
// ============================================================
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg();

  if (gameState === 'START') {
    drawTrack();
    drawJudgeLine();
    drawCharacter();
    drawStartScreen();
    return;
  }

  drawTrack();
  drawNotes();
  drawJudgeLine();
  drawCharacter();
  drawPart();
  drawHUD();
  drawJudgePopup();

  if (gameState === 'GAMEOVER') drawGameOverScreen();
  if (gameState === 'RESULT') drawResultScreen();
}

// ============================================================
// GAME LIFECYCLE
// ============================================================
function resetGame() {
  gameState = 'PLAYING';
  notes = generateChart();
  totalNotes = notes.length;
  score = 0; combo = 0; maxCombo = 0;
  health = HP_MAX;
  judgeCounts = { PERFECT: 0, GREAT: 0, GOOD: 0, BAD: 0, MISS: 0 };
  accuracy = 100;
  lastJudge = null; judgeTimer = 0;
  beatFlash = 0;
  particles = [];
  roadScroll = 0; charPhase = 0;
  laneFlash = [0, 0, 0, 0];

  if (audioCtx) {
    stepCount = 0; beatCount = 0; melodyPos = 0; bassNoteIdx = 0;
    nextStepTime = audioCtx.currentTime + 0.05;
    gameStartTime = audioCtx.currentTime;
  }
}

function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  resetGame();
}

function resetToStart() {
  gameState = 'START';
}

// ============================================================
// GAME LOOP
// ============================================================
lastTime = performance.now();

function gameLoop(ts) {
  dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  update(dt);
  draw();

  for (const k in justPressed) delete justPressed[k];
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
