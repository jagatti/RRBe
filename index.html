  if (customSourceNode) {

    customSourceNode = null;

  if (!customAudioBuffer || !audioCtx) return;
  stopCustomAudio();
  customSourceNode = audioCtx.createBufferSource();
  customSourceNode.buffer = customAudioBuffer;
  customSourceNode.connect(masterGain);
  // Capture the exact current time and use it for both scheduling and gameStartTime
  // to eliminate the micro-skew between when gameStartTime was set (in update()) and now
  const now = audioCtx.currentTime;
  gameStartTime = now;
  customSourceNode.start(now);
}

// ============================================================
// BEAT DETECTION — energy-based onset detection with waveform amplitude
// ============================================================
function detectBeats(audioBuffer) {
  // Downsample to mono
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const length = audioBuffer.length;
  const mono = new Float32Array(length);
  for (let ch = 0; ch < numChannels; ch++) {
    const data = audioBuffer.getChannelData(ch);
    for (let i = 0; i < length; i++) mono[i] += data[i] / numChannels;
  }

  // ---- Multi-band spectral flux onset detection ----
  // Split into 3 frequency bands: low (<300Hz), mid (300-3000Hz), high (>3000Hz)
  // This better captures melody onsets vs. percussion

  const windowSize = Math.floor(sampleRate * 0.023); // ~23ms windows (~1013 samples at 44.1kHz)
  const hopSize = Math.floor(windowSize / 2);
  const numWindows = Math.floor((length - windowSize) / hopSize);

  // Compute energy in each band using simple bandpass approximation
  // Low-pass: running average (smooths high frequencies)
  // Band energy via difference of smoothed signals
  const energyLow = new Float32Array(numWindows);
  const energyMid = new Float32Array(numWindows);
  const energyHigh = new Float32Array(numWindows);
  const energyTotal = new Float32Array(numWindows);

  // Pre-filter: create band-separated signals using simple IIR filters
  const lowPass = new Float32Array(length);
  const midPass = new Float32Array(length);
  const highPass = new Float32Array(length);

  // Simple one-pole low-pass filter coefficients
  const lowCutoff = 300 / sampleRate;
  const midCutoff = 3000 / sampleRate;
  const alphaLow = Math.exp(-2 * Math.PI * lowCutoff);
  const alphaMid = Math.exp(-2 * Math.PI * midCutoff);

  let lpLow = 0, lpMid = 0;
  for (let i = 0; i < length; i++) {
    lpLow = alphaLow * lpLow + (1 - alphaLow) * mono[i];
    lpMid = alphaMid * lpMid + (1 - alphaMid) * mono[i];
    lowPass[i] = lpLow;
    highPass[i] = mono[i] - lpMid;
    midPass[i] = lpMid - lpLow;
  }

  for (let w = 0; w < numWindows; w++) {
    let sumLow = 0, sumMid = 0, sumHigh = 0, sumTotal = 0;
    const start = w * hopSize;
    for (let i = start; i < start + windowSize; i++) {
      sumLow += lowPass[i] * lowPass[i];
      sumMid += midPass[i] * midPass[i];
      sumHigh += highPass[i] * highPass[i];
      sumTotal += mono[i] * mono[i];
    }
    energyLow[w] = sumLow / windowSize;
    energyMid[w] = sumMid / windowSize;
    energyHigh[w] = sumHigh / windowSize;
    energyTotal[w] = sumTotal / windowSize;
  }

  // Compute spectral flux (positive energy increase) for each band
  const fluxLow = new Float32Array(numWindows);
  const fluxMid = new Float32Array(numWindows);
  const fluxHigh = new Float32Array(numWindows);
  for (let w = 1; w < numWindows; w++) {
    fluxLow[w] = Math.max(0, energyLow[w] - energyLow[w - 1]);
    fluxMid[w] = Math.max(0, energyMid[w] - energyMid[w - 1]);
    fluxHigh[w] = Math.max(0, energyHigh[w] - energyHigh[w - 1]);
  }

  // Detect onsets using combined spectral flux with adaptive threshold
  const avgWindow = 40; // ~460ms history for adaptive threshold
  const onsets = [];
  const threshold = 1.4; // onset must exceed local average by this factor
  let lastOnsetTime = -0.15;

  for (let w = avgWindow; w < numWindows; w++) {
    // Compute local average for each band
    let avgLow = 0, avgMid = 0, avgHigh = 0, avgTotal = 0;
    for (let j = w - avgWindow; j < w; j++) {
      avgLow += fluxLow[j];
      avgMid += fluxMid[j];
      avgHigh += fluxHigh[j];
      avgTotal += energyTotal[j];
    }
    avgLow /= avgWindow;
    avgMid /= avgWindow;
    avgHigh /= avgWindow;
    avgTotal /= avgWindow;

    const t = (w * hopSize) / sampleRate;

    // Combined onset detection: weighted sum of band fluxes
    // Mid-band (melody/vocal) gets highest weight — these are the sounds
    // that humans intuitively recognise and want to "tap along" with
    const combinedFlux = fluxLow[w] * 0.15 + fluxMid[w] * 0.60 + fluxHigh[w] * 0.25;
    const combinedAvg = avgLow * 0.15 + avgMid * 0.60 + avgHigh * 0.25;

    // Melody-band specific onset: strong mid-band flux alone qualifies
    // Lowered threshold so more melody notes are captured
    const melodyFluxOnset = fluxMid[w] > avgMid * (threshold * 0.80) && fluxMid[w] > 0.00015;

    // Also check total energy onset — prominent beats (kick hits, chord stabs)
    const totalOnset = energyTotal[w] > avgTotal * (threshold * 1.2) && energyTotal[w] > 0.002;

    // Onset if combined flux exceeds threshold OR melody/total onset detected
    const fluxOnset = combinedFlux > combinedAvg * threshold && combinedFlux > 0.0001;

    // Minimum onset interval: 40ms allows 32nd notes at ~190 BPM
    if ((fluxOnset || melodyFluxOnset || totalOnset) && t - lastOnsetTime > 0.04) {
      onsets.push(t);
      lastOnsetTime = t;
    }
  }

  // Store per-onset melody/percussion classification and pitch direction
  const onsetIsMelody = new Uint8Array(onsets.length);
  // Pitch direction: +1 = rising, -1 = falling, 0 = neutral
  const onsetPitchDir = new Int8Array(onsets.length);
  // Re-classify each onset
  for (let i = 0; i < onsets.length; i++) {
    const t = onsets[i];
    const w = Math.floor((t * sampleRate) / hopSize);
    if (w > 0 && w < numWindows) {
      const mFlux = fluxMid[w];
      const lFlux = fluxLow[w];
      const hFlux = fluxHigh[w];
      onsetIsMelody[i] = (mFlux > lFlux * 0.9 && mFlux > hFlux * 0.6) ? 1 : 0;

      // Detect pitch direction by comparing mid-band energy trend
      // Look at energy change in a small window around this onset
      const lookback = Math.min(w, 6);
      const lookfwd = Math.min(numWindows - w - 1, 6);
      if (lookback >= 2 && lookfwd >= 2) {
        let prevMidE = 0, nextMidE = 0;
        for (let j = w - lookback; j < w; j++) prevMidE += energyMid[j];
        for (let j = w + 1; j <= w + lookfwd; j++) nextMidE += energyMid[j];
        prevMidE /= lookback;
        nextMidE /= lookfwd;
        // Also compare high vs low band energy for pitch height
        const highDominance = hFlux > lFlux * 1.5;
        const lowDominance = lFlux > hFlux * 1.5;
        if (nextMidE > prevMidE * 1.15 || highDominance) onsetPitchDir[i] = 1;   // rising
        else if (prevMidE > nextMidE * 1.15 || lowDominance) onsetPitchDir[i] = -1; // falling
        else onsetPitchDir[i] = 0; // neutral
      }
    }
  }
  onsets._onsetIsMelody = onsetIsMelody;
  onsets._onsetPitchDir = onsetPitchDir;

  // Store waveform amplitude data for chart generation
  // Compute RMS energy in larger windows (100ms) for amplitude envelope
  const ampWindowSize = Math.floor(sampleRate * 0.1); // 100ms
  const ampHopSize = Math.floor(ampWindowSize / 4);    // 25ms hop
  const numAmpWindows = Math.floor((length - ampWindowSize) / ampHopSize);
  const ampEnvelope = new Float32Array(numAmpWindows);
  let maxAmp = 0;

  for (let w = 0; w < numAmpWindows; w++) {
    let sum = 0;
    const start = w * ampHopSize;
    for (let i = start; i < start + ampWindowSize; i++) {
      sum += mono[i] * mono[i];
    }
    ampEnvelope[w] = Math.sqrt(sum / ampWindowSize); // RMS
    if (ampEnvelope[w] > maxAmp) maxAmp = ampEnvelope[w];
  }

  // Normalize amplitude envelope to 0-1
  if (maxAmp > 0) {
    for (let w = 0; w < numAmpWindows; w++) {
      ampEnvelope[w] /= maxAmp;
    }
  }

  // Store amplitude lookup function on the onsets array
  onsets._ampEnvelope = ampEnvelope;
  onsets._ampHopSize = ampHopSize;
  onsets._sampleRate = sampleRate;
  onsets._duration = length / sampleRate;

  // Compute amplitude at each onset time
  onsets._onsetAmplitudes = onsets.map(t => {
    const idx = Math.floor((t * sampleRate) / ampHopSize);
    if (idx >= 0 && idx < numAmpWindows) return ampEnvelope[idx];
    return 0;
  });

  // ---- Improved vocal detection using spectral analysis ----
  const vocalWindowSec = 1.5; // 1.5-second windows for finer resolution
  const vocalWindowSamples = Math.floor(sampleRate * vocalWindowSec);
  const numVocalWindows = Math.floor(length / vocalWindowSamples);
  const vocalLikelihood = new Float32Array(numVocalWindows);

  for (let vw = 0; vw < numVocalWindows; vw++) {
    const start = vw * vocalWindowSamples;
    const end = Math.min(start + vocalWindowSamples, length);
    const segLen = end - start;

    // Measure mid-band energy ratio (vocal range: 300-3000Hz)
    let midEnergy = 0, totalEnergy = 0;
    for (let i = start; i < end; i++) {
      midEnergy += midPass[i] * midPass[i];
      totalEnergy += mono[i] * mono[i];
    }
    midEnergy = Math.sqrt(midEnergy / segLen);
    totalEnergy = Math.sqrt(totalEnergy / segLen);

    // Also check zero crossing rate for vocal frequency estimation
    let zeroCrossings = 0;
    let prev = 0;
    for (let i = start; i < end; i++) {
      if (i > start && mono[i] * prev < 0) zeroCrossings++;
      prev = mono[i];
    }
    const zcr = zeroCrossings / segLen * sampleRate;

    // Spectral flatness approximation: vocal content has more harmonic structure
    // (lower flatness) compared to noise/percussion (higher flatness)
    let spectralVariance = 0;
    const subWin = Math.floor(segLen / 20);
    const subEnergies = [];
    for (let sw = 0; sw < 20; sw++) {
      let se = 0;
      const ss = start + sw * subWin;
      for (let i = ss; i < ss + subWin && i < end; i++) {
        se += midPass[i] * midPass[i];
      }
      subEnergies.push(se / subWin);
    }
    const meanSubE = subEnergies.reduce((a, b) => a + b, 0) / subEnergies.length;
    for (const se of subEnergies) {
      spectralVariance += (se - meanSubE) * (se - meanSubE);
    }
    spectralVariance = Math.sqrt(spectralVariance / subEnergies.length);
    // High variance in mid-band energy = likely melodic/vocal content
    const harmonicScore = meanSubE > 0 ? Math.min(1, spectralVariance / meanSubE * 2) : 0;

    // Combined vocal likelihood: mid-band dominance + ZCR in vocal range + harmonic structure
    const midRatio = totalEnergy > 0.001 ? midEnergy / totalEnergy : 0;
    const zcrScore = (zcr >= 100 && zcr <= 800 && totalEnergy > 0.02) ?
      Math.min(1, Math.max(0, 1 - Math.abs(zcr - 400) / 400)) : 0;

    vocalLikelihood[vw] = midRatio * 0.4 + zcrScore * 0.3 + harmonicScore * 0.3;
  }

  onsets._vocalLikelihood = vocalLikelihood;
  onsets._vocalWindowSec = vocalWindowSec;

  return onsets;
}

function estimateBPM(onsets, duration) {
  if (onsets.length < 4) return 120;

  // Compute inter-onset intervals
  const intervals = [];
  for (let i = 1; i < onsets.length; i++) {
    intervals.push(onsets[i] - onsets[i - 1]);
  }

  // Histogram of intervals quantized to BPM range 60-200
  // Weight intervals by amplitude (louder onsets = more reliable tempo indicators)
  const bpmCounts = {};
  const amps = onsets._onsetAmplitudes;
  for (let i = 0; i < intervals.length; i++) {
    const iv = intervals[i];
    if (iv < 0.1 || iv > 2.0) continue;
    // Weight by amplitude of both surrounding onsets
    const weight = amps ? ((amps[i] || 0.3) + (amps[i + 1] || 0.3)) / 2 : 1;
    // Try multiplying/dividing to map to reasonable BPM range
    for (let mult = 1; mult <= 4; mult++) {
      const adjIv = iv * mult;
      const bpm = Math.round(60 / adjIv);
      if (bpm >= 70 && bpm <= 200) {
        const key = Math.round(bpm / 2) * 2; // round to nearest 2
        bpmCounts[key] = (bpmCounts[key] || 0) + weight;
      }
    }
  }

  // Find top 3 BPM candidates
  const candidates = Object.entries(bpmCounts)
    .map(([bpm, count]) => ({ bpm: parseInt(bpm), count }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 3);

  if (candidates.length === 0) return 120;

  // Validate candidates: check how well onsets align to a grid at each BPM
  let bestBPM = candidates[0].bpm;
  let bestScore = -1;

  for (const candidate of candidates) {
    const bpmVal = candidate.bpm;
    const beatInterval = 60 / bpmVal;
    let alignScore = 0;

    for (const t of onsets) {
      // How close is this onset to the nearest beat grid position?
      const nearestBeat = Math.round(t / beatInterval) * beatInterval;
      const deviation = Math.abs(t - nearestBeat);
      // Score inversely proportional to deviation (max 1 when on grid)
      const devScore = Math.max(0, 1 - deviation / (beatInterval * 0.25));
      const ampWeight = amps ? (amps[onsets.indexOf(t)] || 0.3) : 1;
      alignScore += devScore * ampWeight;
    }

    if (alignScore > bestScore) {
      bestScore = alignScore;
      bestBPM = bpmVal;
    }
  }

  return bestBPM;
}

function generateChartFromBeats(beats, bpm, duration, difficulty) {
  const obstacles = [];
  const beatS = 60 / bpm;
  difficulty = difficulty || 'NORMAL';

  // Waveform analysis thresholds
  const SILENCE_AMP_THRESHOLD = 0.05;  // below this = nearly silent section
  const QUIET_BEAT_AMP = 0.05;         // minimum amplitude for obstacle placement
  const VOCAL_SONG_THRESHOLD = 0.08;   // overall vocal score >8% = vocal song
  const VOCAL_SECTION_THRESHOLD = 0.10;// per-section vocal likelihood threshold
  const CALM_NONMELODY_THIN_RATE = 0.45;// probability of removing non-melody beats in calm sections
  const BREATHING_GAP_HARD = 20;       // consecutive obstacles before forced rest (HARD)
  const BREATHING_GAP_EXPERT = 28;     // consecutive obstacles before forced rest (EXPERT)
  const BREATHING_GAP_NORMAL = 6;      // consecutive obstacles before forced rest (NORMAL)

  // Seeded random
  let seed = bpm * 1000 + Math.floor(duration) * 7;
  function rand() {
    seed = (seed * 16807) % 2147483647;
    return (seed & 0x7fffffff) / 0x7fffffff;
  }

  // Extract waveform amplitude data from beats array (added by detectBeats)
  const ampEnvelope = beats._ampEnvelope;
  const ampHopSize = beats._ampHopSize;
  const ampSampleRate = beats._sampleRate;
  const onsetAmplitudes = beats._onsetAmplitudes;
  const onsetIsMelody = beats._onsetIsMelody;
  const onsetPitchDir = beats._onsetPitchDir;
  const vocalLikelihood = beats._vocalLikelihood;
  const vocalWindowSec = beats._vocalWindowSec;
  const hasAmpData = ampEnvelope && ampEnvelope.length > 0;

  // Get amplitude at a given time
  function getAmplitudeAt(t) {
    if (!hasAmpData) return 0.5;
    const idx = Math.floor((t * ampSampleRate) / ampHopSize);
    if (idx >= 0 && idx < ampEnvelope.length) return ampEnvelope[idx];
    return 0;
  }

  // Get average amplitude in a time window
  function getAvgAmplitude(tStart, tEnd) {
    if (!hasAmpData) return 0.5;
    const idxStart = Math.max(0, Math.floor((tStart * ampSampleRate) / ampHopSize));
    const idxEnd = Math.min(ampEnvelope.length - 1, Math.floor((tEnd * ampSampleRate) / ampHopSize));
    if (idxEnd <= idxStart) return getAmplitudeAt(tStart);
    let sum = 0;
    for (let i = idxStart; i <= idxEnd; i++) sum += ampEnvelope[i];
    return sum / (idxEnd - idxStart + 1);
  }

  // Detect if a section likely has vocals
  function hasVocalsAt(t) {
    if (!vocalLikelihood || vocalLikelihood.length === 0) return false;
    const idx = Math.floor(t / vocalWindowSec);
    if (idx >= 0 && idx < vocalLikelihood.length) return vocalLikelihood[idx] > VOCAL_SECTION_THRESHOLD;
    return false;
  }

  // Check if the song overall has significant vocal content
  let totalVocalScore = 0;
  if (vocalLikelihood) {
    for (let i = 0; i < vocalLikelihood.length; i++) totalVocalScore += vocalLikelihood[i];
    totalVocalScore /= Math.max(1, vocalLikelihood.length);
  }
  const isVocalSong = totalVocalScore > VOCAL_SONG_THRESHOLD;

  // ---- Beat quantization: snap onsets to nearest musical grid position ----
  // This aligns obstacle placement with the actual beat grid for better musical feel
  const quantizedBeats = [];
  const gridSize = beatS / 8; // 32nd note grid
  for (let bi = 0; bi < beats.length; bi++) {
    const t = beats[bi];
    // Snap to nearest grid position
    const gridPos = Math.round(t / gridSize) * gridSize;
    // Only add if not duplicate (within 20ms)
    if (quantizedBeats.length === 0 || Math.abs(gridPos - quantizedBeats[quantizedBeats.length - 1]._t) > 0.02) {
      quantizedBeats.push({
        _t: gridPos,
        _origIdx: bi,
        _amp: onsetAmplitudes ? (onsetAmplitudes[bi] || 0) : 0.5,
        _isMelody: onsetIsMelody ? onsetIsMelody[bi] : 0,
        _pitchDir: onsetPitchDir ? onsetPitchDir[bi] : 0
      });
    }
  }

  // Analyze beat density to detect calm vs intense sections
  // Divide song into windows and count beats per window
  const windowSize = beatS * 8; // 2-bar windows
  const beatDensity = [];
  const maxT = duration;
  for (let w = 0; w < maxT; w += windowSize) {
    const count = quantizedBeats.filter(b => b._t >= w && b._t < w + windowSize).length;
    // Also compute average amplitude in window for energy-based section detection
    const avgAmp = getAvgAmplitude(w, w + windowSize);
    beatDensity.push({ start: w, end: w + windowSize, count, avgAmp });
  }
  // Find median density for calm/intense threshold
  const sortedCounts = beatDensity.map(d => d.count).sort((a, b) => a - b);
  const medianDensity = sortedCounts[Math.floor(sortedCounts.length / 2)] || 1;
  // Also compute amplitude-based intensity
  const sortedAmps = beatDensity.map(d => d.avgAmp).sort((a, b) => a - b);
  const medianAmp = sortedAmps[Math.floor(sortedAmps.length / 2)] || 0.3;

  // Compute intensity score (0-1) for each window for dynamic density
  for (let i = 0; i < beatDensity.length; i++) {
    const d = beatDensity[i];
    const densityScore = medianDensity > 0 ? d.count / medianDensity : 1;
    const ampScore = medianAmp > 0 ? d.avgAmp / medianAmp : 1;
    // Combine density and amplitude, clamp to 0-2
    d.intensity = Math.min(2, densityScore * 0.4 + ampScore * 0.6);
  }

  function getIntensityAt(t) {
    const idx = Math.floor(t / windowSize);
    if (idx >= beatDensity.length) return 0;
    return beatDensity[idx].intensity;
  }

  function isCalmAt(t) {
    const idx = Math.floor(t / windowSize);
    if (idx >= beatDensity.length) return true;
    // Use both beat density AND amplitude for more accurate calm detection
    const densityCalm = beatDensity[idx].count < medianDensity * 0.7;
    const ampCalm = beatDensity[idx].avgAmp < medianAmp * 0.6;
    return densityCalm || ampCalm;
  }

  function isIntenseAt(t) {
    const idx = Math.floor(t / windowSize);
    if (idx >= beatDensity.length) return false;
    // More lenient for intensity detection: above-median density OR high amplitude
    return (beatDensity[idx].count > medianDensity * 1.05 && beatDensity[idx].avgAmp > medianAmp * 0.9)
        || beatDensity[idx].avgAmp > medianAmp * 1.3;
  }

  // Detect silent/near-silent sections using waveform amplitude
  function isSilentAt(t) {
    const idx = Math.floor(t / windowSize);
    if (idx >= beatDensity.length) return true;
    if (beatDensity[idx].count <= 1) return true;
    if (hasAmpData) {
      const wStart = idx * windowSize;
      const wEnd = wStart + windowSize;
      const avgAmp = getAvgAmplitude(wStart, wEnd);
      if (avgAmp < SILENCE_AMP_THRESHOLD) return true;
    }
    return false;
  }

  // ---- Improved section detection using energy contour ----
  // Detect intro/outro by amplitude ramp-up/ramp-down
  function getSectionAt(t) {
    const progress = t / duration;
    const localAmp = getAmplitudeAt(t);

    // First few seconds or very quiet start = intro
    if (progress < 0.08 || (progress < 0.15 && localAmp < medianAmp * 0.4)) return 'intro';
    // Last section or very quiet end = outro
    if (progress >= 0.92 || (progress >= 0.85 && localAmp < medianAmp * 0.4)) return 'outro';
    // Before last high-energy section
    if (progress >= 0.72 && progress < 0.78 && isCalmAt(t)) return 'before_last_chorus';

    // Use amplitude contour for more accurate section detection
    if (isCalmAt(t)) return 'calm';
    return 'intense';
  }

  // ---- Compute local amplitude context for each onset ----
  // Instead of a single global percentile, use local context windows
  function getLocalAmpThreshold(t) {
    // Get amplitude in a ±4 beat window around this time
    const windowHalf = beatS * 4;
    const tStart = Math.max(0, t - windowHalf);
    const tEnd = Math.min(duration, t + windowHalf);
    // Collect amplitudes of nearby onsets
    const nearbyAmps = [];
    for (const qb of quantizedBeats) {
      if (qb._t >= tStart && qb._t <= tEnd) nearbyAmps.push(qb._amp);
    }
    if (nearbyAmps.length < 3) return 0.1; // too few neighbors, accept most
    nearbyAmps.sort((a, b) => a - b);
    // Use 25th percentile of local amplitudes as threshold
    return nearbyAmps[Math.floor(nearbyAmps.length * 0.25)] || 0.1;
  }

  // Skip first CHART_START_OFFSET seconds, stop 2s before end
  const startT = CHART_START_OFFSET;
  const endT = duration - 2.0;
  let lastType = -1;
  let lastTime = -1;
  // Minimum gap based on difficulty, scaled by scroll speed
  // Scroll speed only affects visual spacing, NOT obstacle count
  const baseMinGapHard = beatS * 0.22;    // HARD: tight 16th-note density
  const baseMinGapExpert = beatS / 6;     // EXPERT: 24th-note density (8th-note triplet)
  const baseMinGapNormal = beatS * 0.60;

  // Dynamic minimum gap: tighter in intense sections, wider in calm sections
  // This creates the pacing variation players want
  function getDynamicMinGap(t) {
    const section = getSectionAt(t);
    const intensity = getIntensityAt(t);
    let base;
    if (section === 'intro' || section === 'outro') {
      // Very wide gaps in intro/outro for breathing room
      base = difficulty === 'EXPERT' ? beatS * 0.45 : difficulty === 'HARD' ? beatS * 0.55 : beatS * 1.00;
    } else if (section === 'calm' || section === 'before_last_chorus') {
      // Wide gaps in calm sections — clear contrast with intense parts
      base = difficulty === 'EXPERT' ? beatS * 0.35 : difficulty === 'HARD' ? beatS * 0.45 : beatS * 0.80;
    } else if (isIntenseAt(t)) {
      // Tight gaps in intense sections — this is where the challenge lives
      base = difficulty === 'EXPERT' ? baseMinGapExpert : difficulty === 'HARD' ? baseMinGapHard : baseMinGapNormal;
    } else {
      // Default moderate
      base = difficulty === 'EXPERT' ? beatS * 0.25 : difficulty === 'HARD' ? beatS * 0.35 : beatS * 0.70;
    }
    return base;
  }

  // Track consecutive obstacle count for periodic breathing gaps
  let consecutiveCount = 0;
  const BREATHING_GAP_INTERVAL = difficulty === 'EXPERT' ? BREATHING_GAP_EXPERT : difficulty === 'HARD' ? BREATHING_GAP_HARD : BREATHING_GAP_NORMAL;
  const BREATHING_GAP_DURATION = difficulty === 'EXPERT' ? beatS * 0.8 : difficulty === 'HARD' ? beatS * 1.0 : beatS * 1.5;

  for (let qi = 0; qi < quantizedBeats.length; qi++) {
    const qb = quantizedBeats[qi];
    const t = qb._t;
    const bi = qb._origIdx;
    if (t < startT || t > endT) continue;

    // Dynamic minimum gap based on section
    const currentMinGap = getDynamicMinGap(t);
    if (t - lastTime < currentMinGap) continue;

    // Periodic breathing gaps — even in dense sections, insert brief rests
    // so the pattern doesn't feel monotonous
    if (consecutiveCount >= BREATHING_GAP_INTERVAL && !isCalmAt(t)) {
      if (t - lastTime < BREATHING_GAP_DURATION) continue;
      consecutiveCount = 0; // reset after breathing gap
    }

    // Skip silent sections — no obstacles in silent parts
    if (isSilentAt(t)) continue;

    // ---- Improved amplitude filtering: strongly favor melody onsets ----
    // The goal: keep beats that a human would naturally tap along to —
    // prominent melody notes, strong drum hits, vocal phrases
    if (hasAmpData && onsetAmplitudes) {
      const beatAmp = qb._amp;
      const localAmp = getAmplitudeAt(t);
      const isVocalSection = isVocalSong && hasVocalsAt(t);
      const isMelodyOnset = qb._isMelody;
      const localThreshold = getLocalAmpThreshold(t);
      const intense = isIntenseAt(t);

      if (isMelodyOnset) {
        // Melody onset: these are the core musical moments players can identify.
        // Keep almost all of them — only filter truly inaudible ones
        if (beatAmp < localThreshold * 0.08 && localAmp < QUIET_BEAT_AMP * 0.5) continue;
      } else if (isVocalSection) {
        // Vocal section: keep melody-like onsets, lightly filter weak percussion
        if (beatAmp < localThreshold * 0.15 && localAmp < QUIET_BEAT_AMP) continue;
      } else if (isVocalSong && !isVocalSection) {
        // Instrumental interlude in vocal song: keep strong, prominent hits
        if (beatAmp < localThreshold * 0.40) continue;
        if (beatAmp < localThreshold * 0.60 && rand() < 0.3) continue;
      } else {
        // Fully instrumental: keep prominent, rhythmically obvious beats
        if (beatAmp < localThreshold * 0.30) continue;
        if (beatAmp < localThreshold * 0.50 && rand() < 0.25) continue;
      }

      // In calm sections, thin out non-melody beats more aggressively
      // so obstacles clearly map to the main musical elements
      if (isCalmAt(t) && !isMelodyOnset) {
        if (rand() < CALM_NONMELODY_THIN_RATE) continue;
      }
    }

    const r = rand();
    const section = getSectionAt(t);
    const isMelodyOnset = qb._isMelody;
    const pitchDir = qb._pitchDir; // +1 rising, -1 falling, 0 neutral
    let typeIdx;

    if (section === 'intro' || section === 'outro' || section === 'calm' || section === 'before_last_chorus') {
      // Calm/intro/outro: stars more frequent (reduced in HARD mode to keep ≤10% overall)
      const baseStarChance = (section === 'before_last_chorus') ? 0.50
                       : (section === 'intro' || section === 'outro') ? 0.45
                       : 0.40;
      const starChance = (difficulty === 'HARD' || difficulty === 'EXPERT') ? Math.min(baseStarChance, 0.15) : baseStarChance;
      if (r < starChance / 2) typeIdx = 4;       // STAR_R
      else if (r < starChance) typeIdx = 5;       // STAR_L
      else if (r < starChance + 0.20) typeIdx = 0; // PYLON_R
      else if (r < starChance + 0.40) typeIdx = 1; // PYLON_L
      else typeIdx = r < starChance + 0.55 ? 2 : 3; // ARCH or BLOCK
    } else {
      // Intense sections: use pitch direction for melody-driven obstacle types
      if (isMelodyOnset) {
        if (pitchDir > 0) {
          // Rising melody → jump (BLOCK) or right dodge
          if (r < 0.40) typeIdx = 3;       // BLOCK (jump!) — feels like rising
          else if (r < 0.60) typeIdx = 0;  // PYLON_R
          else if (r < 0.80) typeIdx = 1;  // PYLON_L
          else typeIdx = 2;                // ARCH
        } else if (pitchDir < 0) {
          // Falling melody → duck (ARCH) or left dodge
          if (r < 0.40) typeIdx = 2;       // ARCH (duck!) — feels like descending
          else if (r < 0.60) typeIdx = 1;  // PYLON_L
          else if (r < 0.80) typeIdx = 0;  // PYLON_R
          else typeIdx = 3;                // BLOCK
        } else {
          // Neutral/sustained melody → side dodges for rhythmic flow
          if (r < 0.30) typeIdx = 0;       // PYLON_R
          else if (r < 0.60) typeIdx = 1;  // PYLON_L
          else if (r < 0.78) typeIdx = 2;  // ARCH
          else typeIdx = 3;                // BLOCK
        }
      } else {
        // Percussion-only beats: favor jumps/ducks for percussive impact
        if (r < 0.18) typeIdx = 0;       // PYLON_R
        else if (r < 0.36) typeIdx = 1;  // PYLON_L
        else if (r < 0.63) typeIdx = 3;  // BLOCK (jump!)
        else typeIdx = 2;                // ARCH (duck!)
      }

      // In non-HARD/EXPERT mode, add small star chance in intense sections
      if (difficulty !== 'HARD' && difficulty !== 'EXPERT') {
        if (r > 0.95) typeIdx = r < 0.975 ? 4 : 5; // ~5% STAR in intense sections
      }
    }

    // Avoid same consecutive type
    if (typeIdx === lastType) {
      typeIdx = (typeIdx + 1 + Math.floor(rand() * 4)) % 6;
    }
    lastType = typeIdx;
    lastTime = t;
    consecutiveCount++;

    obstacles.push({
      time: t,
      type: OBS_TYPES[typeIdx],
      judged: false,
      judgment: null,
      hitTime: 0
    });
  }

  // HARD/EXPERT mode: insert additional obstacles between existing beats at musically relevant points
  // HARD fills in 16th-note gaps; EXPERT fills in 24th-note (triplet) gaps in intense sections
  if (difficulty === 'HARD' || difficulty === 'EXPERT') {
    const sixteenthS = beatS / 4; // 16th note duration
    const twentyfourthS = beatS / 6; // 24th note (8th-note triplet) duration
    const insertGridS = difficulty === 'EXPERT' ? twentyfourthS : sixteenthS;
    const extraObs = [];
    for (let i = 0; i < obstacles.length - 1; i++) {
      const gap = obstacles[i + 1].time - obstacles[i].time;
      const midT = obstacles[i].time + gap * 0.5;
      // Only insert extras in intense sections
      if (!isIntenseAt(midT)) continue;
      // Use tighter minimum gap for extras
      const extraMinGap = insertGridS * 0.9;
      // If gap is large enough for at least one extra obstacle
      if (gap > insertGridS * 2.2) {
        // Try to insert multiple obstacles at grid positions
        const maxInserts = difficulty === 'EXPERT' ? 5 : 4;
        const numInserts = Math.min(maxInserts, Math.floor(gap / (insertGridS * 1.1)) - 1);
        for (let ins = 1; ins <= numInserts; ins++) {
          const insertT = obstacles[i].time + gap * (ins / (numInserts + 1));
          // Snap to nearest grid position (32nd note grid)
          const snappedT = Math.round(insertT / gridSize) * gridSize;
          // Check spacing from all existing and newly inserted obstacles
          const gapBefore = snappedT - obstacles[i].time;
          const gapAfter = obstacles[i + 1].time - snappedT;
          // Check against already-inserted extras too
          let tooClose = false;
          for (const ex of extraObs) {
            if (Math.abs(ex.time - snappedT) < extraMinGap) { tooClose = true; break; }
          }
          if (tooClose) continue;
          if (gapBefore < extraMinGap || gapAfter < extraMinGap) continue;
          if (snappedT > startT && snappedT < endT && !isSilentAt(snappedT)) {
            const midAmp = hasAmpData ? getAmplitudeAt(snappedT) : 0.5;
            if (midAmp < QUIET_BEAT_AMP * 0.8) continue;
            let typeIdx = Math.floor(rand() * 4);
            if (OBS_TYPES[typeIdx] === obstacles[i].type) typeIdx = (typeIdx + 1) % 4;
            extraObs.push({
              time: snappedT,
              type: OBS_TYPES[typeIdx],
              judged: false,
              judgment: null,
              hitTime: 0
            });
          }
        }
      }
    }
    obstacles.push(...extraObs);
  }

  // Final pass: enforce minimum visual spacing by removing obstacles that are too close
  obstacles.sort((a, b) => a.time - b.time);
  for (let i = obstacles.length - 1; i > 0; i--) {
    // In HARD/EXPERT mode, use tighter enforcement so dense note runs survive
    const enforceMult = difficulty === 'EXPERT' ? 0.55 : difficulty === 'HARD' ? 0.65 : 0.90;
    const finalMinGap = getDynamicMinGap(obstacles[i].time) * enforceMult;
    if (obstacles[i].time - obstacles[i - 1].time < finalMinGap) {
      obstacles.splice(i, 1);
    }
  }

  return obstacles;
}

// Handle MP3 file drop
function handleMP3Drop(file) {
  if (!file || !file.type.startsWith('audio/')) {
    mp3LoadingMsg = '音声ファイルではありません！';
    setTimeout(() => { mp3LoadingMsg = ''; }, 2000);
    return;
  }
  mp3LoadingMsg = '読み込み中: ' + file.name + '...';
  initAudio();

  const reader = new FileReader();
  reader.onload = function(e) {
    mp3LoadingMsg = 'ビートを解析中...';
    audioCtx.decodeAudioData(e.target.result, function(buffer) {
      customAudioBuffer = buffer;
      const duration = buffer.duration;
      const beats = detectBeats(buffer);
      const bpm = estimateBPM(beats, duration);
      customSongBeats = beats;

      // Calculate bars from duration
      const beatSec = 60 / bpm;
      const totalBeats = Math.floor(duration / beatSec);
      const bars = Math.max(8, Math.floor(totalBeats / 4));

      // Trim filename for display
      let displayName = file.name.replace(/\.[^/.]+$/, '');
      if (displayName.length > 18) displayName = displayName.substring(0, 18) + '…';

      // Remove previous custom song entry if exists
      while (SONGS.length > 4) {
        SONGS.pop();
        SONG_DATA.pop();
      }

      // Add custom song to SONGS array
      SONGS.push({
        name: displayName,
        bpm: bpm,
        bars: bars,
        color: '#00ff88',
        desc: 'BPM ' + bpm + ' — カスタムMP3'
      });

      // Add a dummy SONG_DATA entry (won't be used for synth)
      SONG_DATA.push(SONG_DATA[0]); // placeholder

      // Select the custom song
      songSelectIndex = SONGS.length - 1;
      mp3LoadingMsg = '✓ ' + displayName + ' (BPM ' + bpm + ', ' + beats.length + ' ビート)';
      setTimeout(() => { mp3LoadingMsg = ''; }, 3000);
    }, function(err) {
      mp3LoadingMsg = '音声のデコードに失敗しました！';
      setTimeout(() => { mp3LoadingMsg = ''; }, 2000);
    });
  };
  reader.readAsArrayBuffer(file);
}


// Build the default Minecraft skin canvas (64x64) procedurally
function buildDefaultSkin() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  // Helper: fill a region with a solid color
  function fill(x,y,w,h,col) { g.fillStyle = col; g.fillRect(x,y,w,h); }

  // ---- Head (front: 8,8 → 16,16) ----
  // Skin base
  fill(0, 0, 32, 16, '#ffe5d0');   // all head regions skin base
  // Head front face
  fill(8, 8, 8, 8, '#ffe5d0');
  // Eyes (at row 11–12, cols 10–11 and 13–14)
  fill(10, 11, 2, 1, '#bb4488'); fill(13, 11, 2, 1, '#bb4488');
  // Pupils
  fill(10, 12, 1, 1, '#220022'); fill(14, 12, 1, 1, '#220022');
  // Mouth
  fill(11, 14, 2, 1, '#cc6688');
  // Hair top (8,0 → 16,8) golden blonde
  fill(8, 0, 8, 8, '#e8b830');
  // Hair bangs on forehead (top rows of face)
  fill(8, 8, 8, 2, '#e8b830');
  fill(8, 8, 2, 4, '#e8b830');  // left side bang
  fill(14, 8, 2, 4, '#e8b830'); // right side bang
  // Head right side (0,8 → 8,16) — hair
  fill(0, 8, 8, 8, '#d4a020');
  // Head left side (16,8 → 24,16) — hair
  fill(16, 8, 8, 8, '#d4a020');
  // Head back (24,8 → 32,16) — hair
  fill(24, 8, 8, 8, '#c89018');

  // ---- Body (front: 20,20 → 28,32) ----
  // Black shirt
  fill(20, 20, 8, 12, '#222222');
  // Pink stripes
  fill(20, 22, 8, 1, '#cc4488');
  fill(20, 25, 8, 1, '#cc4488');
  fill(20, 28, 8, 1, '#cc4488');
  // Skull design center
  fill(23, 23, 2, 2, '#ffffff');
  fill(22, 26, 4, 1, '#ffffff');
  // Body back (32,20 → 40,32)
  fill(32, 20, 8, 12, '#1a1a1a');
  // Body top/bottom/sides
  fill(20, 16, 8, 4, '#222222');
  fill(28, 20, 4, 12, '#222222');
  fill(16, 20, 4, 12, '#222222');

  // ---- Right Arm (front: 44,20 → 48,32) ----
  fill(40, 16, 16, 4, '#222222');  // arm top+bottom
  fill(40, 20, 4, 12, '#222222');  // arm right
  fill(44, 20, 4, 12, '#222222');  // arm front — black shirt sleeve
  fill(44, 28, 4, 4, '#ffe5d0');   // hand (skin)
  fill(48, 20, 4, 12, '#222222');  // arm left
  fill(52, 20, 4, 12, '#1a1a1a');  // arm back

  // ---- Left Arm (front: 36,52 → 40,64) ---- (64x64 format)
  fill(32, 48, 16, 4, '#222222');
  fill(32, 52, 4, 12, '#222222');
  fill(36, 52, 4, 12, '#222222');  // front — sleeve
  fill(36, 60, 4, 4, '#ffe5d0');   // hand
  fill(40, 52, 4, 12, '#222222');
  fill(44, 52, 4, 12, '#1a1a1a');

// Handle avatar image drop — parse Minecraft skin PNG (64x64 or 64x32)
function handleAvatarDrop(file) {
  if (!file || !file.type.startsWith('image/')) {
    avatarLoadingMsg = '画像ファイルではありません！';
    setTimeout(() => { avatarLoadingMsg = ''; }, 2000);
    return;
  }
  avatarLoadingMsg = 'スキンを解析中...';

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const w = img.width, h = img.height;
      // Validate Minecraft skin dimensions (64x64 or 64x32)
      if (!((w === 64 && h === 64) || (w === 64 && h === 32))) {
        avatarLoadingMsg = 'マイクラスキン (64x64 or 64x32) ではありません！';
        setTimeout(() => { avatarLoadingMsg = ''; }, 3000);
        return;
      }

      // Draw to 64x64 canvas (if 64x32, mirror arms/legs)
      const skinCanvas = document.createElement('canvas');
      skinCanvas.width = 64;
      skinCanvas.height = 64;
      const sCtx = skinCanvas.getContext('2d');
      sCtx.imageSmoothingEnabled = false;
      sCtx.drawImage(img, 0, 0);

      // If old format (64x32), mirror right arm/leg to left arm/leg slots
      if (h === 32) {
        // Mirror right arm (40,16 16x16) → left arm (32,48 16x16)
        sCtx.save();
        sCtx.translate(48, 48);
        sCtx.scale(-1, 1);
        sCtx.drawImage(img, 40, 16, 16, 16, 0, 0, 16, 16);
        sCtx.restore();
        // Mirror right leg (0,16 16x16) → left leg (16,48 16x16)
        sCtx.save();
        sCtx.translate(32, 48);
        sCtx.scale(-1, 1);
        sCtx.drawImage(img, 0, 16, 16, 16, 0, 0, 16, 16);
        sCtx.restore();
      }

      skinTexture = skinCanvas;
      avatarCustom = { skinCanvas: skinCanvas };
      skinHasHat = checkSkinHasHat(skinCanvas);

      avatarLoadingMsg = '✓ マイクラスキンを適用しました！';
      setTimeout(() => { avatarLoadingMsg = ''; }, 3000);
    };
    img.onerror = function() {
      avatarLoadingMsg = '画像の読み込みに失敗しました！';
      setTimeout(() => { avatarLoadingMsg = ''; }, 2000);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function playKick(time) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sine';
  o.frequency.setValueAtTime(curSongData.kickPitch, time);
  o.frequency.exponentialRampToValueAtTime(40, time + 0.08);
  g.gain.setValueAtTime(1.0, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  o.start(time); o.stop(time + 0.3);
}

function playSnare(time) {
  const len = Math.floor(audioCtx.sampleRate * 0.12);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200;
  const g = audioCtx.createGain();
  n.connect(f); f.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0.7, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  n.start(time); n.stop(time + 0.15);
}

function playHihat(time, open) {
  const len = Math.floor(audioCtx.sampleRate * 0.06);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  const g = audioCtx.createGain();
  n.connect(f); f.connect(g); g.connect(masterGain);
  const dur = open ? 0.12 : 0.04;
  g.gain.setValueAtTime(0.25, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  n.start(time); n.stop(time + dur);
}

function playBass(time, freq, dur) {
  dur = dur || 0.22;
  const o = audioCtx.createOscillator();
  const f = audioCtx.createBiquadFilter();
  const g = audioCtx.createGain();
  o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = curSongData.bassFilter;
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(curSongData.bassGain, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o.start(time); o.stop(time + dur);
}

function playSynth(time, freq, dur) {
  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o1.type = curSongData.synthType; o2.type = curSongData.synthType;
  o1.frequency.setValueAtTime(freq, time);
  o2.frequency.setValueAtTime(freq * 1.006, time);
  o1.connect(g); o2.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(curSongData.synthGain, time);
  g.gain.setValueAtTime(curSongData.synthGain, time + dur * 0.75);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o1.start(time); o2.start(time);
  o1.stop(time + dur); o2.stop(time + dur);
}

// Audio scheduler
function scheduleAudio() {
  if (!audioCtx || gameState !== 'PLAYING') return;
  // Skip synth scheduling for custom MP3 songs
  if (isCustomSong) {
    // Still track beats for visual beat flash
    while (nextStepTime < audioCtx.currentTime + 0.1) {
      const step = stepCount % 16;
      if (step === 0) { beatCount++; beatFlash = 1.0; }
      stepCount++;
      nextStepTime += STEP_S;
    }
    return;
  }
  const sd = curSongData;
  while (nextStepTime < audioCtx.currentTime + 0.1) {
    const step = stepCount % 16;
    const t = nextStepTime;
    if (sd.kick.has(step))  playKick(t);
    if (sd.snare.has(step)) playSnare(t);
    if (sd.ohihat.has(step)) playHihat(t, true);
    else playHihat(t, false);
    if (sd.bassSteps.has(step)) {
      playBass(t, sd.bass[Math.floor(stepCount / 2) % sd.bass.length]);
    }
    if (sd.synthSteps.has(step)) {
      const ni = sd.melody[melodyPos % sd.melody.length];
      if (ni >= 0) playSynth(t, sd.scale[ni % sd.scale.length], BEAT_S * 0.85);
      melodyPos++;
    }
    if (step === 0) { beatCount++; beatFlash = 1.0; }
    stepCount++;
    nextStepTime += STEP_S;
  }
}

// ============================================================
// OBSTACLE CHART GENERATOR — rhythm-synced
// ============================================================
function generateChart() {
  const obstacles = [];
  const bt = BEAT_S;
  const st = STEP_S; // 16th note duration

  // Seeded pseudo-random for repeatable charts per song
  let seed = BPM * 1000 + SONG_BARS * 7;
  function rand() {
    seed = (seed * 16807) % 2147483647;
    return (seed & 0x7fffffff) / 0x7fffffff;
  }

  // Build step patterns FROM the song's actual drum data so obstacles land on audible beats
  const sd = curSongData;
  const kickArr = [...sd.kick].sort((a,b) => a - b);
  const snareArr = [...sd.snare].sort((a,b) => a - b);
  const hihatArr = [...sd.ohihat].sort((a,b) => a - b);
  const synthArr = [...sd.synthSteps].sort((a,b) => a - b);

  // Easy: strong kicks only (beats 1 & 3, or first two distinct kicks)
  const easySteps   = kickArr.length >= 4 ? [kickArr[0], kickArr[2]] : [kickArr[0], kickArr[Math.min(1, kickArr.length-1)]];
  // Normal: all kick positions = quarter-note feel aligned with actual kicks
  const normalSteps = kickArr.slice();
  // Hard: kicks + snares + some hihats for syncopation (deduplicated)
  const hardSet = new Set([...kickArr, ...snareArr, ...hihatArr.filter((_,i) => i % 2 === 0)]);
  const hardSteps   = [...hardSet].sort((a,b) => a - b);
  // Expert: kicks + snares + all hihats = full 8th-note coverage
  const expertSet = new Set([...kickArr, ...snareArr, ...hihatArr]);
  const expertSteps = [...expertSet].sort((a,b) => a - b);
  // 16th-note patterns for Chaos Protocol (song 3)
  const expert16thA = [0, 2, 3, 4, 6, 8, 10, 11, 12, 14]; // 16th bursts mixed with 8ths
  const expert16thB = [0, 1, 4, 6, 7, 8, 10, 12, 13, 14, 15]; // dense 16th runs
  const expert16thC = [0, 2, 4, 5, 6, 8, 10, 12, 13, 14];    // syncopated 16ths

  // Precompute which bars have audible melody (not all -1 entries)
  // Track melody position per bar to determine if a bar has silence
  function barHasMelody(bar) {
    // Count melody notes that play in this bar
    // Each bar = 16 steps, synth plays on synthSteps, melody advances per synthStep
    let melPos = 0;
    // Count total synth steps before this bar
    for (let b = 0; b < bar; b++) {
      for (const step of synthArr) {
        melPos++;
      }
    }
    // Check synth steps in this bar
    let hasNote = false;
    for (const step of synthArr) {
      const ni = sd.melody[melPos % sd.melody.length];
      if (ni >= 0) hasNote = true;
      melPos++;
    }
    return hasNote;
  }

  function barHasDrums(bar) {
    // All bars have the same drum pattern repeated, so check if any drums exist
    return sd.kick.size > 0 || sd.snare.size > 0;
  }

  // Check if a bar is silent (no melody notes and effectively silent drums)
  function barIsSilent(bar) {
    // First 2 bars are intro — silent
    if (bar < 2) return true;
    // Last 2 bars — silent (outro)
    if (bar >= SONG_BARS - 2) return true;
    // Check melody: if all melody notes in this bar are -1 (rest), it's melodically silent
    if (!barHasMelody(bar) && !barHasDrums(bar)) return true;
    return false;
  }

  // Determine musical section based on song structure
  // Returns: 'intro', 'a_melo', 'b_melo', 'chorus', 'breakdown', 'last_chorus', 'outro'
  function getSection(bar) {
    const progress = bar / SONG_BARS;
    if (progress < 0.10) return 'intro';        // ~first 10% = intro
    if (progress < 0.25) return 'a_melo';        // ~10-25% = A melody (low density)
    if (progress < 0.40) return 'b_melo';        // ~25-40% = B melody (medium density)
    if (progress < 0.55) return 'chorus';        // ~40-55% = first chorus (high density)
    if (progress < 0.65) return 'breakdown';     // ~55-65% = breakdown/interlude (calm)
    if (progress < 0.80) return 'b_melo';        // ~65-80% = B melody reprise
    if (progress < 0.92) return 'last_chorus';   // ~80-92% = last chorus (highest density)
    return 'outro';                               // ~92-100% = outro
  }

  // Section density and star probability
  function sectionConfig(section) {
    switch (section) {
      case 'intro':        return { density: 'easy',   starChance: 0.50, isCalm: true };
      case 'a_melo':       return { density: 'easy',   starChance: 0.35, isCalm: true };
      case 'b_melo':       return { density: 'normal', starChance: 0.15, isCalm: false };
      case 'chorus':       return { density: 'hard',   starChance: 0.05, isCalm: false };
      case 'breakdown':    return { density: 'easy',   starChance: 0.45, isCalm: true };
      case 'last_chorus':  return { density: 'expert', starChance: 0.03, isCalm: false };
      case 'outro':        return { density: 'easy',   starChance: 0.40, isCalm: true };
      default:             return { density: 'normal', starChance: 0.10, isCalm: false };
    }
  }

  // Before last chorus, add extra stars (ラスサビ前)
  function isBeforeLastChorus(bar) {
    const progress = bar / SONG_BARS;
    return progress >= 0.75 && progress < 0.80; // 2-3 bars before last chorus
  }

  // Type selection: melody-driven (70%) vs drum-driven (30%)
  // Melody: synth steps get placed. Drums: kick/snare/hihat steps get placed.
  function pickType(step, r, isCalm, starChance) {
    const isKick = sd.kick.has(step);
    const isSnare = sd.snare.has(step);
    const isHihat = sd.ohihat.has(step);
    const isSynth = sd.synthSteps.has(step);

    // Star placement based on starChance
    if (r < starChance) {
      return r < starChance / 2 ? 4 : 5; // STAR_R or STAR_L
    }

    // Calm sections: more stars, gentler obstacles
    if (isCalm) {
      const rr = (r - starChance) / (1 - starChance); // renormalize
      if (rr < 0.30) return 0;      // PYLON_R
      else if (rr < 0.60) return 1; // PYLON_L
      else if (rr < 0.80) return 2; // ARCH
      else return 3;                 // BLOCK
    }

    // Intense sections: obstacle type based on drum vs melody feel
    if (isKick && !isSnare) {
      // Kick: jump or side dodge
      if (r < 0.30) return 3;      // BLOCK (jump)
      else if (r < 0.55) return 0; // PYLON_R
      else if (r < 0.80) return 1; // PYLON_L
      else return 2;               // ARCH (duck)
    } else if (isSnare) {
      // Snare: duck or jump
      if (r < 0.35) return 2;      // ARCH (duck)
      else if (r < 0.60) return 3; // BLOCK (jump)
      else if (r < 0.80) return 0; // PYLON_R
      else return 1;               // PYLON_L
    } else if (isSynth) {
      // Melody-driven: variety
      if (r < 0.25) return 0;
      else if (r < 0.50) return 1;
      else if (r < 0.75) return 2;
      else return 3;
    }
    // Default: balanced
    if (r < 0.25) return 0;
    else if (r < 0.50) return 1;
    else if (r < 0.75) return 2;
    else return 3;
  }

  // Avoid placing same consecutive obstacle type
  let lastType = -1;

  for (let bar = 0; bar < SONG_BARS; bar++) {
    // Skip silent bars (no melody or drums audible)
    if (barIsSilent(bar)) continue;

    const section = getSection(bar);
    const config = sectionConfig(section);
    let starChance = config.starChance;

    // Boost stars before last chorus (ラスサビ前)
    if (isBeforeLastChorus(bar)) starChance = 0.45;

    // Select step pattern based on section density
    let steps;
    const isChaos = selectedSong === 3; // Chaos Protocol — 16th-note expert
    if (isChaos) {
      // Chaos Protocol: ramp quickly into 16th-note density
      if (bar < 4)       steps = normalSteps;
      else if (bar < 10) steps = hardSteps;
      else if (bar < 18) steps = expertSteps;
      else if (bar < 28) steps = expert16thA;
      else if (bar < 40) steps = expert16thB;
      else               steps = expert16thC;
    } else {
      // Section-based density selection
      switch (config.density) {
        case 'easy':   steps = easySteps; break;
        case 'normal': steps = normalSteps; break;
        case 'hard':   steps = hardSteps; break;
        case 'expert': steps = expertSteps; break;
        default:       steps = normalSteps; break;
      }
    }

    // Add musical variation: occasional rest on every 8th bar for breathing room
    if (bar > 4 && bar % 8 === 0 && bar < SONG_BARS - 4 && !isChaos) {
      steps = easySteps;
      starChance = 0.40; // rest bars get more stars
    }

    // Build combined step list: 70% melody steps, 30% drum steps
    // For each step, determine if it's a melody step or drum step
    for (const step of steps) {
      const time = (bar * 16 + step) * st;

      // Skip obstacles during countdown intro and too close to song end
      if (time < CHART_START_OFFSET) continue;
      if (time >= SONG_DURATION - bt * 2) continue;

      // Check if this step has audible content (melody or drums)
      const isSynth = sd.synthSteps.has(step);
      const isDrum = sd.kick.has(step) || sd.snare.has(step) || sd.ohihat.has(step);

      // Skip steps that have no audible content at all
      if (!isSynth && !isDrum) continue;

      // 70% melody, 30% drum weighting: if it's a melody-only step, 70% chance to place
      // If drum-only, 30% chance. If both, always place.
      if (isSynth && !isDrum) {
        if (rand() > 0.70) continue; // skip 30% of melody-only steps
      } else if (isDrum && !isSynth) {
        if (rand() > 0.30) continue; // skip 70% of drum-only steps
      }
      // Both melody+drum: always place

      let typeIdx = pickType(step, rand(), config.isCalm, starChance);

      // Avoid 3+ consecutive same types
      if (typeIdx === lastType) {
        typeIdx = (typeIdx + 1 + Math.floor(rand() * 4)) % 6;
      }
      lastType = typeIdx;

      obstacles.push({
        time,
        type: OBS_TYPES[typeIdx],
        judged: false,
        judgment: null,
        hitTime: 0
      });
    }
  }

  obstacles.sort((a, b) => a.time - b.time);

  // Enforce minimum spacing between obstacles
  // Scroll speed only affects visual spacing, NOT obstacle count
  const builtInMinGap = st * 1.5;
  for (let i = obstacles.length - 1; i > 0; i--) {
    if (obstacles[i].time - obstacles[i - 1].time < builtInMinGap) {
      obstacles.splice(i, 1);
    }
  }

  return obstacles;
}

function zToScreen(wz) {
  const t = Math.pow(Math.max(0, wz), PERSP_POW);
  return {
    y: VY + (ROAD_BOTTOM - VY) * t,
    hw: ROAD_HW * t,
    t
  };
}

// ============================================================
// PARTICLES
// ============================================================
function spawnPart(x, y, color, count) {
  for (let i = 0; i < count && particles.length < 200; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 100,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

function updatePart(deltaT) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * deltaT;
    p.y += p.vy * deltaT;
    p.vy += 400 * deltaT;
    p.life -= deltaT;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawPart() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
