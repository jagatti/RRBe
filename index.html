// ============================================================
const keys = {};
const justPressed = {};

window.addEventListener('keydown', (e) => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }

  // Volume control — available on settings screen
  if (gameState === 'SETTINGS') {
    if (e.code === 'Minus' || e.code === 'NumpadSubtract') {
      gameVolume = Math.max(0, gameVolume - 0.05);
      applyVolume();
    } else if (e.code === 'Equal' || e.code === 'NumpadAdd') {
      gameVolume = Math.min(1, gameVolume + 0.05);
      applyVolume();
    }
    if (e.code === 'ArrowUp') {
      settingsSelection = (settingsSelection + 4) % 5; // 0,1,2,3,4
    } else if (e.code === 'ArrowDown') {
      settingsSelection = (settingsSelection + 1) % 5;
    } else if (e.code === 'ArrowLeft' && settingsSelection === 0) {
      gameVolume = Math.max(0, gameVolume - 0.05);
      applyVolume();
    } else if (e.code === 'ArrowRight' && settingsSelection === 0) {
      gameVolume = Math.min(1, gameVolume + 0.05);
      applyVolume();
    } else if (e.code === 'ArrowLeft' && settingsSelection === 1) {
      scrollSpeedMult = Math.max(SCROLL_SPEED_MIN, +(scrollSpeedMult - 0.1).toFixed(1));
    } else if (e.code === 'ArrowRight' && settingsSelection === 1) {
      scrollSpeedMult = Math.min(SCROLL_SPEED_MAX, +(scrollSpeedMult + 0.1).toFixed(1));
    } else if ((e.code === 'Space' || e.code === 'Enter') && settingsSelection === 3) {
      // Reset avatar
      avatarCustom = null;
      skinTexture = null;
      skinHasHat = false;
      avatarLoadingMsg = 'スキンを初期化しました！';
      setTimeout(() => { avatarLoadingMsg = ''; }, 2000);
    } else if ((e.code === 'Space' || e.code === 'Enter') && settingsSelection === 4) {
      // Back to song select
      gameState = 'SONG_SELECT';
    } else if (e.code === 'Escape') {
      gameState = 'SONG_SELECT';
    }
  } else if (gameState === 'SONG_SELECT') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
      songSelectIndex = (songSelectIndex + SONGS.length - 1) % SONGS.length;
    } else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
      songSelectIndex = (songSelectIndex + 1) % SONGS.length;
    } else if (e.code === 'Space' || e.code === 'Enter') {
      selectSong(songSelectIndex);
    } else if (e.code === 'KeyS') {
      // Open settings
      gameState = 'SETTINGS';
      settingsSelection = 0;
    }
    // Toggle difficulty for custom songs
    if (e.code === 'KeyD' && songSelectIndex >= 4) {
      customDifficulty = customDifficulty === 'NORMAL' ? 'HARD' : customDifficulty === 'HARD' ? 'EXPERT' : 'NORMAL';
    }
  } else if (gameState === 'START' && e.code === 'Space') {
    startGame();
  } else if (gameState === 'RESULT' && (e.code === 'KeyR' || e.code === 'Space')) {
    resetToStart();
  } else if (gameState === 'PLAYING') {
    if (justPressed[e.code] && ['ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.code)) {
      judgeKeyPress(e.code);
      keyFlash[e.code] = 1.0;
    }
  }
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Drag and drop for MP3 files and avatar images
canvas.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (gameState === 'SONG_SELECT') mp3DropZoneHover = true;
  if (gameState === 'SETTINGS') avatarDropHover = true;
});
canvas.addEventListener('dragleave', (e) => {
  e.preventDefault();
  mp3DropZoneHover = false;
  avatarDropHover = false;
});
canvas.addEventListener('drop', (e) => {
  e.preventDefault();
  mp3DropZoneHover = false;
  avatarDropHover = false;
  if (e.dataTransfer.files.length > 0) {
    const file = e.dataTransfer.files[0];
    if (gameState === 'SONG_SELECT' && file.type.startsWith('audio/')) {
      handleMP3Drop(file);
    } else if (gameState === 'SETTINGS' && file.type.startsWith('image/')) {
      handleAvatarDrop(file);
    }
  }
});

// ============================================================
// TIMING / JUDGMENT
// ============================================================
function musicTime() {
  if (!audioCtx || gameStartTime < 0) return 0;
  return audioCtx.currentTime - gameStartTime;
}

function judgeKeyPress(keyCode) {
  const now = musicTime();
  let best = null, bestDiff = Infinity;

  for (const o of obstacles) {
    if (o.judged) continue;
    // Only match obstacles whose correct key matches the pressed key
    if (OBS_KEYS[o.type] !== keyCode) continue;
    const diff = Math.abs(o.time - now);
    if (diff < bestDiff && diff < T_MISS) {
      bestDiff = diff;
      best = o;
    }
  }

  if (!best) {
    // No obstacle to judge — still perform the character action
    if (keyCode === 'ArrowLeft')  { charAction = 'DODGE_L'; charActionTimer = ACTION_DUR; }
    if (keyCode === 'ArrowRight') { charAction = 'DODGE_R'; charActionTimer = ACTION_DUR; }
    if (keyCode === 'ArrowDown')  { charAction = 'DUCK';    charActionTimer = ACTION_DUR; }
    if (keyCode === 'ArrowUp')    { charAction = 'JUMP';    charActionTimer = ACTION_DUR; charJumpY = 0; }
    return;
  }

  best.judged = true;
  best.hitTime = now;

  let j;
  if (bestDiff <= T_PERFECT)    j = 'PERFECT';
  else if (bestDiff <= T_GREAT) j = 'GREAT';
  else if (bestDiff <= T_NICE)  j = 'NICE';
  else                          j = 'BAD';

  best.judgment = j;
  judgeCounts[j]++;

  if (j === 'BAD') {
    combo = 0;
  } else {
    combo++;
    comboPopTimer = 0.15; // trigger pop animation
    if (combo > maxCombo) maxCombo = combo;
  }

  // Score: accumulate raw judge points. Display score = rawScore / (N * 100) * 1000000
  // All Perfect = exactly 1,000,000 points
  score += JUDGE_SCORE[j];

  lastJudge = j;
  judgeTimer = 0.5;

  // Set character action
  if (keyCode === 'ArrowLeft')  { charAction = 'DODGE_L'; charActionTimer = ACTION_DUR; }
  if (keyCode === 'ArrowRight') { charAction = 'DODGE_R'; charActionTimer = ACTION_DUR; }
  if (keyCode === 'ArrowDown')  { charAction = 'DUCK';    charActionTimer = ACTION_DUR; }
  if (keyCode === 'ArrowUp')    { charAction = 'JUMP';    charActionTimer = ACTION_DUR; charJumpY = 0; }

  // FX
  spawnPart(VX, ROAD_BOTTOM, JUDGE_COLORS[j], j === 'PERFECT' ? 20 : j === 'GREAT' ? 14 : 8);
  addRhythmBallFlash(j);

  updateAccuracy();
}

function processAutoMisses() {
  const now = musicTime();
  for (const o of obstacles) {
    if (o.judged) continue;
    if (now > o.time + T_MISS) {
      o.judged = true;
      o.judgment = 'MISS';
      judgeCounts.MISS++;
      combo = 0;
      lastJudge = 'MISS';
      judgeTimer = 0.35;
      if (audioCtx) sfxMiss(audioCtx.currentTime);
      addRhythmBallFlash('MISS');
      updateAccuracy();
    }
  }
}

function updateAccuracy() {
  const tot = judgeCounts.PERFECT + judgeCounts.GREAT + judgeCounts.NICE + judgeCounts.BAD + judgeCounts.MISS;
  if (tot === 0) { accuracy = 100; return; }
  const s = judgeCounts.PERFECT * 100 + judgeCounts.GREAT * 80 + judgeCounts.NICE * 50 + judgeCounts.BAD * 20;
  accuracy = s / (tot * 100) * 100;
}

// Display score: raw score mapped to 0-1,000,000 scale (All Perfect = 1,000,000)
function getDisplayScore() {
  const total = obstacles.length;
  if (total === 0) return 0;
  return Math.round(score * 1000000 / (total * 100));
}

// Full combo check: all judgments NICE or better (no BAD, no MISS)
function isFullCombo() {
  return obstacles.length > 0 && judgeCounts.MISS === 0 && judgeCounts.BAD === 0;
}

// All Perfect check
function isAllPerfect() {
  return obstacles.length > 0 && judgeCounts.PERFECT === obstacles.length;
}

// ============================================================
// UPDATE
// ============================================================
function update(deltaT) {
  if (gameState === 'READY_GO') {
    readyGoTimer -= deltaT;
    // Don't scroll road or play music during READY_GO — just animate character idle
    charPhase += deltaT * 12;
    if (readyGoTimer <= 0) {
      gameState = 'PLAYING';
      // Start music and game timing NOW when GO finishes
      if (audioCtx) {
        gameStartTime = audioCtx.currentTime;
        nextStepTime = gameStartTime;
        stepCount = 0; beatCount = 0; melodyPos = 0;
      }
      if (isCustomSong) {
        startCustomAudio();
      }
    }
    return;
  }

  if (gameState !== 'PLAYING') return;

  scheduleAudio();
  processAutoMisses();

  beatFlash = Math.max(0, beatFlash - deltaT * 4);
  judgeTimer = Math.max(0, judgeTimer - deltaT);
  comboPopTimer = Math.max(0, comboPopTimer - deltaT);
  for (const k in keyFlash) keyFlash[k] = Math.max(0, keyFlash[k] - deltaT * 5);

  // Character action timer (skip during CHEER — cheer continues until result)
  if (charAction !== 'CHEER' && charActionTimer > 0) {
    charActionTimer -= deltaT;
    if (charAction === 'JUMP') {
      const t = 1 - (charActionTimer / ACTION_DUR);
      charJumpY = Math.sin(t * Math.PI) * 90;
    }
    if (charActionTimer <= 0) {
      charAction = 'RUN';
      charActionTimer = 0;
      charJumpY = 0;
    }
  }

  updatePart(deltaT);

  // Stop road scrolling when goal is reached
  if (!goalReached) {
    roadScroll = (roadScroll + deltaT * 3.0) % 1.0;
  }
  charPhase += deltaT * 12;

  const now = musicTime();

  // Goal line: start showing when near the end of the song
  const lastObsTime = obstacles.length > 0 ? obstacles[obstacles.length - 1].time : SONG_DURATION;
  // For custom songs, goal is based on song duration (wait for song to finish)
  const goalTime = isCustomSong ? Math.max(lastObsTime, SONG_DURATION - 2.0) : lastObsTime;
  const goalAppearTime = goalTime - effectiveScrollTime() * 0.5;
  if (now >= goalAppearTime) {
    // goalLineZ goes from 0 (horizon) to 1 (judgment line)
    goalLineZ = Math.min(1.3, (now - goalAppearTime) / effectiveScrollTime());
    // Stop scrolling when goal line reaches the judgment line
    if (goalLineZ >= 1.0 && !goalReached) {
      goalReached = true;
      goalLineZ = 1.0; // freeze at judgment line
      // Start celebration if full combo
      if (isFullCombo()) {
        charAction = 'CHEER';
        charActionTimer = 0;
        charJumpY = 0;
        celebrationTimer = 2.0; // 2 seconds of celebration
      }
    }
    if (goalReached) {
      goalLineZ = 1.0; // keep goal at judgment line
    }
  } else {
    goalLineZ = -1;
  }

  // Celebration countdown
  if (celebrationTimer > 0) {
    celebrationTimer -= deltaT;
  }

  const allDone = obstacles.length > 0 && obstacles.every(o => o.judged);
  // For custom songs, wait until the actual song file finishes playing
  const endTime = isCustomSong ? Math.max(lastObsTime + 1.5, SONG_DURATION) : lastObsTime + 1.5;
  // Wait for celebration to finish before showing result
  const canShowResult = celebrationTimer <= 0;
  if (allDone && now >= endTime && canShowResult) {
    stopCustomAudio();
    gameState = 'RESULT';
  }
}

// ============================================================
// RENDERING: Background
// ============================================================
function pseudoRand(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, VY + 40);
  g.addColorStop(0, '#05000d');
  g.addColorStop(0.6, '#0a0020');
  g.addColorStop(1, '#001020');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.save();
  for (let i = 0; i < 100; i++) {
    const sx = pseudoRand(i * 3 + 42) * W;
    const sy = pseudoRand(i * 3 + 43) * (VY - 10);
    const sr = pseudoRand(i * 3 + 44) * 1.2 + 0.3;
    ctx.globalAlpha = 0.3 + pseudoRand(i + 99) * 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Ground
  const gg = ctx.createLinearGradient(0, VY, 0, H);
  gg.addColorStop(0, '#030308');
  gg.addColorStop(1, '#020206');
  ctx.fillStyle = gg;
  ctx.fillRect(0, VY, W, H - VY);

  // Horizon glow (subtle, no blue lines)
  const hg = ctx.createRadialGradient(VX, VY, 0, VX, VY, 200);
  hg.addColorStop(0, 'rgba(60,120,200,0.15)');
  hg.addColorStop(0.5, 'rgba(30,60,120,0.06)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, VY - 40, W, 120);
}

// ============================================================
// RENDERING: Track (curved road, sphere-surface style like R2BEAT)
// ============================================================

// Curved road edge X at a given z (0=horizon, 1=near).
// Uses a power curve so edges bulge outward, giving a "running on a sphere" look.
const ROAD_CURVE_POW = 0.55; // <1 = convex outward bulge
function roadEdgeX(z, side) {
  // side: -1 for left, +1 for right
  const s = zToScreen(z);
  // Apply convex curve: edges spread out faster than linear
  const curve = Math.pow(Math.max(0, z), ROAD_CURVE_POW);
  const hw = ROAD_HW * curve;
  return VX + side * hw;
}

function drawTrack() {
  // Road surface — filled with curved edges
  const CURVE_STEPS = 40;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(VX, VY);
  // Right edge from horizon to bottom
  for (let i = 1; i <= CURVE_STEPS; i++) {
    const z = i / CURVE_STEPS;
    const s = zToScreen(z);
    ctx.lineTo(roadEdgeX(z, 1), s.y);
  }
  // Bottom right to bottom-left (below road)
  const sBottom = zToScreen(1.0);
  ctx.lineTo(roadEdgeX(1.0, 1), H);
  ctx.lineTo(roadEdgeX(1.0, -1), H);
  // Left edge from bottom back to horizon
  for (let i = CURVE_STEPS; i >= 0; i--) {
    const z = i / CURVE_STEPS;
    const s = zToScreen(z);
    ctx.lineTo(roadEdgeX(z, -1), s.y);
  }
  ctx.closePath();
  const rg = ctx.createLinearGradient(VX, VY, VX, H);
  rg.addColorStop(0, '#0a0a14');
  rg.addColorStop(1, '#0e0e1c');
  ctx.fillStyle = rg;
  ctx.fill();
  ctx.restore();

  // Scrolling horizontal road lines (curved arcs)
  const NUM_LINES = 22;
  ctx.save();
  for (let i = 0; i < NUM_LINES; i++) {
    const z = (i + roadScroll) / NUM_LINES;
    const s = zToScreen(z);
    if (s.t < 0.005) continue;
    const alpha = Math.min(1, s.t * 1.5) * 0.2;
    ctx.strokeStyle = `rgba(50,80,140,${alpha})`;
    ctx.lineWidth = 1;
    const lx = roadEdgeX(z, -1);
    const rx = roadEdgeX(z, 1);
    // Draw curved horizontal line (arc bowing downward for sphere feel)
    const arcSag = 8 * Math.pow(z, ROAD_CURVE_POW); // how much the arc bows down
    ctx.beginPath();
    ctx.moveTo(lx, s.y);
    ctx.quadraticCurveTo(VX, s.y + arcSag, rx, s.y);
    ctx.stroke();
  }
  ctx.restore();

  // Lane divider lines (6 lanes visible, curved paths)
  ctx.save();
  const NUM_VISIBLE_LANES = 6;
  const LANE_STEPS = 30;
  for (let i = 1; i < NUM_VISIBLE_LANES; i++) {
    const laneT = i / NUM_VISIBLE_LANES; // 0..1 across road width
    ctx.strokeStyle = 'rgba(60,100,180,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    for (let j = 0; j <= LANE_STEPS; j++) {
      const z = j / LANE_STEPS;
      const s = zToScreen(z);
      const lx = roadEdgeX(z, -1);
      const rx = roadEdgeX(z, 1);
      const x = lx + (rx - lx) * laneT;
      if (j === 0) ctx.moveTo(x, s.y);
      else ctx.lineTo(x, s.y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();

  // Road edges (neon, curved — fade out near horizon to create clean horizon line)
  ctx.save();
  for (const side of [-1, 1]) {
    ctx.beginPath();
    const FADE_START = 0.15; // start drawing edges from this z (avoid tip)
    let started = false;
    for (let i = 0; i <= CURVE_STEPS; i++) {
      const z = i / CURVE_STEPS;
      if (z < FADE_START) continue;
      const s = zToScreen(z);
      const x = roadEdgeX(z, side);
      if (!started) { ctx.moveTo(x, s.y); started = true; }
      else ctx.lineTo(x, s.y);
    }
    // Fade alpha along the edge
    const fadeAlpha = 0.8;
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#0088ff';
    ctx.strokeStyle = `rgba(0,136,255,${fadeAlpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();

  // Side barriers with lights
  drawSideBarriers();

  // Center lane highlight (subtle glow on the center "active" lane)
  drawCenterLaneGlow();
}

function drawSideBarriers() {
  const NUM_POSTS = 3;
  ctx.save();
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < NUM_POSTS; i++) {
      const z = (i + roadScroll) / NUM_POSTS;
      const s = zToScreen(z);
      if (s.t < 0.01) continue;
      const x = roadEdgeX(z, side) + side * 8 * s.t;
      const h = 25 * s.t;
      const alpha = Math.min(1, s.t * 2) * 0.6;

      ctx.fillStyle = `rgba(40,60,120,${alpha})`;
      ctx.fillRect(x - 2 * s.t, s.y - h, 4 * s.t, h);

      // Yellow light on top (like R2BEAT road lights)
      ctx.fillStyle = `rgba(255,200,50,${alpha * 0.9})`;
      ctx.shadowColor = '#ffcc33';
      ctx.shadowBlur = 10 * s.t;
      ctx.beginPath();
      ctx.arc(x, s.y - h, 3.5 * s.t, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

function drawCenterLaneGlow() {
  // Subtle glow on the center portion of the road
  ctx.save();
  const gw = 60; // glow width at bottom
  const grad = ctx.createLinearGradient(VX - gw, 0, VX + gw, 0);
  grad.addColorStop(0, 'rgba(0,150,255,0)');
  grad.addColorStop(0.3, 'rgba(0,150,255,0.04)');
  grad.addColorStop(0.5, 'rgba(0,150,255,0.07)');
  grad.addColorStop(0.7, 'rgba(0,150,255,0.04)');
  grad.addColorStop(1, 'rgba(0,150,255,0)');
  ctx.fillStyle = grad;
  // Draw from vanishing point to bottom
  ctx.beginPath();
  ctx.moveTo(VX - 3, VY);
  ctx.lineTo(VX - gw, ROAD_BOTTOM);
  ctx.lineTo(VX + gw, ROAD_BOTTOM);
  ctx.lineTo(VX + 3, VY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ============================================================
// RENDERING: Judgment Zone marker
// ============================================================
function drawJudgeZone() {
  const s = zToScreen(1.0);
  const y = s.y;

  ctx.save();
  const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 1000 * 4);

  // Horizontal glow line across the road
  ctx.shadowColor = '#00ccff';
  ctx.shadowBlur = 18 * pulse;
  ctx.strokeStyle = `rgba(0,200,255,${0.5 * pulse})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(VX - s.hw, y);
  ctx.lineTo(VX + s.hw, y);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
// RENDERING: Rhythm Balls (timing indicators)
// ============================================================
function drawRhythmBalls() {
  const now = musicTime();
  const r = RHYTHM_BALL_RADIUS;

  // Target position: slightly below screen center (y=424, screen center=384)
  const targetX = VX;
  const targetY = H / 2 + 40;

  // Start from screen edges, same Y as target (straight horizontal line)
  const leftStartX = -r;        // left edge of screen
  const rightStartX = W + r;    // right edge of screen

  ctx.save();

  // Draw approaching balls for upcoming obstacles
  for (const o of obstacles) {
    if (o.judged) continue;
    const timeDiff = o.time - now;
    if (timeDiff < 0 || timeDiff > RHYTHM_BALL_TRAVEL) continue;

    // Progress: 0 = at edge, 1 = at target — constant speed (linear)
    const progress = 1 - (timeDiff / RHYTHM_BALL_TRAVEL);

    // Straight line, constant speed — no easing
    const leftX = leftStartX + (targetX - leftStartX) * progress;
    const rightX = rightStartX + (targetX - rightStartX) * progress;
    const ballY = targetY;  // same Y throughout (straight horizontal)

    // Alpha: fade in quickly, full near target
    const alpha = Math.min(1, progress * 2.5);

    // Color transitions: orange → white — balls turn white exactly when they touch at center (PERFECT)
    // PERFECT zone = T_PERFECT / RHYTHM_BALL_TRAVEL of total travel, start blending well before
    const perfectThreshold = 1.0 - T_PERFECT / RHYTHM_BALL_TRAVEL; // ~0.908
    const blendStart = perfectThreshold - 0.15; // start blending ~0.15 before PERFECT zone
    const perfectZone = Math.max(0, Math.min(1, (progress - blendStart) / (1.0 - blendStart)));
    const rr = Math.round(255);
    const gg = Math.round(136 + (255 - 136) * perfectZone);
    const bb = Math.round(51 + (255 - 51) * perfectZone);
    const ballCol = `rgb(${rr},${gg},${bb})`;

    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = ballCol;
    ctx.shadowColor = ballCol;
    ctx.shadowBlur = 6 + perfectZone * 10;

    // Left ball
    ctx.beginPath();
    ctx.arc(leftX, ballY, r, 0, Math.PI * 2);
    ctx.fill();

    // Right ball
    ctx.beginPath();
    ctx.arc(rightX, ballY, r, 0, Math.PI * 2);
    ctx.fill();

    // Small trail effect
    if (progress > 0.1) {
      ctx.globalAlpha = alpha * 0.2;
      ctx.shadowBlur = 0;
      const trailOff = (1 - progress) * 30;
      ctx.beginPath();
      ctx.arc(leftX - trailOff, ballY, r * 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(rightX + trailOff, ballY, r * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw hit feedback flashes
  for (let i = rhythmBallFlashes.length - 1; i >= 0; i--) {
    const f = rhythmBallFlashes[i];
    f.timer -= dt;
    if (f.timer <= 0) {
      rhythmBallFlashes.splice(i, 1);
      continue;
    }

    const t = f.timer / 0.35; // normalize 0→1
    const flashR = r + (1 - t) * 12; // expand on hit

    // Color based on judgment
    let col, glowCol;
    if (f.judgment === 'PERFECT') {
      col = '#ffffff';
      glowCol = '#ffffff';
    } else if (f.judgment === 'GREAT') {
      col = '#ffdd88';
      glowCol = '#ffcc44';
    } else if (f.judgment === 'NICE') {
      col = '#ff9933';
      glowCol = '#ff8822';
    } else if (f.judgment === 'BAD') {
      col = '#dd4422';
      glowCol = '#cc2200';
    } else {
      col = '#ff2244';
      glowCol = '#ff0022';
    }

    ctx.globalAlpha = t * 0.9;
    ctx.fillStyle = col;
    ctx.shadowColor = glowCol;
    ctx.shadowBlur = 20 * t;

    // Flash above character (where balls converge)
    ctx.beginPath();
    ctx.arc(targetX, targetY, flashR, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// Add rhythm ball flash on judgment
function addRhythmBallFlash(judgment) {
  rhythmBallFlashes.push({ judgment, timer: 0.35 });
}

// ============================================================
// RENDERING: Obstacles
// ============================================================
function drawObstacles() {
  const now = musicTime();

  // Collect visible obstacles
  const visible = [];
  for (const o of obstacles) {
    const z = 1.0 - (o.time - now) / effectiveScrollTime();
    if (z < OBS_VIS_CUTOFF - 0.05 || z > 1.3) continue;
    if (o.judged && o.judgment !== 'MISS') continue;
    visible.push({ obs: o, z });
  }
  visible.sort((a, b) => a.z - b.z);

  for (const { obs: o, z } of visible) {
    if (z < OBS_VIS_CUTOFF) continue;

    // Use road perspective mapping so obstacles move WITH the road surface
    const s = zToScreen(z);
    const y = s.y;
    // Linear scale: gentle size progression from far to near
    const zClamped = Math.max(0, Math.min(1.0, z)); // clamp z for scale calculation
    const scale = OBS_SCALE_MIN + zClamped * (OBS_SCALE_MAX - OBS_SCALE_MIN);

    // Alpha: far obstacles start at OBS_FAR_ALPHA, gradually increase to 1.0
    // This lets players see obstacles from much further away
    let alpha;
    if (z <= OBS_VIS_CUTOFF) {
      alpha = 0;
    } else if (z <= OBS_FULL_ALPHA_Z) {
      // Fade in from OBS_FAR_ALPHA at cutoff to 1.0 at OBS_FULL_ALPHA_Z
      // Quadratic easing keeps obstacles thin longer, matching gameplay feel
      const fadeProgress = (z - OBS_VIS_CUTOFF) / (OBS_FULL_ALPHA_Z - OBS_VIS_CUTOFF);
      alpha = OBS_FAR_ALPHA + (1.0 - OBS_FAR_ALPHA) * fadeProgress * fadeProgress;
    } else {
      alpha = 1.0;
    }
    if (o.judged && o.judgment === 'MISS') {
      const fadeZ = z - 1.0;
      alpha = Math.max(0, 1 - fadeZ * 4) * 0.35;
    }

    ctx.save();
    ctx.globalAlpha = alpha;

    const col = o.judged && o.judgment === 'MISS' ? '#555' : OBS_COLORS[o.type];
    // X offset for side obstacles follows curved road edges
    const curvedHW = ROAD_HW * Math.pow(Math.max(0, z), ROAD_CURVE_POW);
    const sideOff = curvedHW * 0.12;

    if (o.type === 'PYLON_R') {
      drawPylon(VX + sideOff, y, scale, col, false);
    } else if (o.type === 'PYLON_L') {
      drawPylon(VX - sideOff, y, scale, col, true);
    } else if (o.type === 'ARCH') {
      drawArch(VX, y, scale, col);
    } else if (o.type === 'BLOCK') {
      drawBlock(VX, y, scale, col);
    } else if (o.type === 'STAR_R') {
      drawStar(VX + sideOff, y, scale, col, false);
    } else if (o.type === 'STAR_L') {
      drawStar(VX - sideOff, y, scale, col, true);
    }

    // Near-judgment-line boost glow
    if (!o.judged && z > 0.8) {
      const boost = (z - 0.8) * 5;
      ctx.shadowColor = col;
      ctx.shadowBlur = 20 * boost;
      ctx.fillStyle = col;
      ctx.globalAlpha = boost * 0.15;
      ctx.beginPath();
      ctx.arc(VX, y, 35 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function drawPylon(x, y, scale, color, isLeft) {
  // Traffic cone / pylon shape
  const w = 28 * scale;
  const h = 70 * scale;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 8 * scale;

  // Cone body (trapezoid)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x - w, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w * 0.4, y - h);
  ctx.lineTo(x - w * 0.4, y - h);
  ctx.closePath();
  ctx.fill();

  // White stripes
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.7;
  const stripeH = h * 0.15;
  ctx.fillRect(x - w * 0.85, y - h * 0.35, w * 1.7, stripeH);
  ctx.fillRect(x - w * 0.65, y - h * 0.65, w * 1.3, stripeH);
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawArch(x, y, scale, color) {
  // Arch / gate shape — tall narrow ∩ shape: very tall posts with narrow rounded top
  const w = 90 * scale;      // wider arch (half-width of opening)
  const h = 190 * scale;     // much taller total height
  const postW = 14 * scale;
  const postH = h * 0.78;    // very tall vertical posts (78% of height)
  const archTop = y - postH; // where posts end and curve begins

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 10 * scale;

  // Left post
  ctx.fillStyle = color;
  ctx.fillRect(x - w - postW, y - postH, postW, postH);
  // Right post
  ctx.fillRect(x + w, y - postH, postW, postH);

  // Narrow rounded top (∩ shape) — tight curve connecting post tops
  ctx.beginPath();
  ctx.moveTo(x - w - postW, archTop);
  ctx.bezierCurveTo(
    x - w - postW, y - h,   // left control — pull up to full height
    x + w + postW, y - h,   // right control — pull up to full height
    x + w + postW, archTop   // end at right post top
  );
  ctx.lineTo(x + w, archTop);
  ctx.bezierCurveTo(
    x + w, y - h + postW * 1.2,
    x - w, y - h + postW * 1.2,
    x - w, archTop
  );
  ctx.closePath();
  ctx.fill();

  // Glow effect on arch ceiling
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(x - w - postW, archTop);
  ctx.bezierCurveTo(
    x - w - postW, y - h,
    x + w + postW, y - h,
    x + w + postW, archTop
  );
  ctx.lineTo(x + w, archTop);
  ctx.bezierCurveTo(
    x + w, y - h + postW * 1.2,
    x - w, y - h + postW * 1.2,
    x - w, archTop
  );
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawBlock(x, y, scale, color) {
  // Ground block - low obstacle to jump over
  const w = 45 * scale;
  const h = 38 * scale;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 8 * scale;

  // Block body
  ctx.fillStyle = color;
  ctx.fillRect(x - w, y - h, w * 2, h);

  // Top face (lighter)
  ctx.fillStyle = '#88ff88';
  ctx.globalAlpha = 0.4;
  ctx.fillRect(x - w, y - h, w * 2, h * 0.3);
  ctx.globalAlpha = 1;

  // Side highlight
  ctx.strokeStyle = '#fff';
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 1;
  ctx.strokeRect(x - w, y - h, w * 2, h);
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawStar(x, y, scale, color, isLeft) {
  // Yellow star collectible
  const r = 34 * scale;
  const ir = 16 * scale;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 12 * scale;
  ctx.fillStyle = color;

  // Gentle left-right sway instead of full rotation
  const sway = Math.sin(performance.now() / 600) * 0.18; // ~10° max tilt
  ctx.translate(x, y - r * 0.5);
  ctx.rotate(sway);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const outerAngle = (i * 2 * Math.PI / 5) - Math.PI / 2;
    const innerAngle = ((i + 0.5) * 2 * Math.PI / 5) - Math.PI / 2;
    const ox = Math.cos(outerAngle) * r;
    const oy = Math.sin(outerAngle) * r;
    const ix = Math.cos(innerAngle) * ir;
    const iy = Math.sin(innerAngle) * ir;
    if (i === 0) ctx.moveTo(ox, oy);
    else ctx.lineTo(ox, oy);
    ctx.lineTo(ix, iy);
  }
  ctx.closePath();
  ctx.fill();

  // Inner highlight
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.arc(0, 0, ir * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}
function drawCharacter() {
  const baseY = ROAD_BOTTOM;  // feet ON the road at judgment line
  const phase = charPhase;
  const skin = getActiveSkin();

  // Calculate character position based on action
  let cx = VX;
  let cy = baseY;
  let scaleY = 1.0;

  if (charAction === 'DODGE_L') {
    const t = 1 - (charActionTimer / ACTION_DUR);
    const sway = Math.sin(t * Math.PI) * 25;
    cx = VX - sway;
  } else if (charAction === 'DODGE_R') {
    const t = 1 - (charActionTimer / ACTION_DUR);
    const sway = Math.sin(t * Math.PI) * 25;
    cx = VX + sway;
  } else if (charAction === 'DUCK') {
    scaleY = 0.5;
  } else if (charAction === 'JUMP') {
    cy = baseY - charJumpY;
  } else if (charAction === 'CHEER') {
    // Celebration: character bounces joyfully
    const cheerBounce = Math.abs(Math.sin(phase * 0.5)) * 30;
    cy = baseY - cheerBounce;
  }

  // Running bounce (only while running), cheer animation
  const isRunning = charAction === 'RUN';
  const isCheering = charAction === 'CHEER';
  const bounce = isRunning ? Math.abs(Math.sin(phase)) * 4 : 0;
  const legSwing = isRunning ? Math.sin(phase) * 0.4 : (isCheering ? Math.sin(phase * 0.5) * 0.2 : 0);
  const armSwing = isRunning ? Math.sin(phase + Math.PI) * 0.5 : (isCheering ? -1.2 + Math.sin(phase * 0.8) * 0.4 : 0); // arms raised during cheer

  ctx.save();
  ctx.translate(cx, cy - bounce);

  // Character scale — Minecraft blocky style
  // Character total unscaled height ≈ 56px. Arch at foreground ≈ 161px.
  // sc=2.6 → ~146px: slightly smaller than the arch.
  const sc = 2.6;
  ctx.scale(sc, sc * scaleY);

  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 2 + bounce, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pixel size for drawing — Minecraft skin parts are small (4-8px),
  // we scale them up to game size. Character total height ~50px at sc=1.
  // Head = 8x8 → draw at 20x20, Body = 8x12 → 12x18, Arm = 4x12 → 6x18, Leg = 4x12 → 6x18
  const pxHead = 2.5;  // pixel multiplier for head (8px * 2.5 = 20)
  const pxBody = 1.5;  // pixel multiplier for body
  const pxLimb = 1.5;  // pixel multiplier for arms/legs

  // Positions (origin at feet center, y goes up)
  const legH = 12 * pxLimb;   // 18
  const bodyH = 12 * pxBody;  // 18
  const headH = 8 * pxHead;   // 20
  const headW = 8 * pxHead;   // 20
  const bodyW = 8 * pxBody;   // 12
  const armW = 4 * pxLimb;    // 6
  const armH = 12 * pxLimb;   // 18
  const legW = 4 * pxLimb;    // 6

  const feetY = 0;             // bottom
  const legTopY = -legH;       // -18
  const bodyTopY = legTopY - bodyH; // -36
  const headTopY = bodyTopY - headH; // -56

  ctx.imageSmoothingEnabled = false; // crisp pixels!

  // Helper: draw a skin region scaled to target rect
  // sx,sy,sw,sh = source region in skin texture
  // dx,dy,dw,dh = destination rect
  function drawPart(sx, sy, sw, sh, dx, dy, dw, dh) {
    ctx.drawImage(skin, sx, sy, sw, sh, dx, dy, dw, dh);
  }

  // --- RIGHT LEG ---
  ctx.save();
  ctx.translate(-legW/2, feetY - legH);
  ctx.rotate(legSwing);
  // Right leg front: skin(4,20, 4,12)
  drawPart(4, 20, 4, 12, -legW/2, 0, legW, legH);
  ctx.restore();

  // --- LEFT LEG ---
  ctx.save();
  ctx.translate(legW/2, feetY - legH);
  ctx.rotate(-legSwing);
  // Left leg front: skin(20,52, 4,12)
  drawPart(20, 52, 4, 12, -legW/2, 0, legW, legH);
  ctx.restore();

  // --- BODY ---
  // Body front: skin(20,20, 8,12)
  drawPart(20, 20, 8, 12, -bodyW/2, bodyTopY, bodyW, bodyH);

  // --- RIGHT ARM ---
  ctx.save();
  ctx.translate(-bodyW/2 - armW/2, bodyTopY);
  ctx.rotate(armSwing);
  // Right arm front: skin(44,20, 4,12)
  drawPart(44, 20, 4, 12, -armW/2, 0, armW, armH);
  ctx.restore();

  // --- LEFT ARM ---
  ctx.save();
  ctx.translate(bodyW/2 + armW/2, bodyTopY);
  ctx.rotate(-armSwing);
  // Left arm front: skin(36,52, 4,12)
  drawPart(36, 52, 4, 12, -armW/2, 0, armW, armH);
  ctx.restore();

  // --- HEAD ---
  // Head front: skin(8,8, 8,8)
  drawPart(8, 8, 8, 8, -headW/2, headTopY, headW, headH);

  // --- HEAD OVERLAY (hat layer) --- skin(40,8, 8,8)
  if (skinHasHat) {
    drawPart(40, 8, 8, 8, -headW/2 - 1, headTopY - 1, headW + 2, headH + 2);
  }

  ctx.imageSmoothingEnabled = true;
  ctx.restore();
}

// ============================================================
// RENDERING: HUD
// ============================================================
function drawHUD() {
  ctx.save();

  // Beat flash overlay
  if (beatFlash > 0) {
    ctx.fillStyle = `rgba(30,80,200,${beatFlash * 0.08})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Combo (top center, larger with pop animation) ----
  if (combo > 0) {
    const comboSize = Math.min(85, 60 + combo * 0.25);
    const popScale = 1 + comboPopTimer / 0.15 * 0.30; // 1.0→1.30 on hit, decays back

    ctx.save();
    ctx.translate(VX, 56);
    ctx.scale(popScale, popScale);

    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${comboSize}px 'Impact', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(combo, 0, 0);

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,180,0.85)';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText('COMBO', 0, comboSize / 2 + 16);

    ctx.restore();
  }

  // ---- Score (top right) ----
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#00ccff';
  ctx.fillStyle = '#00ddff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(String(getDisplayScore()), W - 25, 18);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = 'rgba(100,200,255,0.7)';
  ctx.fillText('SCORE', W - 25, 44);

  // ---- Accuracy gauge (top-right circle) ----
  drawAccuracyGauge(W - 70, 110, 35);

  // ---- Judgment stats (bottom-left) ----
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#00ddff';
  ctx.fillText('\u5224\u5B9A ' + accuracy.toFixed(1) + '%', 18, H - 130);

  const stats = [
    ['PERFECT', judgeCounts.PERFECT, JUDGE_COLORS.PERFECT],
    ['GREAT',   judgeCounts.GREAT,   JUDGE_COLORS.GREAT],
    ['NICE',    judgeCounts.NICE,    JUDGE_COLORS.NICE],
    ['BAD',     judgeCounts.BAD,     JUDGE_COLORS.BAD],
    ['MISS',    judgeCounts.MISS,    JUDGE_COLORS.MISS],
  ];
  ctx.font = '12px sans-serif';
  stats.forEach(function(entry, idx) {
    ctx.fillStyle = entry[2];
    ctx.globalAlpha = 0.85;
    ctx.fillText(entry[0], 18, H - 108 + idx * 18);
    ctx.fillText(String(entry[1]), 85, H - 108 + idx * 18);
  });
  ctx.globalAlpha = 1;

  // ---- Controls hint (bottom corners) ----
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(100,200,255,0.4)';
  ctx.font = '11px sans-serif';
  ctx.fillText('BPM ' + BPM + ' — ' + SONGS[selectedSong].name, 18, H - 16);

  // ---- Progress bar (bottom of screen) ----
  const now = musicTime();
  const prog = Math.min(1, now / SONG_DURATION);

  // Background track
  ctx.fillStyle = 'rgba(30,30,60,0.7)';
  ctx.fillRect(20, H - 18, W - 40, 10);

  // Fill
  const progGrad = ctx.createLinearGradient(20, 0, W - 40, 0);
  progGrad.addColorStop(0, '#0088ff');
  progGrad.addColorStop(0.5, '#00ccff');
  progGrad.addColorStop(1, '#44ffcc');
  ctx.fillStyle = progGrad;
  ctx.fillRect(20, H - 18, (W - 40) * prog, 10);

  // Border
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, H - 18, W - 40, 10);

  // Progress marker dot
  const markerX = 20 + (W - 40) * prog;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#00ccff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(markerX, H - 13, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Percentage text
  ctx.fillStyle = 'rgba(200,230,255,0.7)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(Math.floor(prog * 100) + '%', W - 22, H - 6);

  // ---- Key indicators at bottom ----
  drawKeyIndicators();

  ctx.restore();
}

function drawKeyIndicators() {
  const indicators = [
    { key: 'ArrowLeft',  label: '←', x: VX - 120, color: '#ff6622' },
    { key: 'ArrowDown',  label: '↓', x: VX - 40,  color: '#00ccff' },
    { key: 'ArrowUp',    label: '↑', x: VX + 40,  color: '#44ff44' },
    { key: 'ArrowRight', label: '→', x: VX + 120, color: '#ff6622' },
  ];
  const y = H - 50;
  const size = 20;

  ctx.save();
  for (const ind of indicators) {
    const flash = keyFlash[ind.key] || 0;
    const alpha = 0.3 + flash * 0.7;

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = ind.color;
    ctx.shadowColor = ind.color;
    ctx.shadowBlur = flash * 15;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(ind.x - size, y - size, size * 2, size * 2, 5);
    ctx.stroke();

    if (flash > 0.1) {
      ctx.fillStyle = ind.color;
      ctx.globalAlpha = flash * 0.25;
      ctx.fill();
    }

    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ind.label, ind.x, y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawAccuracyGauge(cx, cy, r) {
  ctx.save();
  const startAngle = -Math.PI * 0.75;
  const endAngle = Math.PI * 0.75;
  const totalArc = endAngle - startAngle;

  ctx.strokeStyle = 'rgba(40,50,80,0.6)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, endAngle);
  ctx.stroke();

  const frac = accuracy / 100;
  const col = frac > 0.9 ? '#44ff88' : frac > 0.7 ? '#ffcc00' : '#ff4444';
  ctx.strokeStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 8;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, startAngle + totalArc * frac);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(accuracy.toFixed(1) + '%', cx, cy);

  ctx.font = '9px sans-serif';
  ctx.fillStyle = 'rgba(180,200,255,0.6)';
  ctx.fillText('精度', cx, cy + 15);

  ctx.restore();
}

// ============================================================
// RENDERING: Judgment Popup
// ============================================================
function drawJudgePopup() {
  if (judgeTimer <= 0 || !lastJudge) return;

  ctx.save();
  const t = judgeTimer / 0.5;
  const scale = 1 + (1 - t) * 0.3;
  const alpha = Math.min(1, t * 2);

  ctx.translate(120, H - 160);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  ctx.shadowColor = JUDGE_COLORS[lastJudge];
  ctx.shadowBlur = 20;
  ctx.fillStyle = JUDGE_COLORS[lastJudge];
  ctx.font = "bold 34px 'Impact', sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(lastJudge, 0, 0);

  ctx.restore();
}

// ============================================================
// RENDERING: READY/GO Animation
// ============================================================
function drawReadyGo() {
  if (gameState !== 'READY_GO') return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const elapsed = READY_GO_DUR - readyGoTimer;

  if (elapsed < 1.5) {
    // READY phase
    const t = elapsed / 1.5;
    const scale = 1.0 + Math.sin(t * Math.PI) * 0.15;
    const alpha = t < 0.2 ? t / 0.2 : (t > 0.85 ? (1 - t) / 0.15 : 1.0);

    ctx.translate(VX, H / 2 - 40);
    ctx.scale(scale, scale);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#00ddff';
    ctx.font = "bold 90px 'Impact', sans-serif";
    ctx.fillText('READY', 0, 0);
  } else {
    // GO phase
    const t = (elapsed - 1.5) / 1.0;
    const scale = 1.2 + t * 0.8;
    const alpha = t < 0.3 ? t / 0.3 : Math.max(0, 1 - (t - 0.3) * 1.5);

    ctx.translate(VX, H / 2 - 40);
    ctx.scale(scale, scale);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 40;
    ctx.fillStyle = '#ffee00';
    ctx.font = "bold 120px 'Impact', sans-serif";
    ctx.fillText('GO!', 0, 0);
  }

  ctx.restore();
}

// ============================================================
// RENDERING: Goal Line
// ============================================================
function drawGoalLine() {
  if (goalLineZ < 0 || goalLineZ > 1.5) return;

  const z = Math.min(1.0, goalLineZ);
  const s = zToScreen(z);
  const y = s.y;
  const lx = roadEdgeX(z, -1);
  const rx = roadEdgeX(z, 1);

  ctx.save();
  const alpha = Math.min(1, z * 2);
  ctx.globalAlpha = alpha;

  // Checkered finish line
  const lineH = 12 * Math.max(0.3, s.t);
  const numChecks = 16;
  const checkW = (rx - lx) / numChecks;
  for (let i = 0; i < numChecks; i++) {
    ctx.fillStyle = (i % 2 === 0) ? '#fff' : '#111';
    ctx.fillRect(lx + i * checkW, y - lineH, checkW, lineH);
  }
  // Second row offset
  for (let i = 0; i < numChecks; i++) {
    ctx.fillStyle = (i % 2 === 1) ? '#fff' : '#111';
    ctx.fillRect(lx + i * checkW, y, checkW, lineH);
  }

  // "GOAL" text above
  if (z > 0.3) {
    const textScale = Math.max(0.5, s.t);
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffee00';
    ctx.font = `bold ${Math.round(36 * textScale)}px 'Impact', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('GOAL', VX, y - lineH - 5 * textScale);
  }

  ctx.restore();
}

function drawResultScreen() {
  const t = performance.now() / 1000;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = 'rgba(0,0,10,0.75)';
  ctx.fillRect(0, 0, W, H);

  // Grade
  var grade;
  if (accuracy >= 95)      grade = 'S';
  else if (accuracy >= 90) grade = 'A';
  else if (accuracy >= 80) grade = 'B';
  else if (accuracy >= 70) grade = 'C';
  else if (accuracy >= 60) grade = 'D';
  else                     grade = 'F';

  const gradeColors = {
    S: '#00ffff', A: '#44ff44', B: '#88cc00',
    C: '#ffcc00', D: '#ff8800', F: '#ff2244'
  };

  const pulse = 0.8 + 0.2 * Math.sin(t * 3);
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 20 * pulse;
  ctx.fillStyle = 'rgba(0,255,200,' + pulse + ')';
  ctx.font = "bold 50px 'Impact', sans-serif";
  ctx.fillText('ステージクリア！', VX, 80);

  ctx.shadowColor = gradeColors[grade];
  ctx.shadowBlur = 40;
  ctx.fillStyle = gradeColors[grade];
  ctx.font = "bold 120px 'Impact', sans-serif";
  ctx.fillText(grade, VX, 200);

  ctx.shadowBlur = 0;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#00ddff';
  ctx.fillText('スコア: ' + getDisplayScore(), VX, 300);

  ctx.fillStyle = '#ffee44';
  ctx.font = '20px sans-serif';
  ctx.fillText('最大コンボ: ' + maxCombo, VX, 335);

  ctx.fillStyle = '#fff';
  ctx.fillText('精度: ' + accuracy.toFixed(2) + '%', VX, 365);

  // ALL PERFECT display — luxurious golden rainbow effect
  if (isAllPerfect()) {
    const apPulse = 0.7 + 0.3 * Math.sin(t * 4);
    const rainbowHue = (t * 60) % 360;
    ctx.save();
    // Outer glow
    ctx.shadowColor = `hsl(${rainbowHue}, 100%, 70%)`;
    ctx.shadowBlur = 50 * apPulse;
    ctx.font = "bold 52px 'Impact', sans-serif";
    // Rainbow gradient text
    const apGrad = ctx.createLinearGradient(VX - 200, 0, VX + 200, 0);
    apGrad.addColorStop(0, `hsl(${rainbowHue}, 100%, 70%)`);
    apGrad.addColorStop(0.25, `hsl(${(rainbowHue + 60) % 360}, 100%, 70%)`);
    apGrad.addColorStop(0.5, `hsl(${(rainbowHue + 120) % 360}, 100%, 70%)`);
    apGrad.addColorStop(0.75, `hsl(${(rainbowHue + 180) % 360}, 100%, 70%)`);
    apGrad.addColorStop(1, `hsl(${(rainbowHue + 240) % 360}, 100%, 70%)`);
    ctx.fillStyle = apGrad;
    ctx.fillText('✨ ALL PERFECT ✨', VX, 265);
    // Second line with sparkle
    ctx.font = "bold 28px 'Impact', sans-serif";
    ctx.shadowBlur = 30 * apPulse;
    ctx.fillStyle = `rgba(255,215,0,${apPulse})`;
    ctx.fillText('🏆 1,000,000 pts 🏆', VX, 258 + 42);
    ctx.restore();
  }
  // Full Combo display (NICE or better, not All Perfect)
  else if (isFullCombo()) {
    const acPulse = 0.7 + 0.3 * Math.sin(t * 5);
    ctx.save();
    ctx.shadowColor = '#ff44ff';
    ctx.shadowBlur = 30 * acPulse;
    ctx.fillStyle = `rgba(255,100,255,${acPulse})`;
    ctx.font = "bold 44px 'Impact', sans-serif";
    ctx.fillText('✨ フルコンボ ✨', VX, 270);
    ctx.restore();
  }

  // Judgment breakdown
  const resultStats = [
    ['PERFECT', judgeCounts.PERFECT, JUDGE_COLORS.PERFECT],
    ['GREAT',   judgeCounts.GREAT,   JUDGE_COLORS.GREAT],
    ['NICE',    judgeCounts.NICE,    JUDGE_COLORS.NICE],
    ['BAD',     judgeCounts.BAD,     JUDGE_COLORS.BAD],
    ['MISS',    judgeCounts.MISS,    JUDGE_COLORS.MISS],
  ];
  ctx.font = '16px sans-serif';
  const statsY = 410;
  const total = obstacles.length;
  resultStats.forEach(function(entry, idx) {
    const x = VX - 200 + idx * 100;
    ctx.fillStyle = entry[2];
    ctx.fillText(entry[0], x, statsY);
    ctx.fillStyle = '#fff';
    ctx.fillText(String(entry[1]), x, statsY + 22);
    const barW = 60;
    const barH = 4;
    const frac = total > 0 ? entry[1] / total : 0;
    ctx.fillStyle = 'rgba(40,40,80,0.6)';
    ctx.fillRect(x - barW / 2, statsY + 32, barW, barH);
    ctx.fillStyle = entry[2];
    ctx.fillRect(x - barW / 2, statsY + 32, barW * frac, barH);
  });

  const rp = 0.5 + 0.5 * Math.sin(t * 3.5);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 10 * rp;
  ctx.fillStyle = 'rgba(255,238,0,' + rp + ')';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('R または スペースでリスタート', VX, H - 60);

  ctx.restore();
}

    ctx.stroke();
    ctx.fillStyle = 'rgba(255,136,204,0.15)';

    ctx.setLineDash([]);

function drawSongSelectScreen() {
  const t = performance.now() / 1000;
  const pulse = 0.7 + 0.3 * Math.sin(t * 3);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Title
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 30 * pulse;
  ctx.font = "bold 80px 'Impact', sans-serif";
  ctx.fillStyle = `rgba(0,255,200,${pulse})`;
  ctx.fillText('RRBe', VX, 80);

  ctx.shadowColor = '#8844ff';
  ctx.shadowBlur = 15;
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#cc88ff';
  ctx.fillText('RACE & RHYTHM BEAT', VX, 130);

  // Select label
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('曲を選んでください', VX, 200);

  // Song cards
  for (let i = 0; i < SONGS.length; i++) {
    const song = SONGS[i];
    const isSelected = i === songSelectIndex;
    const cardSpacing = SONGS.length <= 3 ? 180 : 150;
    const totalW = (SONGS.length - 1) * cardSpacing;
    const cardX = VX - totalW / 2 + i * cardSpacing;
    const cardY = 340;
    const cardW = SONGS.length <= 3 ? 150 : 130;
    const cardH = 180;

    // Card background
    ctx.save();
    if (isSelected) {
      const sp = 0.6 + 0.4 * Math.sin(t * 4);
      ctx.shadowColor = song.color;
      ctx.shadowBlur = 20 * sp;
      ctx.strokeStyle = song.color;
      ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(20,20,60,0.9)';
    } else {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(100,100,150,0.5)';
      ctx.lineWidth = 1;
      ctx.fillStyle = 'rgba(10,10,30,0.7)';
    }

    ctx.beginPath();
    ctx.roundRect(cardX - cardW / 2, cardY - cardH / 2, cardW, cardH, 10);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // BPM number (big)
    ctx.save();
    ctx.fillStyle = isSelected ? song.color : 'rgba(150,150,200,0.6)';
    ctx.font = "bold 48px 'Impact', sans-serif";
    ctx.shadowColor = isSelected ? song.color : 'transparent';
    ctx.shadowBlur = isSelected ? 10 : 0;
    ctx.fillText(String(song.bpm), cardX, cardY - 30);
    ctx.restore();

    // BPM label
    ctx.fillStyle = isSelected ? '#fff' : 'rgba(150,150,200,0.5)';
    ctx.font = '14px sans-serif';
    ctx.fillText('BPM', cardX, cardY + 10);

    // Song name
    ctx.fillStyle = isSelected ? '#fff' : 'rgba(150,150,200,0.5)';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(song.name, cardX, cardY + 40);

    // Difficulty description
    ctx.fillStyle = isSelected ? song.color : 'rgba(150,150,200,0.4)';
    ctx.font = '12px sans-serif';
    ctx.fillText(song.desc, cardX, cardY + 60);
  }

  // Navigation hint
  ctx.fillStyle = 'rgba(150,220,255,0.6)';
  ctx.font = '14px sans-serif';
  ctx.fillText('← → で選択、スペースで決定', VX, 490);

  // Difficulty selector for custom songs
  if (songSelectIndex >= 4 && customAudioBuffer) {
    const diffY = 516;
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 16px sans-serif';
    const diffLabel = customDifficulty === 'EXPERT' ? '💀 エキスパート（24分音符）' : customDifficulty === 'HARD' ? '🔥 ハード（16分音符）' : '🎵 ノーマル';
    ctx.fillText('難易度: ' + diffLabel, VX, diffY);
    ctx.fillStyle = 'rgba(0,255,136,0.5)';
    ctx.font = '12px sans-serif';
    ctx.fillText('Dキーで難易度変更', VX, diffY + 18);
  }

  // Controls reminder
  ctx.shadowBlur = 0;
  ctx.font = '13px sans-serif';
  ctx.fillStyle = 'rgba(150,220,255,0.65)';
  const lines = [
    '🚧 右パイロン → ← を押す    🚧 左パイロン → → を押す',
    '🌉 アーチ → ↓ を押す            🧱 ブロック → ↑ を押す',
    '⭐ 右スター → → を押す     ⭐ 左スター → ← を押す',
  ];
  lines.forEach(function(l, idx) { ctx.fillText(l, VX, 560 + idx * 22); });

   // Press space
  const sp = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 12 * sp;
  ctx.fillStyle = `rgba(255,238,0,${sp})`;
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('スペースキーでスタート', VX, H - 60);

  // Settings link
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(200,180,255,0.6)';
  ctx.font = '14px sans-serif';
  ctx.fillText('⚙ Sキーで設定（音量・アバター）', VX, H - 38);

  // MP3 drop zone indicator
  ctx.shadowBlur = 0;
  if (mp3DropZoneHover) {
    ctx.save();
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 6]);
    ctx.beginPath();
    ctx.roundRect(VX - 200, 150, 400, 300, 15);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,255,136,0.15)';
    ctx.fill();
    ctx.setLineDash([]);
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText('🎵 MP3をここにドロップ！', VX, 310);
    ctx.restore();
  } else {
    ctx.fillStyle = 'rgba(0,255,136,0.4)';
    ctx.font = '12px sans-serif';
    ctx.fillText('🎵 MP3ファイルをドラッグ＆ドロップで追加', VX, 636);
  }

  // MP3 loading message
  if (mp3LoadingMsg) {
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(mp3LoadingMsg, VX, 670);
  }

  ctx.restore();
}

// ============================================================
// MAIN DRAW
// ============================================================
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg();

  if (gameState === 'SETTINGS') {
    drawTrack();
    drawCharacter();
    drawSettingsScreen();
    return;
  }

  if (gameState === 'SONG_SELECT') {
    drawTrack();
    drawCharacter();
    drawSongSelectScreen();
    return;
  }

  if (gameState === 'START') {
    drawTrack();
    drawJudgeZone();
    drawCharacter();
    drawStartScreen();
    return;
  }

  if (gameState === 'READY_GO') {
    drawTrack();
    drawObstacles();
    drawJudgeZone();
    drawCharacter();
    drawReadyGo();
    return;
  }

  drawTrack();
  drawGoalLine();
  drawObstacles();
  drawJudgeZone();
  drawRhythmBalls();
  drawCharacter();
  drawPart();
  drawHUD();
  drawJudgePopup();

  if (gameState === 'RESULT') drawResultScreen();
}

// ============================================================
// GAME LIFECYCLE
// ============================================================
function resetGame() {
  gameState = 'READY_GO';
  readyGoTimer = READY_GO_DUR;
  goalLineZ = -1;
  goalReached = false;
  celebrationTimer = 0;

  // Use beat-detected chart for custom MP3, normal generator otherwise
  if (isCustomSong && customSongBeats) {
    obstacles = generateChartFromBeats(customSongBeats, BPM, SONG_DURATION, customDifficulty);
  } else {
    obstacles = generateChart();
  }

  score = 0; combo = 0; maxCombo = 0; comboPopTimer = 0;
  judgeCounts = { PERFECT: 0, GREAT: 0, NICE: 0, BAD: 0, MISS: 0 };
  accuracy = 100;
  lastJudge = null; judgeTimer = 0;
  beatFlash = 0;
  particles = [];
  rhythmBallFlashes = [];
  roadScroll = 0; charPhase = 0;
  charAction = 'RUN'; charActionTimer = 0; charJumpY = 0;
  keyFlash = { ArrowLeft: 0, ArrowRight: 0, ArrowDown: 0, ArrowUp: 0 };

  if (audioCtx) {
    stepCount = 0; beatCount = 0; melodyPos = 0;
    gameStartTime = -1; // will be set when READY_GO finishes
    nextStepTime = 0;
  }

  // Custom audio will be started when READY_GO finishes (transition to PLAYING)
}

function selectSong(idx) {
  selectedSong = idx;
  const song = SONGS[idx];
  BPM = song.bpm;
  BEAT_S = 60 / BPM;
  STEP_S = BEAT_S / 4;
  SONG_BARS = song.bars;
  SONG_DURATION = SONG_BARS * 4 * BEAT_S;
  isCustomSong = (idx >= 4 && customAudioBuffer !== null);
  if (!isCustomSong) {
    curSongData = SONG_DATA[idx];
  } else {
    // For custom songs, use actual audio duration
    SONG_DURATION = customAudioBuffer.duration;
    curSongData = SONG_DATA[0]; // placeholder (synth won't play)
  }
  gameState = 'START';
}

function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  resetGame();
}

function resetToStart() {
  stopCustomAudio();
  gameState = 'SONG_SELECT';
}

// ============================================================
// GAME LOOP
// ============================================================
lastTime = performance.now();

function gameLoop(ts) {
  dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  update(dt);
  draw();

  for (const k in justPressed) delete justPressed[k];
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
