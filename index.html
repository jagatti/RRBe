<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RRBe – Race &amp; Rhythm Beat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const W = 960, H = 640;

// Song definitions — 3 songs at different BPMs
const SONGS = [
  { name: 'City Pop Groove', bpm: 130, bars: 48, color: '#44ccff', desc: 'BPM 130 — Easy' },
  { name: 'Neon Rush',       bpm: 150, bars: 48, color: '#ffcc00', desc: 'BPM 150 — Normal' },
  { name: 'Hyper Drive',     bpm: 180, bars: 48, color: '#ff4488', desc: 'BPM 180 — Hard' },
];
let selectedSong = 0;

// These are recalculated when a song is selected
let BPM = 150;
let BEAT_S = 60 / BPM;
let STEP_S = BEAT_S / 4;
let SONG_BARS = 48;
let SONG_DURATION = SONG_BARS * 4 * BEAT_S;

// Perspective — lowered camera (higher VY) so road looks more head-on
const VX = W / 2;           // vanishing point X
const VY = 180;              // vanishing point Y (lowered camera)
const ROAD_BOTTOM = 560;     // road bottom edge (near player)
const ROAD_HW = 360;         // half-width of road at bottom
const PERSP_POW = 1.5;

// Obstacle scroll
const OBS_SCROLL_TIME = 1.8; // seconds from spawn to judgment line (wider spacing)

// Timing windows (seconds)
const T_PERFECT = 0.045;
const T_GREAT   = 0.090;
const T_GOOD    = 0.140;
const T_BAD     = 0.195;
const T_MISS    = 0.240;

// Obstacle types and corresponding correct keys
// PYLON_R: pylon on right side -> press LEFT to dodge left
// PYLON_L: pylon on left side  -> press RIGHT to dodge right
// ARCH:    overhead arch        -> press DOWN to duck
// BLOCK:   ground block         -> press UP to jump
// STAR_R:  star on right side   -> press RIGHT to collect (opposite of pylon)
// STAR_L:  star on left side    -> press LEFT to collect (opposite of pylon)
const OBS_TYPES = ['PYLON_R', 'PYLON_L', 'ARCH', 'BLOCK', 'STAR_R', 'STAR_L'];
const OBS_KEYS  = {
  PYLON_R: 'ArrowLeft',
  PYLON_L: 'ArrowRight',
  ARCH:    'ArrowDown',
  BLOCK:   'ArrowUp',
  STAR_R:  'ArrowRight',
  STAR_L:  'ArrowLeft'
};
const OBS_COLORS = {
  PYLON_R: '#ff6622',
  PYLON_L: '#ff6622',
  ARCH:    '#00ccff',
  BLOCK:   '#44ff44',
  STAR_R:  '#ffdd00',
  STAR_L:  '#ffdd00'
};
const OBS_LABELS = {
  PYLON_R: '← DODGE',
  PYLON_L: 'DODGE →',
  ARCH:    '↓ DUCK',
  BLOCK:   '↑ JUMP',
  STAR_R:  '→ GET',
  STAR_L:  '← GET'
};

// Judgment
const JUDGE_COLORS = {
  PERFECT: '#00ffff', GREAT: '#44ff44',
  GOOD: '#ffff00', BAD: '#ff8800', MISS: '#ff2244'
};
const JUDGE_SCORE = { PERFECT: 100, GREAT: 80, GOOD: 50, BAD: 20, MISS: 0 };

// Character action durations
const ACTION_DUR = 0.35;

// Audio — energetic track (BPM set by song selection)
// Minor key bass line for more drive
const BASS_NOTES = [82.4, 82.4, 110, 98, 73.4, 73.4, 98, 110, 82.4, 65.4, 73.4, 98, 110, 82.4, 65.4, 73.4];
// Mixolydian / minor penta scale for melody
const PENTA = [329.63, 369.99, 392, 440, 493.88, 523.25, 587.33, 659.25, 739.99, 783.99];
const MELODY = [
  0, -1, 4,  2,  7, -1, 5,  3,
  1, -1, 6,  4,  9,  7, 5,  3,
  2, -1, 4,  7,  9, -1, 6,  4,
  5,  3, 1,  0,  2, -1, 4,  7
];

const KICK_STEPS   = new Set([0, 4, 8, 12]);
const SNARE_STEPS  = new Set([4, 12]);
const OHIHAT_STEPS = new Set([2, 6, 10, 14]);
const BASS_STEPS   = new Set([0, 2, 4, 6, 8, 10, 12, 14]);
const SYNTH_STEPS  = new Set([0, 2, 4, 8, 10, 12]);

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx = null, masterGain = null;
let nextStepTime = 0, stepCount = 0, beatCount = 0;
let melodyPos = 0;
let audioStarted = false;
let gameStartTime = 0;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.40;
    masterGain.connect(audioCtx.destination);
  }
  nextStepTime = audioCtx.currentTime + 0.1;
  stepCount = 0; beatCount = 0; melodyPos = 0;
  audioStarted = true;
}

function playKick(time) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sine';
  o.frequency.setValueAtTime(180, time);
  o.frequency.exponentialRampToValueAtTime(40, time + 0.08);
  g.gain.setValueAtTime(1.0, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  o.start(time); o.stop(time + 0.3);
}

function playSnare(time) {
  const len = Math.floor(audioCtx.sampleRate * 0.12);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200;
  const g = audioCtx.createGain();
  n.connect(f); f.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0.7, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  n.start(time); n.stop(time + 0.15);
}

function playHihat(time, open) {
  const len = Math.floor(audioCtx.sampleRate * 0.06);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  const g = audioCtx.createGain();
  n.connect(f); f.connect(g); g.connect(masterGain);
  const dur = open ? 0.12 : 0.04;
  g.gain.setValueAtTime(0.25, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  n.start(time); n.stop(time + dur);
}

function playBass(time, freq, dur) {
  dur = dur || 0.22;
  const o = audioCtx.createOscillator();
  const f = audioCtx.createBiquadFilter();
  const g = audioCtx.createGain();
  o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 400;
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0.5, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o.start(time); o.stop(time + dur);
}

function playSynth(time, freq, dur) {
  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o1.type = 'square'; o2.type = 'square';
  o1.frequency.setValueAtTime(freq, time);
  o2.frequency.setValueAtTime(freq * 1.006, time);
  o1.connect(g); o2.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0.12, time);
  g.gain.setValueAtTime(0.12, time + dur * 0.75);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o1.start(time); o2.start(time);
  o1.stop(time + dur); o2.stop(time + dur);
}

// SFX
function sfxPerfect(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sine'; o.frequency.setValueAtTime(880, t);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.start(t); o.stop(t + 0.12);
  const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
  o2.connect(g2); g2.connect(masterGain);
  o2.type = 'sine'; o2.frequency.setValueAtTime(1320, t + 0.05);
  g2.gain.setValueAtTime(0.2, t + 0.05);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o2.start(t + 0.05); o2.stop(t + 0.15);
}

function sfxGreat(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sine'; o.frequency.setValueAtTime(660, t);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
  o.start(t); o.stop(t + 0.10);
}

function sfxMiss(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.15);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.start(t); o.stop(t + 0.15);
}

// Audio scheduler
function scheduleAudio() {
  if (!audioCtx || (gameState !== 'PLAYING' && gameState !== 'READY_GO')) return;
  while (nextStepTime < audioCtx.currentTime + 0.1) {
    const step = stepCount % 16;
    const t = nextStepTime;
    if (KICK_STEPS.has(step))  playKick(t);
    if (SNARE_STEPS.has(step)) playSnare(t);
    if (OHIHAT_STEPS.has(step)) playHihat(t, true);
    else playHihat(t, false);
    if (BASS_STEPS.has(step)) {
      playBass(t, BASS_NOTES[Math.floor(stepCount / 2) % BASS_NOTES.length]);
    }
    if (SYNTH_STEPS.has(step)) {
      const ni = MELODY[melodyPos % MELODY.length];
      if (ni >= 0) playSynth(t, PENTA[ni % PENTA.length], BEAT_S * 0.85);
      melodyPos++;
    }
    if (step === 0) { beatCount++; beatFlash = 1.0; }
    stepCount++;
    nextStepTime += STEP_S;
  }
}

// ============================================================
// OBSTACLE CHART GENERATOR
// ============================================================
function generateChart() {
  const obstacles = [];
  const bt = BEAT_S;

  // Patterns: arrays of [beatOffset, obsTypeIndex] per bar
  // obsTypeIndex: 0=PYLON_R(←), 1=PYLON_L(→), 2=ARCH(↓), 3=BLOCK(↑), 4=STAR_R(→), 5=STAR_L(←)
  const easy = [
    [[0, 3], [2, 0]],
    [[0, 0], [2, 4]],
    [[0, 1], [2, 5]],
    [[0, 2], [2, 3]],
    [[0, 4], [2, 0]],
    [[0, 5], [2, 1]],
    [[0, 3], [1, 4], [2, 0]],
    [[0, 0], [1, 5], [2, 2]],
  ];

  const normal = [
    [[0, 3], [1, 0], [2, 4], [3, 2]],
    [[0, 1], [1, 3], [2, 5], [3, 0]],
    [[0, 2], [1, 4], [2, 1], [3, 3]],
    [[0, 5], [1, 2], [2, 0], [3, 4]],
    [[0, 3], [1, 5], [2, 0], [3, 1]],
    [[0, 0], [1, 2], [2, 4], [3, 3]],
    [[0, 4], [1, 1], [2, 3], [3, 5]],
    [[0, 1], [1, 3], [2, 5], [3, 0]],
    [[0, 3], [1, 4], [2, 2], [3, 1]],
    [[0, 0], [1, 5], [2, 3], [3, 4]],
  ];

  const hard = [
    [[0, 3], [1, 0], [2, 4], [3, 2]],
    [[0, 0], [1, 1], [2, 5], [3, 3]],
    [[0, 2], [1, 4], [2, 1], [3, 0]],
    [[0, 5], [1, 2], [2, 3], [3, 4]],
    [[0, 3], [1, 5], [2, 0], [3, 1]],
    [[0, 0], [1, 4], [2, 3], [3, 5]],
    [[0, 4], [1, 1], [2, 2], [3, 0]],
    [[0, 1], [1, 3], [2, 5], [3, 4]],
  ];

  const expert = [
    [[0, 3], [0.5, 2], [1, 0], [1.5, 4], [2, 5], [2.5, 1], [3, 3], [3.5, 2]],
    [[0, 0], [0.5, 1], [1, 5], [1.5, 2], [2, 4], [2.5, 0], [3, 3], [3.5, 1]],
    [[0, 2], [0.5, 4], [1, 1], [1.5, 0], [2, 3], [2.5, 5], [3, 0], [3.5, 2]],
    [[0, 5], [0.5, 0], [1, 3], [1.5, 1], [2, 2], [2.5, 4], [3, 1], [3.5, 3]],
  ];

  for (let bar = 0; bar < SONG_BARS; bar++) {
    let pats, pi;
    if (bar < 2) continue; // intro
    else if (bar < 10) { pats = easy;   pi = (bar - 2) % easy.length; }
    else if (bar < 22) { pats = normal; pi = (bar - 10) % normal.length; }
    else if (bar < 38) { pats = hard;   pi = (bar - 22) % hard.length; }
    else               { pats = expert; pi = (bar - 38) % expert.length; }

    for (const [bOff, typeIdx] of pats[pi]) {
      obstacles.push({
        time: (bar * 4 + bOff) * bt,
        type: OBS_TYPES[typeIdx],
        judged: false,
        judgment: null,
        hitTime: 0
      });
    }
  }

  obstacles.sort((a, b) => a.time - b.time);
  return obstacles;
}

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'SONG_SELECT';
let songSelectIndex = 0;
let obstacles = [];
let score = 0, combo = 0, maxCombo = 0;
let judgeCounts = { PERFECT: 0, GREAT: 0, GOOD: 0, BAD: 0, MISS: 0 };
let accuracy = 100;
let lastJudge = null, judgeTimer = 0;
let beatFlash = 0;
let dt = 0, lastTime = 0;
let particles = [];
let roadScroll = 0;
let charPhase = 0;

// READY/GO animation state
let readyGoTimer = 0;    // countdown timer for READY->GO
const READY_GO_DUR = 2.5; // total duration: READY 1.5s, GO 1.0s

// Goal line state
let goalLineZ = -1;  // z position of the goal line (-1 = not visible)

// Character action state
let charAction = 'RUN';   // RUN, DODGE_L, DODGE_R, DUCK, JUMP
let charActionTimer = 0;
let charJumpY = 0;        // vertical offset for jump

// Key flash state per direction
let keyFlash = { ArrowLeft: 0, ArrowRight: 0, ArrowDown: 0, ArrowUp: 0 };

// Rhythm ball flash state (for hit feedback)
let rhythmBallFlashes = [];  // { time, judgment, timer }
const RHYTHM_BALL_RADIUS = 8;
const RHYTHM_BALL_TRAVEL = 1.0; // time window (seconds) for ball visibility and travel to center

// ============================================================
// PERSPECTIVE MATH
// ============================================================
function zToScreen(wz) {
  const t = Math.pow(Math.max(0, wz), PERSP_POW);
  return {
    y: VY + (ROAD_BOTTOM - VY) * t,
    hw: ROAD_HW * t,
    t
  };
}

// ============================================================
// PARTICLES
// ============================================================
function spawnPart(x, y, color, count) {
  for (let i = 0; i < count && particles.length < 200; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 100,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

function updatePart(deltaT) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * deltaT;
    p.y += p.vy * deltaT;
    p.vy += 400 * deltaT;
    p.life -= deltaT;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawPart() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
// INPUT
// ============================================================
const keys = {};
const justPressed = {};

window.addEventListener('keydown', (e) => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }

  if (gameState === 'SONG_SELECT') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
      songSelectIndex = (songSelectIndex + SONGS.length - 1) % SONGS.length;
    } else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
      songSelectIndex = (songSelectIndex + 1) % SONGS.length;
    } else if (e.code === 'Space' || e.code === 'Enter') {
      selectSong(songSelectIndex);
    }
  } else if (gameState === 'START' && e.code === 'Space') {
    startGame();
  } else if (gameState === 'RESULT' && (e.code === 'KeyR' || e.code === 'Space')) {
    resetToStart();
  } else if (gameState === 'PLAYING') {
    if (justPressed[e.code] && ['ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.code)) {
      judgeKeyPress(e.code);
      keyFlash[e.code] = 1.0;
    }
  }
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ============================================================
// TIMING / JUDGMENT
// ============================================================
function musicTime() {
  if (!audioCtx) return 0;
  return audioCtx.currentTime - gameStartTime;
}

function judgeKeyPress(keyCode) {
  const now = musicTime();
  let best = null, bestDiff = Infinity;

  for (const o of obstacles) {
    if (o.judged) continue;
    // Only match obstacles whose correct key matches the pressed key
    if (OBS_KEYS[o.type] !== keyCode) continue;
    const diff = Math.abs(o.time - now);
    if (diff < bestDiff && diff < T_MISS) {
      bestDiff = diff;
      best = o;
    }
  }

  if (!best) return;

  best.judged = true;
  best.hitTime = now;

  let j;
  if (bestDiff <= T_PERFECT)    j = 'PERFECT';
  else if (bestDiff <= T_GREAT) j = 'GREAT';
  else if (bestDiff <= T_GOOD)  j = 'GOOD';
  else                          j = 'BAD';

  best.judgment = j;
  judgeCounts[j]++;

  if (j === 'BAD') {
    combo = 0;
  } else {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
  }

  const mult = Math.floor(combo / 10) + 1;
  score += JUDGE_SCORE[j] * mult;

  lastJudge = j;
  judgeTimer = 0.5;

  // Set character action
  if (keyCode === 'ArrowLeft')  { charAction = 'DODGE_L'; charActionTimer = ACTION_DUR; }
  if (keyCode === 'ArrowRight') { charAction = 'DODGE_R'; charActionTimer = ACTION_DUR; }
  if (keyCode === 'ArrowDown')  { charAction = 'DUCK';    charActionTimer = ACTION_DUR; }
  if (keyCode === 'ArrowUp')    { charAction = 'JUMP';    charActionTimer = ACTION_DUR; charJumpY = 0; }

  // FX
  spawnPart(VX, ROAD_BOTTOM, JUDGE_COLORS[j], j === 'PERFECT' ? 20 : j === 'GREAT' ? 14 : 8);
  addRhythmBallFlash(j);

  if (audioCtx) {
    const t = audioCtx.currentTime;
    if (j === 'PERFECT') sfxPerfect(t);
    else if (j === 'GREAT') sfxGreat(t);
  }

  updateAccuracy();
}

function processAutoMisses() {
  const now = musicTime();
  for (const o of obstacles) {
    if (o.judged) continue;
    if (now > o.time + T_MISS) {
      o.judged = true;
      o.judgment = 'MISS';
      judgeCounts.MISS++;
      combo = 0;
      lastJudge = 'MISS';
      judgeTimer = 0.35;
      if (audioCtx) sfxMiss(audioCtx.currentTime);
      addRhythmBallFlash('MISS');
      updateAccuracy();
    }
  }
}

function updateAccuracy() {
  const tot = judgeCounts.PERFECT + judgeCounts.GREAT + judgeCounts.GOOD + judgeCounts.BAD + judgeCounts.MISS;
  if (tot === 0) { accuracy = 100; return; }
  const s = judgeCounts.PERFECT * 100 + judgeCounts.GREAT * 80 + judgeCounts.GOOD * 50 + judgeCounts.BAD * 20;
  accuracy = s / (tot * 100) * 100;
}

// ============================================================
// UPDATE
// ============================================================
function update(deltaT) {
  if (gameState === 'READY_GO') {
    readyGoTimer -= deltaT;
    roadScroll = (roadScroll + deltaT * 3.0) % 1.0;
    charPhase += deltaT * 12;
    if (readyGoTimer <= 0) {
      gameState = 'PLAYING';
    }
    return;
  }

  if (gameState !== 'PLAYING') return;

  scheduleAudio();
  processAutoMisses();

  beatFlash = Math.max(0, beatFlash - deltaT * 4);
  judgeTimer = Math.max(0, judgeTimer - deltaT);
  for (const k in keyFlash) keyFlash[k] = Math.max(0, keyFlash[k] - deltaT * 5);

  // Character action timer
  if (charActionTimer > 0) {
    charActionTimer -= deltaT;
    if (charAction === 'JUMP') {
      const t = 1 - (charActionTimer / ACTION_DUR);
      charJumpY = Math.sin(t * Math.PI) * 55;
    }
    if (charActionTimer <= 0) {
      charAction = 'RUN';
      charActionTimer = 0;
      charJumpY = 0;
    }
  }

  updatePart(deltaT);

  roadScroll = (roadScroll + deltaT * 3.0) % 1.0;
  charPhase += deltaT * 12;

  const now = musicTime();

  // Goal line: start showing when near the end of the song
  const lastObsTime = obstacles.length > 0 ? obstacles[obstacles.length - 1].time : SONG_DURATION;
  const goalAppearTime = lastObsTime - OBS_SCROLL_TIME * 0.5;
  if (now >= goalAppearTime) {
    // goalLineZ goes from 0 (horizon) to 1 (judgment line)
    goalLineZ = Math.min(1.3, (now - goalAppearTime) / OBS_SCROLL_TIME);
  } else {
    goalLineZ = -1;
  }

  const allDone = obstacles.length > 0 && obstacles.every(o => o.judged);
  if (allDone && now > lastObsTime + 1.5) {
    gameState = 'RESULT';
  }
}

// ============================================================
// RENDERING: Background
// ============================================================
function pseudoRand(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, VY + 40);
  g.addColorStop(0, '#05000d');
  g.addColorStop(0.6, '#0a0020');
  g.addColorStop(1, '#001020');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.save();
  for (let i = 0; i < 100; i++) {
    const sx = pseudoRand(i * 3 + 42) * W;
    const sy = pseudoRand(i * 3 + 43) * (VY - 10);
    const sr = pseudoRand(i * 3 + 44) * 1.2 + 0.3;
    ctx.globalAlpha = 0.3 + pseudoRand(i + 99) * 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Ground
  const gg = ctx.createLinearGradient(0, VY, 0, H);
  gg.addColorStop(0, '#030308');
  gg.addColorStop(1, '#020206');
  ctx.fillStyle = gg;
  ctx.fillRect(0, VY, W, H - VY);

  // Horizon glow (subtle, no blue lines)
  const hg = ctx.createRadialGradient(VX, VY, 0, VX, VY, 200);
  hg.addColorStop(0, 'rgba(60,120,200,0.15)');
  hg.addColorStop(0.5, 'rgba(30,60,120,0.06)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, VY - 40, W, 120);
}

// ============================================================
// RENDERING: Track (curved road, sphere-surface style like R2BEAT)
// ============================================================

// Curved road edge X at a given z (0=horizon, 1=near).
// Uses a power curve so edges bulge outward, giving a "running on a sphere" look.
const ROAD_CURVE_POW = 0.55; // <1 = convex outward bulge
function roadEdgeX(z, side) {
  // side: -1 for left, +1 for right
  const s = zToScreen(z);
  // Apply convex curve: edges spread out faster than linear
  const curve = Math.pow(Math.max(0, z), ROAD_CURVE_POW);
  const hw = ROAD_HW * curve;
  return VX + side * hw;
}

function drawTrack() {
  // Road surface — filled with curved edges
  const CURVE_STEPS = 40;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(VX, VY);
  // Right edge from horizon to bottom
  for (let i = 1; i <= CURVE_STEPS; i++) {
    const z = i / CURVE_STEPS;
    const s = zToScreen(z);
    ctx.lineTo(roadEdgeX(z, 1), s.y);
  }
  // Bottom right to bottom-left (below road)
  const sBottom = zToScreen(1.0);
  ctx.lineTo(roadEdgeX(1.0, 1), H);
  ctx.lineTo(roadEdgeX(1.0, -1), H);
  // Left edge from bottom back to horizon
  for (let i = CURVE_STEPS; i >= 0; i--) {
    const z = i / CURVE_STEPS;
    const s = zToScreen(z);
    ctx.lineTo(roadEdgeX(z, -1), s.y);
  }
  ctx.closePath();
  const rg = ctx.createLinearGradient(VX, VY, VX, H);
  rg.addColorStop(0, '#0a0a14');
  rg.addColorStop(1, '#0e0e1c');
  ctx.fillStyle = rg;
  ctx.fill();
  ctx.restore();

  // Scrolling horizontal road lines (curved arcs)
  const NUM_LINES = 22;
  ctx.save();
  for (let i = 0; i < NUM_LINES; i++) {
    const z = (i + roadScroll) / NUM_LINES;
    const s = zToScreen(z);
    if (s.t < 0.005) continue;
    const alpha = Math.min(1, s.t * 1.5) * 0.2;
    ctx.strokeStyle = `rgba(50,80,140,${alpha})`;
    ctx.lineWidth = 1;
    const lx = roadEdgeX(z, -1);
    const rx = roadEdgeX(z, 1);
    // Draw curved horizontal line (arc bowing downward for sphere feel)
    const arcSag = 8 * Math.pow(z, ROAD_CURVE_POW); // how much the arc bows down
    ctx.beginPath();
    ctx.moveTo(lx, s.y);
    ctx.quadraticCurveTo(VX, s.y + arcSag, rx, s.y);
    ctx.stroke();
  }
  ctx.restore();

  // Lane divider lines (6 lanes visible, curved paths)
  ctx.save();
  const NUM_VISIBLE_LANES = 6;
  const LANE_STEPS = 30;
  for (let i = 1; i < NUM_VISIBLE_LANES; i++) {
    const laneT = i / NUM_VISIBLE_LANES; // 0..1 across road width
    ctx.strokeStyle = 'rgba(60,100,180,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    for (let j = 0; j <= LANE_STEPS; j++) {
      const z = j / LANE_STEPS;
      const s = zToScreen(z);
      const lx = roadEdgeX(z, -1);
      const rx = roadEdgeX(z, 1);
      const x = lx + (rx - lx) * laneT;
      if (j === 0) ctx.moveTo(x, s.y);
      else ctx.lineTo(x, s.y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();

  // Road edges (neon, curved — fade out near horizon to create clean horizon line)
  ctx.save();
  for (const side of [-1, 1]) {
    ctx.beginPath();
    const FADE_START = 0.15; // start drawing edges from this z (avoid tip)
    let started = false;
    for (let i = 0; i <= CURVE_STEPS; i++) {
      const z = i / CURVE_STEPS;
      if (z < FADE_START) continue;
      const s = zToScreen(z);
      const x = roadEdgeX(z, side);
      if (!started) { ctx.moveTo(x, s.y); started = true; }
      else ctx.lineTo(x, s.y);
    }
    // Fade alpha along the edge
    const fadeAlpha = 0.8;
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#0088ff';
    ctx.strokeStyle = `rgba(0,136,255,${fadeAlpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();

  // Side barriers with lights
  drawSideBarriers();

  // Center lane highlight (subtle glow on the center "active" lane)
  drawCenterLaneGlow();
}

function drawSideBarriers() {
  const NUM_POSTS = 3;
  ctx.save();
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < NUM_POSTS; i++) {
      const z = (i + roadScroll) / NUM_POSTS;
      const s = zToScreen(z);
      if (s.t < 0.01) continue;
      const x = roadEdgeX(z, side) + side * 8 * s.t;
      const h = 25 * s.t;
      const alpha = Math.min(1, s.t * 2) * 0.6;

      ctx.fillStyle = `rgba(40,60,120,${alpha})`;
      ctx.fillRect(x - 2 * s.t, s.y - h, 4 * s.t, h);

      // Yellow light on top (like R2BEAT road lights)
      ctx.fillStyle = `rgba(255,200,50,${alpha * 0.9})`;
      ctx.shadowColor = '#ffcc33';
      ctx.shadowBlur = 10 * s.t;
      ctx.beginPath();
      ctx.arc(x, s.y - h, 3.5 * s.t, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

function drawCenterLaneGlow() {
  // Subtle glow on the center portion of the road
  ctx.save();
  const gw = 60; // glow width at bottom
  const grad = ctx.createLinearGradient(VX - gw, 0, VX + gw, 0);
  grad.addColorStop(0, 'rgba(0,150,255,0)');
  grad.addColorStop(0.3, 'rgba(0,150,255,0.04)');
  grad.addColorStop(0.5, 'rgba(0,150,255,0.07)');
  grad.addColorStop(0.7, 'rgba(0,150,255,0.04)');
  grad.addColorStop(1, 'rgba(0,150,255,0)');
  ctx.fillStyle = grad;
  // Draw from vanishing point to bottom
  ctx.beginPath();
  ctx.moveTo(VX - 3, VY);
  ctx.lineTo(VX - gw, ROAD_BOTTOM);
  ctx.lineTo(VX + gw, ROAD_BOTTOM);
  ctx.lineTo(VX + 3, VY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ============================================================
// RENDERING: Judgment Zone marker
// ============================================================
function drawJudgeZone() {
  const s = zToScreen(1.0);
  const y = s.y;

  ctx.save();
  const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 1000 * 4);

  // Horizontal glow line across the road
  ctx.shadowColor = '#00ccff';
  ctx.shadowBlur = 18 * pulse;
  ctx.strokeStyle = `rgba(0,200,255,${0.5 * pulse})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(VX - s.hw, y);
  ctx.lineTo(VX + s.hw, y);
  ctx.stroke();

  // Center "judgment" indicator - a pulsing circle at center
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 15 * pulse;
  ctx.strokeStyle = `rgba(0,255,200,${0.4 * pulse})`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(VX, y, 28, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// ============================================================
// RENDERING: Rhythm Balls (timing indicators)
// ============================================================
function drawRhythmBalls() {
  const now = musicTime();
  const s = zToScreen(1.0);
  const targetY = s.y;  // judgment zone Y
  const r = RHYTHM_BALL_RADIUS;

  ctx.save();

  // Draw approaching balls for upcoming obstacles
  for (const o of obstacles) {
    if (o.judged) continue;
    const timeDiff = o.time - now;
    if (timeDiff < 0 || timeDiff > RHYTHM_BALL_TRAVEL) continue;

    // Progress: 0 = at edge, 1 = at center
    const progress = 1 - (timeDiff / RHYTHM_BALL_TRAVEL);

    // Balls come from both left and right edges toward center
    const leftX = -r + (VX + r) * progress;
    const rightX = W + r - (W + r - VX) * progress;

    // Easing for smooth deceleration
    const eased = 1 - Math.pow(1 - progress, 2);
    const leftXE = -r + (VX + r) * eased;
    const rightXE = W + r - (W + r - VX) * eased;

    // Alpha: fade in, full near target
    const alpha = Math.min(1, progress * 2.5);

    // Default orange color
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = '#ff8833';
    ctx.shadowColor = '#ff8833';
    ctx.shadowBlur = 6;

    // Left ball
    ctx.beginPath();
    ctx.arc(leftXE, targetY, r, 0, Math.PI * 2);
    ctx.fill();

    // Right ball
    ctx.beginPath();
    ctx.arc(rightXE, targetY, r, 0, Math.PI * 2);
    ctx.fill();

    // Small trail effect
    if (progress > 0.1) {
      ctx.globalAlpha = alpha * 0.2;
      ctx.shadowBlur = 0;
      const trailOff = (1 - eased) * 30;
      ctx.beginPath();
      ctx.arc(leftXE - trailOff, targetY, r * 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(rightXE + trailOff, targetY, r * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw hit feedback flashes
  for (let i = rhythmBallFlashes.length - 1; i >= 0; i--) {
    const f = rhythmBallFlashes[i];
    f.timer -= dt;
    if (f.timer <= 0) {
      rhythmBallFlashes.splice(i, 1);
      continue;
    }

    const t = f.timer / 0.35; // normalize 0→1
    const flashR = r + (1 - t) * 12; // expand on hit

    // Color based on judgment
    let col, glowCol;
    if (f.judgment === 'PERFECT') {
      col = '#ffffff';
      glowCol = '#ffffff';
    } else if (f.judgment === 'GREAT') {
      col = '#ffdd88';
      glowCol = '#ffcc44';
    } else if (f.judgment === 'GOOD') {
      col = '#ff9933';
      glowCol = '#ff8822';
    } else if (f.judgment === 'BAD') {
      col = '#dd4422';
      glowCol = '#cc2200';
    } else {
      col = '#ff2244';
      glowCol = '#ff0022';
    }

    ctx.globalAlpha = t * 0.9;
    ctx.fillStyle = col;
    ctx.shadowColor = glowCol;
    ctx.shadowBlur = 20 * t;

    // Flash at center (both balls merged)
    ctx.beginPath();
    ctx.arc(VX, targetY, flashR, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// Add rhythm ball flash on judgment
function addRhythmBallFlash(judgment) {
  rhythmBallFlashes.push({ judgment, timer: 0.35 });
}

// ============================================================
// RENDERING: Obstacles
// ============================================================
function drawObstacles() {
  const now = musicTime();

  // Collect visible obstacles
  const visible = [];
  for (const o of obstacles) {
    const z = 1.0 - (o.time - now) / OBS_SCROLL_TIME;
    if (z < -0.02 || z > 1.3) continue;
    if (o.judged && o.judgment !== 'MISS') continue;
    visible.push({ obs: o, z });
  }
  visible.sort((a, b) => a.z - b.z);

  for (const { obs: o, z } of visible) {
    if (z < 0.05) continue;

    // Use road perspective mapping so obstacles move WITH the road surface
    const s = zToScreen(z);
    const y = s.y;
    // Smoother scaling: use sqrt-based curve capped at 0.85 to prevent sudden size jump
    const rawScale = Math.max(0.10, s.t);
    const scale = Math.min(0.85, rawScale);

    // Alpha: fade in gradually from far, dim if missed
    let alpha = Math.min(1, s.t * 2.5);
    if (o.judged && o.judgment === 'MISS') {
      const fadeZ = z - 1.0;
      alpha = Math.max(0, 1 - fadeZ * 4) * 0.35;
    }

    ctx.save();
    ctx.globalAlpha = alpha;

    const col = o.judged && o.judgment === 'MISS' ? '#555' : OBS_COLORS[o.type];
    // X offset for side obstacles follows curved road edges
    const curvedHW = ROAD_HW * Math.pow(Math.max(0, z), ROAD_CURVE_POW);
    const sideOff = curvedHW * 0.12;

    if (o.type === 'PYLON_R') {
      drawPylon(VX + sideOff, y, scale, col, false);
    } else if (o.type === 'PYLON_L') {
      drawPylon(VX - sideOff, y, scale, col, true);
    } else if (o.type === 'ARCH') {
      drawArch(VX, y, scale, col);
    } else if (o.type === 'BLOCK') {
      drawBlock(VX, y, scale, col);
    } else if (o.type === 'STAR_R') {
      drawStar(VX + sideOff, y, scale, col, false);
    } else if (o.type === 'STAR_L') {
      drawStar(VX - sideOff, y, scale, col, true);
    }

    // Near-judgment-line boost glow
    if (!o.judged && z > 0.8) {
      const boost = (z - 0.8) * 5;
      ctx.shadowColor = col;
      ctx.shadowBlur = 20 * boost;
      ctx.fillStyle = col;
      ctx.globalAlpha = boost * 0.15;
      ctx.beginPath();
      ctx.arc(VX, y, 35 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function drawPylon(x, y, scale, color, isLeft) {
  // Traffic cone / pylon shape
  const w = 28 * scale;
  const h = 70 * scale;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 8 * scale;

  // Cone body (trapezoid)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x - w, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w * 0.4, y - h);
  ctx.lineTo(x - w * 0.4, y - h);
  ctx.closePath();
  ctx.fill();

  // White stripes
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.7;
  const stripeH = h * 0.15;
  ctx.fillRect(x - w * 0.85, y - h * 0.35, w * 1.7, stripeH);
  ctx.fillRect(x - w * 0.65, y - h * 0.65, w * 1.3, stripeH);
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawArch(x, y, scale, color) {
  // Arch / gate shape - overhead obstacle
  const w = 90 * scale;
  const h = 85 * scale;
  const postW = 12 * scale;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 10 * scale;

  // Left post
  ctx.fillStyle = color;
  ctx.fillRect(x - w - postW, y - h, postW, h);
  // Right post
  ctx.fillRect(x + w, y - h, postW, h);
  // Top bar
  ctx.fillRect(x - w - postW, y - h - postW, w * 2 + postW * 2, postW);

  // Glow effect on top bar
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - w - postW, y - h - postW, w * 2 + postW * 2, postW * 0.5);
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawBlock(x, y, scale, color) {
  // Ground block - low obstacle to jump over
  const w = 70 * scale;
  const h = 38 * scale;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 8 * scale;

  // Block body
  ctx.fillStyle = color;
  ctx.fillRect(x - w, y - h, w * 2, h);

  // Top face (lighter)
  ctx.fillStyle = '#88ff88';
  ctx.globalAlpha = 0.4;
  ctx.fillRect(x - w, y - h, w * 2, h * 0.3);
  ctx.globalAlpha = 1;

  // Side highlight
  ctx.strokeStyle = '#fff';
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 1;
  ctx.strokeRect(x - w, y - h, w * 2, h);
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawStar(x, y, scale, color, isLeft) {
  // Yellow star collectible
  const r = 34 * scale;
  const ir = 16 * scale;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 12 * scale;
  ctx.fillStyle = color;

  // Rotate star slowly for sparkle effect
  const rot = performance.now() / 400;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const outerAngle = rot + (i * 2 * Math.PI / 5) - Math.PI / 2;
    const innerAngle = rot + ((i + 0.5) * 2 * Math.PI / 5) - Math.PI / 2;
    const ox = x + Math.cos(outerAngle) * r;
    const oy = (y - r * 0.5) + Math.sin(outerAngle) * r;
    const ix = x + Math.cos(innerAngle) * ir;
    const iy = (y - r * 0.5) + Math.sin(innerAngle) * ir;
    if (i === 0) ctx.moveTo(ox, oy);
    else ctx.lineTo(ox, oy);
    ctx.lineTo(ix, iy);
  }
  ctx.closePath();
  ctx.fill();

  // Inner highlight
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.arc(x, y - r * 0.5, ir * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}
function drawCharacter() {
  const baseY = ROAD_BOTTOM;  // feet ON the road at judgment line
  const phase = charPhase;

  // Calculate character position based on action
  let cx = VX;
  let cy = baseY;
  let scaleY = 1.0;

  if (charAction === 'DODGE_L') {
    const t = 1 - (charActionTimer / ACTION_DUR);
    const sway = Math.sin(t * Math.PI) * 60;
    cx = VX - sway;
  } else if (charAction === 'DODGE_R') {
    const t = 1 - (charActionTimer / ACTION_DUR);
    const sway = Math.sin(t * Math.PI) * 60;
    cx = VX + sway;
  } else if (charAction === 'DUCK') {
    scaleY = 0.5;
  } else if (charAction === 'JUMP') {
    cy = baseY - charJumpY;
  }

  // Running bounce (only while running)
  const isRunning = charAction === 'RUN';
  const bounce = isRunning ? Math.abs(Math.sin(phase)) * 4 : 0;
  const legSwing = isRunning ? Math.sin(phase) * 10 : 0;

  ctx.save();
  ctx.translate(cx, cy - bounce);

  // Character scale
  const sc = 1.6;
  ctx.scale(sc, sc * scaleY);

  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 2 + bounce, 20, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // --- Chibi Character: Blonde angel with punk outfit ---

  // GOLDEN WINGS (behind body)
  const wingBob = Math.sin(phase * 0.8) * 3;
  ctx.fillStyle = '#e8c840';
  ctx.strokeStyle = '#d4a828';
  ctx.lineWidth = 0.8;
  // Left wing
  ctx.save();
  ctx.translate(-10, -18 + wingBob);
  ctx.rotate(-0.3);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-20, -8, -30, -2);
  ctx.quadraticCurveTo(-26, -14, -34, -10);
  ctx.quadraticCurveTo(-28, -20, -32, -18);
  ctx.quadraticCurveTo(-22, -24, -18, -16);
  ctx.quadraticCurveTo(-12, -20, -8, -14);
  ctx.quadraticCurveTo(-4, -16, 0, -8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Wing feather highlights
  ctx.fillStyle = '#f0d860';
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(-2, -4);
  ctx.quadraticCurveTo(-14, -12, -20, -14);
  ctx.quadraticCurveTo(-12, -8, -2, -2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  // Right wing
  ctx.save();
  ctx.translate(10, -18 + wingBob);
  ctx.rotate(0.3);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(20, -8, 30, -2);
  ctx.quadraticCurveTo(26, -14, 34, -10);
  ctx.quadraticCurveTo(28, -20, 32, -18);
  ctx.quadraticCurveTo(22, -24, 18, -16);
  ctx.quadraticCurveTo(12, -20, 8, -14);
  ctx.quadraticCurveTo(4, -16, 0, -8);
  ctx.closePath();
  ctx.fillStyle = '#e8c840';
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#f0d860';
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(2, -4);
  ctx.quadraticCurveTo(14, -12, 20, -14);
  ctx.quadraticCurveTo(12, -8, 2, -2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  // Legs (jeans / denim blue)
  ctx.fillStyle = '#6688aa';
  ctx.beginPath();
  ctx.ellipse(-5 - legSwing * 0.3, -3, 5, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(5 + legSwing * 0.3, -3, 5, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shoes (dark boots)
  ctx.fillStyle = '#333344';
  ctx.beginPath();
  ctx.ellipse(-5 - legSwing * 0.3, 4, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(5 + legSwing * 0.3, 4, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  // Blue lace accents
  ctx.fillStyle = '#4466cc';
  ctx.beginPath();
  ctx.ellipse(-5 - legSwing * 0.3, 3, 2, 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();

  // Arms (black sleeves)

  ctx.quadraticCurveTo(-headR - 4, headY + 10, -headR + 2, headY + 16);

  ctx.lineTo(4, crownY);
  ctx.lineTo(9, crownY - 4);
  ctx.lineTo(8, crownY + 5);

  ctx.lineWidth = 0.8;
  ctx.stroke();

  ctx.moveTo(4 + tailWave, 0);

  ctx.restore();
}

// ============================================================
// RENDERING: HUD
// ============================================================
function drawHUD() {
  ctx.save();

  // Beat flash overlay
  if (beatFlash > 0) {
    ctx.fillStyle = `rgba(30,80,200,${beatFlash * 0.08})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Combo (top center, subtle) ----
  if (combo > 0) {
    const comboSize = Math.min(44, 30 + combo * 0.15);

    ctx.save();
    ctx.translate(VX, 48);

    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255,238,68,0.85)';
    ctx.font = `bold ${comboSize}px 'Impact', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(combo, 0, 0);

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,204,0,0.6)';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('COMBO', 0, comboSize / 2 + 10);

    ctx.restore();
  }

  // ---- Score (top right) ----
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#00ccff';
  ctx.fillStyle = '#00ddff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(String(score), W - 25, 18);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = 'rgba(100,200,255,0.7)';
  ctx.fillText('SCORE', W - 25, 44);

  // ---- Accuracy gauge (top-right circle) ----
  drawAccuracyGauge(W - 70, 110, 35);

  // ---- Judgment stats (left side) ----
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#00ddff';
  ctx.fillText('\u5224\u5B9A ' + accuracy.toFixed(1) + '%', 18, 20);

  const stats = [
    ['PERFECT', judgeCounts.PERFECT, JUDGE_COLORS.PERFECT],
    ['GREAT',   judgeCounts.GREAT,   JUDGE_COLORS.GREAT],
    ['GOOD',    judgeCounts.GOOD,    JUDGE_COLORS.GOOD],
    ['BAD',     judgeCounts.BAD,     JUDGE_COLORS.BAD],
    ['MISS',    judgeCounts.MISS,    JUDGE_COLORS.MISS],
  ];
  ctx.font = '12px sans-serif';
  stats.forEach(function(entry, idx) {
    ctx.fillStyle = entry[2];
    ctx.globalAlpha = 0.85;
    ctx.fillText(entry[0], 18, 44 + idx * 18);
    ctx.fillText(String(entry[1]), 85, 44 + idx * 18);
  });
  ctx.globalAlpha = 1;

  // ---- Controls hint (bottom corners) ----
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(100,200,255,0.4)';
  ctx.font = '11px sans-serif';
  ctx.fillText('BPM ' + BPM + ' — ' + SONGS[selectedSong].name, 18, H - 16);

  // ---- Progress bar (bottom of screen) ----
  const now = musicTime();
  const prog = Math.min(1, now / SONG_DURATION);

  // Background track
  ctx.fillStyle = 'rgba(30,30,60,0.7)';
  ctx.fillRect(20, H - 18, W - 40, 10);

  // Fill
  const progGrad = ctx.createLinearGradient(20, 0, W - 40, 0);
  progGrad.addColorStop(0, '#0088ff');
  progGrad.addColorStop(0.5, '#00ccff');
  progGrad.addColorStop(1, '#44ffcc');
  ctx.fillStyle = progGrad;
  ctx.fillRect(20, H - 18, (W - 40) * prog, 10);

  // Border
  ctx.strokeStyle = 'rgba(100,200,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, H - 18, W - 40, 10);

  // Progress marker dot
  const markerX = 20 + (W - 40) * prog;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#00ccff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(markerX, H - 13, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Percentage text
  ctx.fillStyle = 'rgba(200,230,255,0.7)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(Math.floor(prog * 100) + '%', W - 22, H - 6);

  // ---- Key indicators at bottom ----
  drawKeyIndicators();

  ctx.restore();
}

function drawKeyIndicators() {
  const indicators = [
    { key: 'ArrowLeft',  label: '←', x: VX - 120, color: '#ff6622' },
    { key: 'ArrowDown',  label: '↓', x: VX - 40,  color: '#00ccff' },
    { key: 'ArrowUp',    label: '↑', x: VX + 40,  color: '#44ff44' },
    { key: 'ArrowRight', label: '→', x: VX + 120, color: '#ff6622' },
  ];
  const y = H - 50;
  const size = 20;

  ctx.save();
  for (const ind of indicators) {
    const flash = keyFlash[ind.key] || 0;
    const alpha = 0.3 + flash * 0.7;

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = ind.color;
    ctx.shadowColor = ind.color;
    ctx.shadowBlur = flash * 15;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(ind.x - size, y - size, size * 2, size * 2, 5);
    ctx.stroke();

    if (flash > 0.1) {
      ctx.fillStyle = ind.color;
      ctx.globalAlpha = flash * 0.25;
      ctx.fill();
    }

    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ind.label, ind.x, y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawAccuracyGauge(cx, cy, r) {
  ctx.save();
  const startAngle = -Math.PI * 0.75;
  const endAngle = Math.PI * 0.75;
  const totalArc = endAngle - startAngle;

  ctx.strokeStyle = 'rgba(40,50,80,0.6)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, endAngle);
  ctx.stroke();

  const frac = accuracy / 100;
  const col = frac > 0.9 ? '#44ff88' : frac > 0.7 ? '#ffcc00' : '#ff4444';
  ctx.strokeStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 8;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, startAngle + totalArc * frac);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(accuracy.toFixed(1) + '%', cx, cy);

  ctx.font = '9px sans-serif';
  ctx.fillStyle = 'rgba(180,200,255,0.6)';
  ctx.fillText('ACCURACY', cx, cy + 15);

  ctx.restore();
}

// ============================================================
// RENDERING: Judgment Popup
// ============================================================
function drawJudgePopup() {
  if (judgeTimer <= 0 || !lastJudge) return;

  ctx.save();
  const t = judgeTimer / 0.5;
  const scale = 1 + (1 - t) * 0.3;
  const alpha = Math.min(1, t * 2);

  ctx.translate(VX, ROAD_BOTTOM - 120);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  ctx.shadowColor = JUDGE_COLORS[lastJudge];
  ctx.shadowBlur = 20;
  ctx.fillStyle = JUDGE_COLORS[lastJudge];
  ctx.font = "bold 34px 'Impact', sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(lastJudge, 0, 0);

  ctx.restore();
}

// ============================================================
// RENDERING: READY/GO Animation
// ============================================================
function drawReadyGo() {
  if (gameState !== 'READY_GO') return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const elapsed = READY_GO_DUR - readyGoTimer;

  if (elapsed < 1.5) {
    // READY phase
    const t = elapsed / 1.5;
    const scale = 1.0 + Math.sin(t * Math.PI) * 0.15;
    const alpha = t < 0.2 ? t / 0.2 : (t > 0.85 ? (1 - t) / 0.15 : 1.0);

    ctx.translate(VX, H / 2 - 40);
    ctx.scale(scale, scale);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#00ddff';
    ctx.font = "bold 90px 'Impact', sans-serif";
    ctx.fillText('READY', 0, 0);
  } else {
    // GO phase
    const t = (elapsed - 1.5) / 1.0;
    const scale = 1.2 + t * 0.8;
    const alpha = t < 0.3 ? t / 0.3 : Math.max(0, 1 - (t - 0.3) * 1.5);

    ctx.translate(VX, H / 2 - 40);
    ctx.scale(scale, scale);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 40;
    ctx.fillStyle = '#ffee00';
    ctx.font = "bold 120px 'Impact', sans-serif";
    ctx.fillText('GO!', 0, 0);
  }

  ctx.restore();
}

// ============================================================
// RENDERING: Goal Line
// ============================================================
function drawGoalLine() {
  if (goalLineZ < 0 || goalLineZ > 1.5) return;

  const z = Math.min(1.0, goalLineZ);
  const s = zToScreen(z);
  const y = s.y;
  const lx = roadEdgeX(z, -1);
  const rx = roadEdgeX(z, 1);

  ctx.save();
  const alpha = Math.min(1, z * 2);
  ctx.globalAlpha = alpha;

  // Checkered finish line
  const lineH = 12 * Math.max(0.3, s.t);
  const numChecks = 16;
  const checkW = (rx - lx) / numChecks;
  for (let i = 0; i < numChecks; i++) {
    ctx.fillStyle = (i % 2 === 0) ? '#fff' : '#111';
    ctx.fillRect(lx + i * checkW, y - lineH, checkW, lineH);
  }
  // Second row offset
  for (let i = 0; i < numChecks; i++) {
    ctx.fillStyle = (i % 2 === 1) ? '#fff' : '#111';
    ctx.fillRect(lx + i * checkW, y, checkW, lineH);
  }

  // "GOAL" text above
  if (z > 0.3) {
    const textScale = Math.max(0.5, s.t);
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffee00';
    ctx.font = `bold ${Math.round(36 * textScale)}px 'Impact', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('GOAL', VX, y - lineH - 5 * textScale);
  }

  ctx.restore();
}

function drawStartScreen() {
  const t = performance.now() / 1000;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Title
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 30 * pulse;
  ctx.font = "bold 100px 'Impact', sans-serif";
  ctx.fillStyle = 'rgba(0,255,200,' + pulse + ')';
  ctx.fillText('RRBe', VX, H / 2 - 130);

  // Subtitle
  ctx.shadowColor = '#8844ff';
  ctx.shadowBlur = 15;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#cc88ff';
  ctx.fillText('RACE & RHYTHM BEAT', VX, H / 2 - 65);

  // Controls
  ctx.shadowBlur = 0;
  ctx.font = '15px sans-serif';
  ctx.fillStyle = 'rgba(150,220,255,0.85)';
  const lines = [
    'Obstacles rush toward you — dodge them to the beat!',
    '',
    '\uD83D\uDEA7 Pylon on RIGHT  \u2192  press \u2190 LEFT to dodge',
    '\uD83D\uDEA7 Pylon on LEFT   \u2192  press \u2192 RIGHT to dodge',
    '\uD83C\uDF09 Arch overhead   \u2192  press \u2193 DOWN to duck',
    '\uD83E\uDDF1 Block on ground  \u2192  press \u2191 UP to jump',
    '\u2B50 Star on RIGHT   \u2192  press \u2192 RIGHT to collect',
    '\u2B50 Star on LEFT    \u2192  press \u2190 LEFT to collect',
    '',
    'Timing matters: PERFECT \u2192 GREAT \u2192 GOOD \u2192 BAD \u2192 MISS',
  ];
  lines.forEach(function(l, i) { ctx.fillText(l, VX, H / 2 - 20 + i * 24); });

  // Obstacle preview icons
  const iconY = H / 2 + lines.length * 24;
  const icons = [
    { label: '←', color: '#ff6622' },
    { label: '↓', color: '#00ccff' },
    { label: '↑', color: '#44ff44' },
    { label: '→', color: '#ff6622' },

  icons.forEach(function(ic, i) {

  ctx.shadowBlur = 0;

  // Press space
  const sp = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 12 * sp;
  ctx.fillStyle = 'rgba(255,238,0,' + sp + ')';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('PRESS SPACE TO START', VX, H / 2 + 230);

  ctx.restore();
}

function drawResultScreen() {
  const t = performance.now() / 1000;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = 'rgba(0,0,10,0.75)';
  ctx.fillRect(0, 0, W, H);

  // Grade
  var grade;
  if (accuracy >= 95)      grade = 'S';
  else if (accuracy >= 90) grade = 'A';
  else if (accuracy >= 80) grade = 'B';
  else if (accuracy >= 70) grade = 'C';
  else if (accuracy >= 60) grade = 'D';
  else                     grade = 'F';

  const gradeColors = {
    S: '#00ffff', A: '#44ff44', B: '#88cc00',
    C: '#ffcc00', D: '#ff8800', F: '#ff2244'
  };

  const pulse = 0.8 + 0.2 * Math.sin(t * 3);
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 20 * pulse;
  ctx.fillStyle = 'rgba(0,255,200,' + pulse + ')';
  ctx.font = "bold 50px 'Impact', sans-serif";
  ctx.fillText('STAGE CLEAR!', VX, 80);

  ctx.shadowColor = gradeColors[grade];
  ctx.shadowBlur = 40;
  ctx.fillStyle = gradeColors[grade];
  ctx.font = "bold 120px 'Impact', sans-serif";
  ctx.fillText(grade, VX, 200);

  ctx.shadowBlur = 0;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = '#00ddff';
  ctx.fillText('SCORE: ' + score, VX, 300);

  ctx.fillStyle = '#ffee44';
  ctx.font = '20px sans-serif';
  ctx.fillText('MAX COMBO: ' + maxCombo, VX, 335);

  ctx.fillStyle = '#fff';
  ctx.fillText('ACCURACY: ' + accuracy.toFixed(2) + '%', VX, 365);

  // ALL COMBO display when no misses
  if (judgeCounts.MISS === 0 && obstacles.length > 0) {
    const acPulse = 0.7 + 0.3 * Math.sin(t * 5);
    ctx.save();
    ctx.shadowColor = '#ff44ff';
    ctx.shadowBlur = 30 * acPulse;
    ctx.fillStyle = `rgba(255,100,255,${acPulse})`;
    ctx.font = "bold 44px 'Impact', sans-serif";
    ctx.fillText('✨ ALL COMBO ✨', VX, 270);
    ctx.restore();
  }

  // Judgment breakdown
  const resultStats = [
    ['PERFECT', judgeCounts.PERFECT, JUDGE_COLORS.PERFECT],
    ['GREAT',   judgeCounts.GREAT,   JUDGE_COLORS.GREAT],
    ['GOOD',    judgeCounts.GOOD,    JUDGE_COLORS.GOOD],
    ['BAD',     judgeCounts.BAD,     JUDGE_COLORS.BAD],
    ['MISS',    judgeCounts.MISS,    JUDGE_COLORS.MISS],
  ];
  ctx.font = '16px sans-serif';
  const statsY = 410;
  const total = obstacles.length;
  resultStats.forEach(function(entry, idx) {
    const x = VX - 200 + idx * 100;
    ctx.fillStyle = entry[2];
    ctx.fillText(entry[0], x, statsY);
    ctx.fillStyle = '#fff';
    ctx.fillText(String(entry[1]), x, statsY + 22);
    const barW = 60;
    const barH = 4;
    const frac = total > 0 ? entry[1] / total : 0;
    ctx.fillStyle = 'rgba(40,40,80,0.6)';
    ctx.fillRect(x - barW / 2, statsY + 32, barW, barH);
    ctx.fillStyle = entry[2];
    ctx.fillRect(x - barW / 2, statsY + 32, barW * frac, barH);
  });

  const rp = 0.5 + 0.5 * Math.sin(t * 3.5);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 10 * rp;
  ctx.fillStyle = 'rgba(255,238,0,' + rp + ')';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('PRESS R or SPACE TO RESTART', VX, H - 60);

  ctx.restore();
}

// ============================================================
// RENDERING: Song Select Screen
// ============================================================
function drawSongSelectScreen() {
  const t = performance.now() / 1000;
  const pulse = 0.7 + 0.3 * Math.sin(t * 3);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Title
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 30 * pulse;
  ctx.font = "bold 80px 'Impact', sans-serif";
  ctx.fillStyle = `rgba(0,255,200,${pulse})`;
  ctx.fillText('RRBe', VX, 80);

  ctx.shadowColor = '#8844ff';
  ctx.shadowBlur = 15;
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#cc88ff';
  ctx.fillText('RACE & RHYTHM BEAT', VX, 130);

  // Select label
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('SELECT SONG', VX, 200);

  // Song cards
  for (let i = 0; i < SONGS.length; i++) {
    const song = SONGS[i];
    const isSelected = i === songSelectIndex;
    const cardX = VX - 180 + i * 180;
    const cardY = 300;
    const cardW = 150;
    const cardH = 180;

    // Card background
    ctx.save();
    if (isSelected) {
      const sp = 0.6 + 0.4 * Math.sin(t * 4);
      ctx.shadowColor = song.color;
      ctx.shadowBlur = 20 * sp;
      ctx.strokeStyle = song.color;
      ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(20,20,60,0.9)';
    } else {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(100,100,150,0.5)';
      ctx.lineWidth = 1;
      ctx.fillStyle = 'rgba(10,10,30,0.7)';
    }

    ctx.beginPath();
    ctx.roundRect(cardX - cardW / 2, cardY - cardH / 2, cardW, cardH, 10);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // BPM number (big)
    ctx.save();
    ctx.fillStyle = isSelected ? song.color : 'rgba(150,150,200,0.6)';
    ctx.font = "bold 48px 'Impact', sans-serif";
    ctx.shadowColor = isSelected ? song.color : 'transparent';
    ctx.shadowBlur = isSelected ? 10 : 0;
    ctx.fillText(String(song.bpm), cardX, cardY - 30);
    ctx.restore();

    // BPM label
    ctx.fillStyle = isSelected ? '#fff' : 'rgba(150,150,200,0.5)';
    ctx.font = '14px sans-serif';
    ctx.fillText('BPM', cardX, cardY + 10);

    // Song name
    ctx.fillStyle = isSelected ? '#fff' : 'rgba(150,150,200,0.5)';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(song.name, cardX, cardY + 40);

    // Difficulty description
    ctx.fillStyle = isSelected ? song.color : 'rgba(150,150,200,0.4)';
    ctx.font = '12px sans-serif';
    ctx.fillText(song.desc, cardX, cardY + 60);
  }

  // Navigation hint
  ctx.fillStyle = 'rgba(150,220,255,0.6)';
  ctx.font = '14px sans-serif';
  ctx.fillText('← → to select, SPACE to confirm', VX, 440);

  // Controls reminder
  ctx.shadowBlur = 0;
  ctx.font = '13px sans-serif';
  ctx.fillStyle = 'rgba(150,220,255,0.65)';
  const lines = [
    '🚧 Pylon RIGHT → press ← LEFT    🚧 Pylon LEFT → press → RIGHT',
    '🌉 Arch → press ↓ DOWN            🧱 Block → press ↑ UP',
    '⭐ Star RIGHT → press → RIGHT     ⭐ Star LEFT → press ← LEFT',
  ];
  lines.forEach(function(l, idx) { ctx.fillText(l, VX, 490 + idx * 22); });

  // Press space
  const sp = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.shadowColor = '#ffee00';
  ctx.shadowBlur = 12 * sp;
  ctx.fillStyle = `rgba(255,238,0,${sp})`;
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('PRESS SPACE TO START', VX, H - 50);

  ctx.restore();
}

// ============================================================
// MAIN DRAW
// ============================================================
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg();

  if (gameState === 'SONG_SELECT') {
    drawTrack();
    drawCharacter();
    drawSongSelectScreen();
    return;
  }

  if (gameState === 'START') {
    drawTrack();
    drawJudgeZone();
    drawCharacter();
    drawStartScreen();
    return;
  }

  if (gameState === 'READY_GO') {
    drawTrack();
    drawJudgeZone();
    drawCharacter();
    drawReadyGo();
    return;
  }

  drawTrack();
  drawGoalLine();
  drawObstacles();
  drawJudgeZone();
  drawRhythmBalls();
  drawCharacter();
  drawPart();
  drawHUD();
  drawJudgePopup();

  if (gameState === 'RESULT') drawResultScreen();
}

// ============================================================
// GAME LIFECYCLE
// ============================================================
function resetGame() {
  gameState = 'READY_GO';
  readyGoTimer = READY_GO_DUR;
  goalLineZ = -1;
  obstacles = generateChart();
  score = 0; combo = 0; maxCombo = 0;
  judgeCounts = { PERFECT: 0, GREAT: 0, GOOD: 0, BAD: 0, MISS: 0 };
  accuracy = 100;
  lastJudge = null; judgeTimer = 0;
  beatFlash = 0;
  particles = [];
  rhythmBallFlashes = [];
  roadScroll = 0; charPhase = 0;
  charAction = 'RUN'; charActionTimer = 0; charJumpY = 0;
  keyFlash = { ArrowLeft: 0, ArrowRight: 0, ArrowDown: 0, ArrowUp: 0 };

  if (audioCtx) {
    stepCount = 0; beatCount = 0; melodyPos = 0;
    nextStepTime = audioCtx.currentTime + READY_GO_DUR + 0.05;
    gameStartTime = audioCtx.currentTime + READY_GO_DUR;
  }
}

function selectSong(idx) {
  selectedSong = idx;
  const song = SONGS[idx];
  BPM = song.bpm;
  BEAT_S = 60 / BPM;
  STEP_S = BEAT_S / 4;
  SONG_BARS = song.bars;
  SONG_DURATION = SONG_BARS * 4 * BEAT_S;
  gameState = 'START';
}

function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  resetGame();
}

function resetToStart() {
  gameState = 'SONG_SELECT';
}

// ============================================================
// GAME LOOP
// ============================================================
lastTime = performance.now();

function gameLoop(ts) {
  dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  update(dt);
  draw();

  for (const k in justPressed) delete justPressed[k];
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
